<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="640" height="400" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="26" font-size="14.5" fill="#20201a" text-anchor="middle" font-weight="700">제이드 리자드(Jade Lizard) 만기 손익 구조</text>
<text x="320" y="44" font-size="10.5" fill="#5a5950" text-anchor="middle">숏풋 1개 + 콜 크레딧 스프레드(숏콜+롱콜) — 총 크레딧 &gt; 콜 스프레드 폭일 때</text>

<!-- axes -->
<line x1="45" y1="60" x2="45" y2="330" stroke="#c7c6bb" stroke-width="1"/>
<line x1="45" y1="330" x2="615" y2="330" stroke="#c7c6bb" stroke-width="1"/>
<text x="330" y="352" font-size="9.5" fill="#767568" text-anchor="middle">만기 시 주가 →</text>

<!-- zero P&L reference line -->
<line x1="45" y1="190" x2="615" y2="190" stroke="#9a9888" stroke-width="1" stroke-dasharray="2,3"/>
<text x="52" y="183" font-size="8.5" fill="#767568">손익 0</text>

<!-- max profit reference -->
<line x1="140" y1="110" x2="330" y2="110" stroke="#1f9d55" stroke-width="1" stroke-dasharray="3,3"/>
<text x="615" y="104" font-size="9" fill="#177a42" text-anchor="end">최대 이익 (세 다리 크레딧 합)</text>

<!-- unlimited downside arrow hint -->
<path d="M 30,300 L 45,290" stroke="#a5342c" stroke-width="1.6" fill="none"/>
<path d="M 30,300 L 38,300 M 30,300 L 30,292" stroke="#a5342c" stroke-width="1.6" fill="none"/>
<text x="55" y="312" font-size="8.5" fill="#a5342c">하락 시 손실 무제한</text>

<!-- payoff path -->
<path d="M 45,290 L 140,110 L 330,110 L 420,170 L 615,170" fill="none" stroke="#1a5fb4" stroke-width="2.8"/>

<!-- strike markers -->
<line x1="140" y1="95" x2="140" y2="335" stroke="#c7c6bb" stroke-width="1" stroke-dasharray="2,3"/>
<text x="140" y="348" font-size="9" fill="#5a5950" text-anchor="middle" font-weight="700">숏풋</text>

<line x1="330" y1="95" x2="330" y2="335" stroke="#c7c6bb" stroke-width="1" stroke-dasharray="2,3"/>
<text x="330" y="348" font-size="9" fill="#5a5950" text-anchor="middle" font-weight="700">숏콜</text>

<line x1="420" y1="95" x2="420" y2="335" stroke="#c7c6bb" stroke-width="1" stroke-dasharray="2,3"/>
<text x="420" y="348" font-size="9" fill="#5a5950" text-anchor="middle" font-weight="700">롱콜</text>

<!-- zone labels -->
<text x="95" y="250" font-size="8.5" fill="#a5342c" text-anchor="middle">무위험 구간 없음</text>
<text x="95" y="261" font-size="8.5" fill="#a5342c" text-anchor="middle">(숏 스트랭글과 동일)</text>

<text x="235" y="130" font-size="8.5" fill="#177a42" text-anchor="middle">숏풋~숏콜 사이: 최대 이익 구간</text>

<text x="520" y="155" font-size="8.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">롱콜 위: 손실 0 이하로 안 내려감</text>
<text x="520" y="167" font-size="8.5" fill="#1a5fb4" text-anchor="middle">= 상단 무위험 구간</text>

<text x="320" y="378" font-size="9.5" fill="#767568" text-anchor="middle">총 크레딧이 콜 스프레드 폭보다 작으면 상단에도 리스크가 남는다</text>
</svg>
