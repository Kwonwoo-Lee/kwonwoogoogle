<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="640" height="400" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="22" font-size="13.5" fill="#20201a" text-anchor="middle" font-weight="700">배당 캡처: 배당락일 가격 조정과 배당금의 상쇄 구조</text>

<!-- legend box -->
<rect x="424" y="30" width="186" height="82" rx="6" fill="#f3f2ec" stroke="#e1e0d9"/>
<text x="434" y="44" font-size="9.5" fill="#5a5950" font-weight="700">표시 안내</text>
<circle cx="438" cy="57" r="4" fill="#1a5fb4"/>
<text x="447" y="60.5" font-size="9" fill="#20201a">매수일 (배당락 전날)</text>
<circle cx="438" cy="72" r="4" fill="#d0453b"/>
<text x="447" y="75.5" font-size="9" fill="#20201a">배당락일 (가격 조정)</text>
<rect x="434" y="81" width="8" height="8" fill="#2f8f5b" opacity="0.6"/>
<text x="447" y="88.5" font-size="9" fill="#20201a">배당금 수취 (+$500)</text>
<rect x="434" y="96" width="8" height="8" fill="#d0453b" opacity="0.6"/>
<text x="447" y="103.5" font-size="9" fill="#20201a">배당락 하락분 (−$500)</text>

<!-- price timeline -->
<line x1="40" y1="120" x2="400" y2="120" stroke="#9c9b8f" stroke-width="1.6"/>
<g font-size="9" fill="#5a5950" text-anchor="middle">
<line x1="80" y1="114" x2="80" y2="126" stroke="#9c9b8f"/>
<text x="80" y="140">D-1 (매수)</text>
<line x1="220" y1="114" x2="220" y2="126" stroke="#9c9b8f"/>
<text x="220" y="140">배당락일</text>
<line x1="360" y1="114" x2="360" y2="126" stroke="#9c9b8f"/>
<text x="360" y="140">D+1 (매도)</text>
</g>

<!-- price line: flat at 50, step down at ex-div to 49.50, flat after -->
<polyline points="80,90 220,90 220,98 360,98" fill="none" stroke="#1a5fb4" stroke-width="2.4"/>
<circle cx="80" cy="90" r="5" fill="#1a5fb4"/>
<text x="80" y="76" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">$50.00</text>
<circle cx="220" cy="98" r="5" fill="#d0453b"/>
<text x="248" y="101" font-size="10" fill="#b03a30" font-weight="700">$49.50 (−$0.50)</text>
<circle cx="360" cy="98" r="5" fill="#5a5950"/>

<!-- offset bars: dividend vs price drop -->
<text x="320" y="172" font-size="11" fill="#20201a" text-anchor="middle" font-weight="700">주당 $0.50 배당 기준 — 수취분과 하락분은 상쇄되도록 설계</text>
<g font-size="9.5" fill="#20201a">
<text x="46" y="196" font-weight="700">배당금 수취</text>
<rect x="150" y="186" width="120" height="16" fill="#2f8f5b" opacity="0.75"/>
<text x="210" y="197" font-size="8.5" fill="#fff" text-anchor="middle">+$500 (세전)</text>
<text x="46" y="222" font-weight="700">배당락 하락분</text>
<rect x="150" y="212" width="120" height="16" fill="#d0453b" opacity="0.75"/>
<text x="210" y="223" font-size="8.5" fill="#fff" text-anchor="middle">−$500 (평가손실)</text>
</g>
<line x1="150" y1="234" x2="500" y2="234" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="2,3"/>
<text x="500" y="200" font-size="9" fill="#5a5950">세전 상쇄 = $0</text>
<text x="500" y="222" font-size="9" fill="#b03a30">+수수료·세금 = 순손실</text>

<!-- divider -->
<line x1="40" y1="250" x2="612" y2="250" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="3,3"/>
<text x="320" y="268" font-size="11" fill="#20201a" text-anchor="middle" font-weight="700">기법 A vs 기법 B: 가격 하락 리스크를 누가 떠안는가</text>

<!-- Technique A: naked capture -->
<text x="46" y="296" font-size="9.5" fill="#5a5950" font-weight="700">기법 A</text>
<rect x="100" y="286" width="120" height="16" fill="#1a5fb4" opacity="0.8"/>
<text x="160" y="297" font-size="8.5" fill="#fff" text-anchor="middle">주식 매수</text>
<rect x="220" y="286" width="340" height="16" fill="#d0453b" opacity="0.35"/>
<text x="390" y="297" font-size="8.5" fill="#8a2a22" text-anchor="middle">가격 하락 리스크 전액 노출 (헤지 없음)</text>

<!-- Technique B: hedged -->
<text x="46" y="326" font-size="9.5" fill="#5a5950" font-weight="700">기법 B</text>
<rect x="100" y="316" width="120" height="16" fill="#8a4fd1" opacity="0.8"/>
<text x="160" y="327" font-size="8.5" fill="#fff" text-anchor="middle">주식 + 풋옵션</text>
<rect x="220" y="316" width="200" height="16" fill="#8a4fd1" opacity="0.3"/>
<text x="320" y="327" font-size="8.5" fill="#4a2e73" text-anchor="middle">리스크 제한</text>
<rect x="420" y="316" width="140" height="16" fill="#e8a33d" opacity="0.5"/>
<text x="490" y="327" font-size="8.5" fill="#7a5018" text-anchor="middle">옵션 비용 발생</text>

<line x1="40" y1="350" x2="612" y2="350" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="3,3"/>
<text x="320" y="368" font-size="9.5" fill="#5a5950" text-anchor="middle">가격 하락이 배당금과 정확히 같다는 보장은 없다 — 거래비용·세금이 남은 마진을 먼저 잡아먹는다</text>
</svg>
