<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="640" height="420" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="24" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">듀얼 모멘텀(GEM) 전략: 매달 두 단계로 배분을 결정하는 흐름</text>

<defs>
  <marker id="dmArrowKo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#767568"/>
  </marker>
  <marker id="dmArrowGreenKo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#1f9d55"/>
  </marker>
  <marker id="dmArrowRedKo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#d0453b"/>
  </marker>
</defs>

<!-- input boxes: SPY / EFA 12-month returns -->
<rect x="55" y="46" width="230" height="58" rx="8" fill="#1a5fb4" opacity="0.09" stroke="#1a5fb4" stroke-width="1.2"/>
<text x="170" y="68" font-size="12.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">미국 주식 (SPY)</text>
<text x="170" y="86" font-size="11" fill="#5a5950" text-anchor="middle">최근 12개월 수익률</text>

<rect x="355" y="46" width="230" height="58" rx="8" fill="#1a5fb4" opacity="0.09" stroke="#1a5fb4" stroke-width="1.2"/>
<text x="470" y="68" font-size="12.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">해외 선진국 주식 (EFA)</text>
<text x="470" y="86" font-size="11" fill="#5a5950" text-anchor="middle">최근 12개월 수익률</text>

<path d="M 170,104 L 170,122 L 320,138" fill="none" stroke="#767568" stroke-width="1.4"/>
<path d="M 470,104 L 470,122 L 320,138" fill="none" stroke="#767568" stroke-width="1.4" marker-end="url(#dmArrowKo)"/>

<!-- step 1: relative momentum -->
<rect x="160" y="140" width="320" height="56" rx="8" fill="#8a4fd1" opacity="0.1" stroke="#8a4fd1" stroke-width="1.4"/>
<text x="320" y="162" font-size="12.5" fill="#8a4fd1" text-anchor="middle" font-weight="700">1단계 · 상대 모멘텀</text>
<text x="320" y="180" font-size="11" fill="#5a5950" text-anchor="middle">두 수익률 중 더 높은 쪽을 후보로 선택</text>

<path d="M 320,196 L 320,220" fill="none" stroke="#767568" stroke-width="1.4" marker-end="url(#dmArrowKo)"/>

<!-- step 2: absolute momentum -->
<rect x="130" y="222" width="380" height="58" rx="8" fill="#c98a1f" opacity="0.1" stroke="#c98a1f" stroke-width="1.4"/>
<text x="320" y="245" font-size="12.5" fill="#c98a1f" text-anchor="middle" font-weight="700">2단계 · 절대 모멘텀</text>
<text x="320" y="263" font-size="11" fill="#5a5950" text-anchor="middle">선택된 자산의 수익률 vs 미국 단기국채(BIL)</text>

<!-- branches -->
<path d="M 220,280 L 150,310" fill="none" stroke="#1f9d55" stroke-width="1.6" marker-end="url(#dmArrowGreenKo)"/>
<text x="150" y="300" font-size="11" fill="#1f9d55" text-anchor="middle" font-weight="700">통과</text>

<path d="M 420,280 L 490,310" fill="none" stroke="#d0453b" stroke-width="1.6" marker-end="url(#dmArrowRedKo)"/>
<text x="492" y="300" font-size="11" fill="#d0453b" text-anchor="middle" font-weight="700">탈락</text>

<rect x="35" y="320" width="230" height="70" rx="8" fill="#1f9d55" opacity="0.09" stroke="#1f9d55" stroke-width="1.4"/>
<text x="150" y="345" font-size="12.5" fill="#1f9d55" text-anchor="middle" font-weight="700">선택된 주식 자산 보유</text>
<text x="150" y="363" font-size="10.5" fill="#5a5950" text-anchor="middle">1단계에서 고른 쪽을</text>
<text x="150" y="378" font-size="10.5" fill="#5a5950" text-anchor="middle">전체 비중으로 유지</text>

<rect x="375" y="320" width="230" height="70" rx="8" fill="#d0453b" opacity="0.09" stroke="#d0453b" stroke-width="1.4"/>
<text x="490" y="345" font-size="12.5" fill="#d0453b" text-anchor="middle" font-weight="700">채권(AGG)으로 전환</text>
<text x="490" y="363" font-size="10.5" fill="#5a5950" text-anchor="middle">주식 비중 전부 걷어내고</text>
<text x="490" y="378" font-size="10.5" fill="#5a5950" text-anchor="middle">현금성 자산으로 피신</text>

<text x="320" y="412" font-size="10" fill="#767568" text-anchor="middle">이 과정을 매월 말 한 번씩 반복합니다</text>
</svg>
