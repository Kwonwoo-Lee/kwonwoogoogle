<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="620" height="380" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="13.5" fill="#20201a" text-anchor="middle" font-weight="700">BOS (Break of Structure) vs CHoCH (Change of Character)</text>

<line x1="310" y1="34" x2="310" y2="345" stroke="#e1e0d9" stroke-width="1"/>

<text x="35" y="52" font-size="12" fill="#5a5950" font-weight="700">① BOS: uptrend continuation confirmed</text>

<line x1="90" y1="150" x2="195" y2="150" stroke="#767568" stroke-width="1.3" stroke-dasharray="5,4"/>
<text x="95" y="143" font-size="9.5" fill="#767568">prior swing high</text>

<path d="M 45,260 L 90,150 L 140,200 L 190,100 L 240,160 L 285,70" fill="none" stroke="#1a5fb4" stroke-width="3"/>

<circle cx="45" cy="260" r="4" fill="#5a5950"/>
<circle cx="90" cy="150" r="4.5" fill="#1a5fb4"/>
<text x="90" y="140" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">HH</text>
<circle cx="140" cy="200" r="4.5" fill="#1a5fb4"/>
<text x="140" y="216" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">HL</text>
<circle cx="190" cy="100" r="5.5" fill="#1f9d55"/>
<text x="196" y="94" font-size="10" fill="#1f9d55" font-weight="700">HH (BOS ↑)</text>
<circle cx="240" cy="160" r="4.5" fill="#1a5fb4"/>
<text x="240" y="176" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">HL</text>
<circle cx="285" cy="70" r="4.5" fill="#1a5fb4"/>
<text x="278" y="60" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">HH</text>

<line x1="190" y1="100" x2="190" y2="150" stroke="#1f9d55" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="45" y="300" font-size="10" fill="#20201a">HH-HL repeats, then closes above the prior high (BOS)</text>
<text x="45" y="317" font-size="10" fill="#20201a">= confirmation the trend is still intact</text>

<text x="335" y="52" font-size="12" fill="#5a5950" font-weight="700">② CHoCH: first reversal signal</text>

<line x1="345" y1="250" x2="450" y2="250" stroke="#767568" stroke-width="1.3" stroke-dasharray="5,4"/>
<text x="350" y="243" font-size="9.5" fill="#767568">prior swing low (HL)</text>

<path d="M 345,250 L 395,140 L 445,280 L 495,200 L 545,330 L 590,300" fill="none" stroke="#1a5fb4" stroke-width="3"/>

<circle cx="345" cy="250" r="4.5" fill="#1a5fb4"/>
<text x="345" y="266" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">HL</text>
<circle cx="395" cy="140" r="4.5" fill="#1a5fb4"/>
<text x="395" y="130" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">HH</text>
<circle cx="445" cy="280" r="5.5" fill="#d0453b"/>
<text x="451" y="288" font-size="10" fill="#d0453b" font-weight="700">CHoCH ↓</text>
<circle cx="495" cy="200" r="4.5" fill="#8a4fd1"/>
<text x="495" y="192" font-size="10" fill="#6a3aa8" text-anchor="middle" font-weight="700">LH</text>
<circle cx="545" cy="330" r="5.5" fill="#d0453b"/>
<text x="549" y="345" font-size="10" fill="#d0453b" font-weight="700">LL (BOS ↓)</text>

<line x1="445" y1="280" x2="545" y2="280" stroke="#767568" stroke-width="1.3" stroke-dasharray="5,4"/>

<line x1="445" y1="250" x2="445" y2="280" stroke="#d0453b" stroke-width="1.5" stroke-dasharray="3,2"/>

<text x="335" y="317" font-size="10" fill="#20201a">Prior HL closes through (CHoCH), bounce stalls at LH</text>
<text x="335" y="334" font-size="10" fill="#20201a">→ a fresh LL with bearish BOS confirms new down-structure</text>
</svg>
