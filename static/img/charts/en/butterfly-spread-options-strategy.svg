<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="26" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">Butterfly Spread: Payoff at Expiration vs. Iron Butterfly's Cash Flow</text>

<text x="320" y="52" font-size="11" fill="#5a5950" text-anchor="middle" font-weight="700">Call butterfly (opens for a debit, max profit at the middle strike)</text>

<line x1="90" y1="300" x2="560" y2="300" stroke="#9c9b8f" stroke-width="1.2"/>
<text x="565" y="304" font-size="9" fill="#767568">Price at expiration</text>

<path d="M 110,300 L 160,300 L 240,140 L 320,300 L 400,300" fill="none" stroke="#1a5fb4" stroke-width="2.8"/>

<line x1="110" y1="140" x2="400" y2="140" stroke="#1f9d55" stroke-width="1" stroke-dasharray="3,3"/>
<text x="405" y="144" font-size="9" fill="#177a42" text-anchor="start">Max profit (one point: middle strike)</text>

<line x1="110" y1="300" x2="400" y2="300" stroke="#d0453b" stroke-width="1" stroke-dasharray="3,3"/>
<text x="405" y="298" font-size="9" fill="#a5342c" text-anchor="start">Max loss = debit paid</text>

<line x1="160" y1="128" x2="160" y2="312" stroke="#c7c6bb" stroke-width="1" stroke-dasharray="2,3"/>
<text x="160" y="326" font-size="8.5" fill="#767568" text-anchor="middle">Long call (lower)</text>
<text x="160" y="338" font-size="8" fill="#9c9b8f" text-anchor="middle">$90</text>

<line x1="240" y1="128" x2="240" y2="312" stroke="#c7c6bb" stroke-width="1" stroke-dasharray="2,3"/>
<text x="240" y="326" font-size="8.5" fill="#767568" text-anchor="middle">2x short call (middle)</text>
<text x="240" y="338" font-size="8" fill="#9c9b8f" text-anchor="middle">$100</text>

<line x1="320" y1="128" x2="320" y2="312" stroke="#c7c6bb" stroke-width="1" stroke-dasharray="2,3"/>
<text x="320" y="326" font-size="8.5" fill="#767568" text-anchor="middle">Long call (upper)</text>
<text x="320" y="338" font-size="8" fill="#9c9b8f" text-anchor="middle">$110</text>

<rect x="440" y="120" width="160" height="58" rx="8" fill="#fbf6e9" stroke="#e0c98f"/>
<text x="520" y="138" font-size="9.5" fill="#8a6a1f" text-anchor="middle" font-weight="700">Cash flow at entry</text>
<text x="520" y="154" font-size="9" fill="#5a5950" text-anchor="middle">Butterfly: pay debit →</text>
<text x="520" y="167" font-size="9" fill="#5a5950" text-anchor="middle">Iron butterfly: collect credit ←</text>

<text x="320" y="375" font-size="9.5" fill="#767568" text-anchor="middle">Same triangular shape as the iron butterfly, but the direction money flows is reversed</text>
</svg>
