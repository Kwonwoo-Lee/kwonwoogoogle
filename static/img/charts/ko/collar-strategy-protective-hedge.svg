<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="640" height="400" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="26" font-size="14.5" fill="#20201a" text-anchor="middle" font-weight="700">칼라 전략: 주식 단독 보유 vs 칼라 적용 시 손익 비교</text>

<!-- axes -->
<line x1="60" y1="70" x2="60" y2="310" stroke="#c7c6bb" stroke-width="1"/>
<line x1="60" y1="310" x2="600" y2="310" stroke="#c7c6bb" stroke-width="1"/>
<text x="38" y="90" font-size="9" fill="#767568" text-anchor="middle">이익</text>
<text x="38" y="300" font-size="9" fill="#767568" text-anchor="middle">손실</text>
<text x="600" y="330" font-size="9.5" fill="#767568" text-anchor="end">만기 주가 &#8594;</text>

<!-- plain stock diagonal (dashed) -->
<line x1="60" y1="296" x2="600" y2="52" stroke="#9a9888" stroke-width="2" stroke-dasharray="5,4"/>
<text x="606" y="48" font-size="9.5" fill="#767568" text-anchor="start">주식 단독 보유</text>

<!-- collar payoff: flat - diagonal - flat -->
<path d="M 60,240 L 180,240 L 460,110 L 600,110" fill="none" stroke="#1a5fb4" stroke-width="3"/>
<text x="606" y="110" font-size="9.5" fill="#1a5fb4" text-anchor="start" font-weight="700">칼라 적용</text>

<!-- dashed reference lines -->
<line x1="60" y1="240" x2="460" y2="240" stroke="#d0453b" stroke-width="1" stroke-dasharray="3,3"/>
<text x="64" y="252" font-size="9" fill="#a5342c" text-anchor="start">손실 바닥(풋 행사가 180달러에서 고정)</text>

<line x1="180" y1="110" x2="600" y2="110" stroke="#1f9d55" stroke-width="1" stroke-dasharray="3,3"/>
<text x="596" y="98" font-size="9" fill="#177a42" text-anchor="end">이익 천장(콜 행사가 230달러에서 고정)</text>

<!-- vertical strike markers -->
<line x1="180" y1="75" x2="180" y2="310" stroke="#1a5fb4" stroke-width="1" stroke-dasharray="2,3"/>
<text x="180" y="345" font-size="9.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">풋 행사가</text>
<text x="180" y="358" font-size="8.5" fill="#767568" text-anchor="middle">(매수, $180)</text>

<line x1="320" y1="75" x2="320" y2="310" stroke="#767568" stroke-width="1" stroke-dasharray="2,3"/>
<text x="320" y="345" font-size="9.5" fill="#20201a" text-anchor="middle" font-weight="700">현재가</text>
<text x="320" y="358" font-size="8.5" fill="#767568" text-anchor="middle">($200)</text>

<line x1="460" y1="75" x2="460" y2="310" stroke="#1f9d55" stroke-width="1" stroke-dasharray="2,3"/>
<text x="460" y="345" font-size="9.5" fill="#177a42" text-anchor="middle" font-weight="700">콜 행사가</text>
<text x="460" y="358" font-size="8.5" fill="#767568" text-anchor="middle">(매도, $230)</text>

<text x="320" y="385" font-size="9.5" fill="#767568" text-anchor="middle">풋 행사가 아래로는 손실이, 콜 행사가 위로는 이익이 더 커지지 않는다 — 그 사이에서만 주가를 그대로 따라간다</text>
</svg>
