<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
<rect x="0" y="0" width="640" height="400" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="26" font-size="14.5" fill="#20201a" text-anchor="middle" font-weight="700">박스 스프레드 손익: 서로 반대인 두 스프레드의 합 = 고정 금액</text>

<!-- axes -->
<line x1="60" y1="320" x2="590" y2="320" stroke="#9a9989" stroke-width="1.3"/>
<line x1="60" y1="90" x2="60" y2="320" stroke="#9a9989" stroke-width="1.3"/>
<text x="325" y="345" font-size="10.5" fill="#5a5950" text-anchor="middle">만기 시점 지수 가격</text>
<text x="34" y="230" font-size="10.5" fill="#5a5950" text-anchor="middle" transform="rotate(-90 34 230)">손익 ($)</text>

<!-- strike guide lines -->
<line x1="320" y1="90" x2="320" y2="320" stroke="#c7c6bb" stroke-width="1" stroke-dasharray="2,3"/>
<text x="320" y="336" font-size="9" fill="#767568" text-anchor="middle">K1 = 5000</text>
<line x1="450" y1="90" x2="450" y2="320" stroke="#c7c6bb" stroke-width="1" stroke-dasharray="2,3"/>
<text x="450" y="336" font-size="9" fill="#767568" text-anchor="middle">K2 = 5100</text>

<!-- bull call spread: 0 -> 10 between K1 and K2 -->
<path d="M 60,320 L 320,320 L 450,140 L 590,140" fill="none" stroke="#1a5fb4" stroke-width="2.4" stroke-dasharray="7,4"/>

<!-- bear put spread: 10 -> 0 between K1 and K2 -->
<path d="M 60,140 L 320,140 L 450,320 L 590,320" fill="none" stroke="#1f9d55" stroke-width="2.4" stroke-dasharray="7,4"/>

<!-- box spread sum: flat at 10 across all prices -->
<line x1="60" y1="125" x2="590" y2="125" stroke="#d0453b" stroke-width="3.2"/>

<!-- value gridline labels -->
<text x="52" y="324" font-size="8.5" fill="#9a9989" text-anchor="end">$0</text>
<text x="52" y="144" font-size="8.5" fill="#9a9989" text-anchor="end">$10,000</text>
<line x1="56" y1="140" x2="64" y2="140" stroke="#9a9989" stroke-width="1"/>

<!-- legend -->
<rect x="358" y="50" width="16" height="3" fill="#1a5fb4"/>
<text x="378" y="54" font-size="9.5" fill="#20201a">불 콜 스프레드 (5000콜 매수, 5100콜 매도)</text>
<rect x="358" y="66" width="16" height="3" fill="#1f9d55"/>
<text x="378" y="70" font-size="9.5" fill="#20201a">베어 풋 스프레드 (5100풋 매수, 5000풋 매도)</text>
<rect x="60" y="66" width="16" height="3.5" fill="#d0453b"/>
<text x="80" y="70" font-size="9.5" fill="#a5342c" font-weight="700">박스 스프레드 = 합계 = 고정 10,000달러</text>

<text x="320" y="368" font-size="9.5" fill="#767568" text-anchor="middle">지수가 어디로 움직이든, 두 스프레드의 손익을 더하면 항상 같은 (K2−K1) 금액이 됩니다</text>
<text x="320" y="386" font-size="8.5" fill="#9a9989" text-anchor="middle">설명을 위한 가상의 예시이며 실제 시세가 아닙니다. 실전 체결에서는 이 이론적 손익에 거래 비용이 추가로 붙습니다.</text>
</svg>
