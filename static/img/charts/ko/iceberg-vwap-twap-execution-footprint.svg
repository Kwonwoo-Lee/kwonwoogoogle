<text x="310" y="26" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">세 가지 체결 흔적: 아이스버그 · TWAP · VWAP 알고리즘</text>

<!-- Panel 1: Iceberg -->
<text x="40" y="54" font-size="12" fill="#1f9d55" font-weight="700">① 아이스버그 — 같은 가격에서 반복 체결</text>
<line x1="40" y1="95" x2="580" y2="95" stroke="#1f9d55" stroke-width="1.4" stroke-dasharray="5,4" opacity="0.7"/>
<text x="585" y="98" font-size="9" fill="#1f9d55" text-anchor="start">고정 가격</text>

<g fill="#1f9d55">
<circle cx="70" cy="95" r="6"/><circle cx="118" cy="95" r="6"/><circle cx="166" cy="95" r="6"/>
<circle cx="214" cy="95" r="6"/><circle cx="262" cy="95" r="6"/><circle cx="310" cy="95" r="6"/>
<circle cx="358" cy="95" r="6"/><circle cx="406" cy="95" r="6"/><circle cx="454" cy="95" r="6"/>
