<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="620" height="340" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="14.5" fill="#20201a" text-anchor="middle" font-weight="700">PEAD: 실적 발표 후 가격 드리프트 &amp; SUE 분위 패턴</text>

<text x="30" y="50" font-size="12" fill="#5a5950" font-weight="700">실적 발표일 전후 주가 흐름</text>

<line x1="30" y1="255" x2="290" y2="255" stroke="#c7c6bb" stroke-width="1"/>
<line x1="30" y1="60" x2="30" y2="255" stroke="#c7c6bb" stroke-width="1"/>

<path d="M 35,215 L 90,210 L 130,205" fill="none" stroke="#767568" stroke-width="2.4"/>
<line x1="130" y1="60" x2="130" y2="255" stroke="#c98a1f" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="130" y="272" font-size="9" fill="#a06a10" text-anchor="middle" font-weight="700">실적 발표일</text>

<path d="M 130,205 L 132,150" fill="none" stroke="#1a5fb4" stroke-width="2.8"/>
<path d="M 132,150 L 175,132 L 220,112 L 265,88" fill="none" stroke="#1a5fb4" stroke-width="2.8"/>
<circle cx="132" cy="150" r="4" fill="#c98a1f"/>
<text x="150" y="140" font-size="8.5" fill="#a06a10">서프라이즈로 갭 상승</text>
<circle cx="265" cy="88" r="4.5" fill="#1a5fb4"/>

<text x="195" y="105" font-size="8.5" fill="#1a5fb4" font-weight="700">드리프트 지속 →</text>
<text x="150" y="230" font-size="8.5" fill="#767568">발표 전 주가</text>
<text x="60" y="286" font-size="9" fill="#5a5950" text-anchor="middle">D-10</text>
<text x="265" y="286" font-size="9" fill="#5a5950" text-anchor="middle">약 60거래일 후</text>

<text x="160" y="304" font-size="9.5" fill="#5a5950" text-anchor="middle">당일 완전히 반영되지 않고, 이후 몇 주간 계속 같은 방향으로 흘러간다</text>

<line x1="325" y1="30" x2="325" y2="315" stroke="#e1e0d9" stroke-width="1"/>

<text x="475" y="50" font-size="12" fill="#5a5950" text-anchor="middle" font-weight="700">SUE 분위별 향후 드리프트(예시)</text>

<line x1="345" y1="270" x2="600" y2="270" stroke="#c7c6bb" stroke-width="1"/>
<line x1="345" y1="70" x2="345" y2="270" stroke="#c7c6bb" stroke-width="1"/>

<rect x="352" y="255" width="18" height="15" fill="#d0453b" opacity="0.6"/>
<rect x="376" y="248" width="18" height="22" fill="#d0453b" opacity="0.5"/>
<rect x="400" y="240" width="18" height="30" fill="#d0453b" opacity="0.4"/>
<rect x="424" y="234" width="18" height="36" fill="#c98a1f" opacity="0.4"/>
<rect x="448" y="228" width="18" height="42" fill="#c98a1f" opacity="0.45"/>
<rect x="472" y="215" width="18" height="55" fill="#1f9d55" opacity="0.45"/>
<rect x="496" y="200" width="18" height="70" fill="#1f9d55" opacity="0.55"/>
<rect x="520" y="180" width="18" height="90" fill="#1f9d55" opacity="0.65"/>
<rect x="544" y="155" width="18" height="115" fill="#1a5fb4" opacity="0.6"/>
<rect x="568" y="120" width="18" height="150" fill="#1a5fb4" opacity="0.75"/>

<text x="361" y="284" font-size="7.5" fill="#767568" text-anchor="middle">D1</text>
<text x="577" y="284" font-size="7.5" fill="#767568" text-anchor="middle">D10</text>
<text x="475" y="284" font-size="8" fill="#5a5950" text-anchor="middle">SUE 분위 (D1=최저 서프라이즈 → D10=최고 서프라이즈)</text>

<text x="475" y="302" font-size="9" fill="#767568" text-anchor="middle">양(+)의 서프라이즈 분위가 높을수록 이후 드리프트가 더 강한 경향</text>
</svg>
