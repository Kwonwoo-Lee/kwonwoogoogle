<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="640" height="430" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="24" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">물타기 vs 불타기: 추가매수가 평단가를 움직이는 방향</text>

<line x1="320" y1="42" x2="320" y2="400" stroke="#e1e0d9" stroke-width="1"/>

<text x="170" y="58" font-size="12.5" fill="#b03a30" text-anchor="middle" font-weight="700">물타기 (하락 중 추가매수)</text>
<line x1="55" y1="330" x2="300" y2="330" stroke="#8a8a7c" stroke-width="1.2"/>
<line x1="55" y1="330" x2="55" y2="90" stroke="#8a8a7c" stroke-width="1.2"/>

<path d="M 55,328 L 300,328 L 300,300 L 55,312 Z" fill="#d0453b" opacity="0.07"/>
<text x="177" y="320" font-size="9" fill="#b03a30" text-anchor="middle" font-weight="700">손절선 없이 손실 확대 가능</text>

<path d="M 70,110 L 110,150 L 150,190 L 190,220 L 230,250 L 270,275" fill="none" stroke="#1a5fb4" stroke-width="2.6"/>
<path d="M 70,110 L 110,128 L 150,150 L 190,172 L 230,192 L 270,208" fill="none" stroke="#8a4fd1" stroke-width="2" stroke-dasharray="5,4"/>

<circle cx="70" cy="110" r="4.5" fill="#20201a"/>
<text x="70" y="98" font-size="9" fill="#20201a" text-anchor="middle" font-weight="700">최초매수</text>

<circle cx="110" cy="150" r="5" fill="#d0453b"/>
<text x="114" y="142" font-size="9" fill="#b03a30" text-anchor="middle" font-weight="700">2차 물타기</text>

<circle cx="190" cy="220" r="5" fill="#d0453b"/>
<text x="194" y="212" font-size="9" fill="#b03a30" text-anchor="middle" font-weight="700">3차 물타기</text>

<circle cx="270" cy="275" r="5" fill="#d0453b"/>
<text x="256" y="267" font-size="9" fill="#b03a30" text-anchor="middle" font-weight="700">4차 물타기</text>

<text x="177" y="350" font-size="9" fill="#5a5950" text-anchor="middle">주가(실선) 하락 &gt; 평단가(점선) 하락</text>
<text x="177" y="363" font-size="9" fill="#5a5950" text-anchor="middle">→ 평단가는 느려도 총 손실액은 커질 수 있음</text>

<text x="480" y="58" font-size="12.5" fill="#188a48" text-anchor="middle" font-weight="700">불타기/피라미딩 (상승 중 추가매수)</text>
<line x1="375" y1="330" x2="620" y2="330" stroke="#8a8a7c" stroke-width="1.2"/>
<line x1="375" y1="330" x2="375" y2="90" stroke="#8a8a7c" stroke-width="1.2"/>

<path d="M 390,275 L 430,245 L 470,205 L 510,165 L 550,125 L 590,100" fill="none" stroke="#1a5fb4" stroke-width="2.6"/>
<path d="M 390,275 L 430,258 L 470,232 L 510,200 L 550,168 L 590,145" fill="none" stroke="#8a4fd1" stroke-width="2" stroke-dasharray="5,4"/>

<path d="M 390,310 L 430,310 L 430,280 L 470,280 L 470,240 L 510,240 L 510,200 L 550,200" fill="none" stroke="#1f9d55" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="470" y="322" font-size="9" fill="#188a48" text-anchor="middle" font-weight="700">손절선도 단계적으로 상향</text>

<circle cx="390" cy="275" r="4.5" fill="#20201a"/>
<text x="390" y="290" font-size="9" fill="#20201a" text-anchor="middle" font-weight="700">최초매수</text>

<circle cx="470" cy="205" r="5" fill="#1f9d55"/>
<text x="474" y="195" font-size="9" fill="#188a48" text-anchor="middle" font-weight="700">2차 불타기</text>

<circle cx="550" cy="125" r="5" fill="#1f9d55"/>
<text x="554" y="115" font-size="9" fill="#188a48" text-anchor="middle" font-weight="700">3차 불타기</text>

<text x="497" y="350" font-size="9" fill="#5a5950" text-anchor="middle">주가(실선) 상승 &gt; 평단가(점선) 상승</text>
<text x="497" y="363" font-size="9" fill="#5a5950" text-anchor="middle">→ 평단가는 높아져도 손절선이 이익을 보호</text>

<line x1="55" y1="398" x2="80" y2="398" stroke="#1a5fb4" stroke-width="2.6"/>
<text x="87" y="402" font-size="10" fill="#20201a">주가(종가)</text>
<line x1="180" y1="398" x2="205" y2="398" stroke="#8a4fd1" stroke-width="2" stroke-dasharray="5,4"/>
<text x="212" y="402" font-size="10" fill="#20201a">평균단가(평단가)</text>
<line x1="360" y1="398" x2="385" y2="398" stroke="#1f9d55" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="392" y="402" font-size="10" fill="#20201a">단계적 손절선(피라미딩)</text>
</svg>
