<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="620" height="340" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="14.5" fill="#20201a" text-anchor="middle" font-weight="700">Overnight Effect: Session vs. Overnight Return Contribution</text>

<text x="160" y="50" font-size="12" fill="#5a5950" text-anchor="middle" font-weight="700">Growth of $1 (conceptual)</text>

<line x1="35" y1="255" x2="300" y2="255" stroke="#c7c6bb" stroke-width="1"/>
<line x1="35" y1="60" x2="35" y2="255" stroke="#c7c6bb" stroke-width="1"/>

<!-- overnight line: steep rise -->
<path d="M 40,250 L 90,225 L 140,195 L 190,155 L 240,110 L 290,75" fill="none" stroke="#1a5fb4" stroke-width="2.8"/>
<circle cx="290" cy="75" r="4.5" fill="#1a5fb4"/>
<text x="196" y="140" font-size="9.5" fill="#1a5fb4" font-weight="700" transform="rotate(-24 196 140)">Overnight (close→next open)</text>

<!-- intraday line: roughly flat -->
<path d="M 40,250 L 90,247 L 140,252 L 190,244 L 240,248 L 290,238" fill="none" stroke="#8a8a7c" stroke-width="2.8"/>
<circle cx="290" cy="238" r="4.5" fill="#8a8a7c"/>
<text x="150" y="268" font-size="9.5" fill="#767568" font-weight="700">Intraday (open→close)</text>

<text x="60" y="272" font-size="9" fill="#5a5950" text-anchor="middle">Start</text>
<text x="290" y="272" font-size="9" fill="#5a5950" text-anchor="middle">~30 years later</text>

<text x="160" y="300" font-size="9.5" fill="#5a5950" text-anchor="middle">Illustrative only — actual figures vary widely by stock, period, and study</text>
<text x="160" y="314" font-size="8.5" fill="#a0a098" text-anchor="middle">Ref: Haghani, Ragulin &amp; Dewey, "Night Moves" (2024, JOIM)</text>

<line x1="325" y1="30" x2="325" y2="315" stroke="#e1e0d9" stroke-width="1"/>

<text x="475" y="50" font-size="12" fill="#5a5950" text-anchor="middle" font-weight="700">One Window's Effect Over Time (conceptual)</text>

<line x1="350" y1="250" x2="600" y2="250" stroke="#c7c6bb" stroke-width="1"/>
<line x1="350" y1="90" x2="350" y2="250" stroke="#c7c6bb" stroke-width="1"/>

<rect x="380" y="110" width="60" height="140" fill="#1a5fb4" opacity="0.65"/>
<rect x="490" y="243" width="60" height="7" fill="#8a8a7c" opacity="0.7"/>

<text x="410" y="268" font-size="10" fill="#5a5950" text-anchor="middle">Before 2021</text>
<text x="520" y="268" font-size="10" fill="#5a5950" text-anchor="middle">After 2021</text>

<text x="410" y="102" font-size="10.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">~+3.7%/yr</text>
<text x="520" y="238" font-size="10.5" fill="#767568" text-anchor="middle" font-weight="700">~0%</text>

<text x="475" y="296" font-size="9.5" fill="#5a5950" text-anchor="middle">Fading trend reported by 2026 New York Fed analysis</text>
<text x="475" y="310" font-size="8.5" fill="#a0a098" text-anchor="middle">Specific to one window studied — not necessarily true of every overnight period</text>
</svg>
