<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
<rect x="0" y="0" width="640" height="400" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="26" font-size="14.5" fill="#20201a" text-anchor="middle" font-weight="700">Credit Spread vs Iron Condor: Payoff Comparison</text>

<line x1="320" y1="34" x2="320" y2="380" stroke="#e1e0d9" stroke-width="1"/>

<!-- Left: bull put spread -->
<text x="165" y="52" font-size="11" fill="#5a5950" text-anchor="middle" font-weight="700">Bull Put Spread (directional, one side protected)</text>

<path d="M 45,230 L 110,230 L 160,110 L 295,110" fill="none" stroke="#1a5fb4" stroke-width="2.8"/>

<line x1="45" y1="110" x2="300" y2="110" stroke="#1f9d55" stroke-width="1" stroke-dasharray="3,3"/>
<text x="300" y="104" font-size="9" fill="#177a42" text-anchor="end">Max profit (premium collected)</text>

<line x1="45" y1="230" x2="300" y2="230" stroke="#d0453b" stroke-width="1" stroke-dasharray="3,3"/>
<text x="300" y="243" font-size="9" fill="#a5342c" text-anchor="end">Max loss (width - premium)</text>

<line x1="110" y1="90" x2="110" y2="240" stroke="#c7c6bb" stroke-width="1" stroke-dasharray="2,3"/>
<text x="110" y="255" font-size="8.5" fill="#767568" text-anchor="middle">Long put</text>
<line x1="160" y1="90" x2="160" y2="240" stroke="#c7c6bb" stroke-width="1" stroke-dasharray="2,3"/>
<text x="160" y="270" font-size="8.5" fill="#767568" text-anchor="middle">Short put</text>

<text x="165" y="292" font-size="9" fill="#767568" text-anchor="middle">Profitable only above the short put — a bullish bet</text>

<!-- Right: iron condor -->
<text x="475" y="52" font-size="11" fill="#5a5950" text-anchor="middle" font-weight="700">Iron Condor (neutral, both sides protected)</text>

<path d="M 350,230 L 380,230 L 430,110 L 540,110 L 590,230 L 615,230" fill="none" stroke="#1a5fb4" stroke-width="2.8"/>

<line x1="350" y1="110" x2="615" y2="110" stroke="#1f9d55" stroke-width="1" stroke-dasharray="3,3"/>
<text x="615" y="104" font-size="9" fill="#177a42" text-anchor="end">Max profit (combined premium)</text>

<line x1="350" y1="230" x2="615" y2="230" stroke="#d0453b" stroke-width="1" stroke-dasharray="3,3"/>
<text x="615" y="243" font-size="9" fill="#a5342c" text-anchor="end">Max loss (width - premium)</text>

<line x1="380" y1="90" x2="380" y2="240" stroke="#c7c6bb" stroke-width="1" stroke-dasharray="2,3"/>
<text x="380" y="255" font-size="8" fill="#767568" text-anchor="middle">Long put</text>
<line x1="430" y1="90" x2="430" y2="240" stroke="#c7c6bb" stroke-width="1" stroke-dasharray="2,3"/>
<text x="430" y="270" font-size="8" fill="#767568" text-anchor="middle">Short put</text>
<line x1="540" y1="90" x2="540" y2="240" stroke="#c7c6bb" stroke-width="1" stroke-dasharray="2,3"/>
<text x="540" y="270" font-size="8" fill="#767568" text-anchor="middle">Short call</text>
<line x1="590" y1="90" x2="590" y2="240" stroke="#c7c6bb" stroke-width="1" stroke-dasharray="2,3"/>
<text x="590" y="255" font-size="8" fill="#767568" text-anchor="middle">Long call</text>

<text x="475" y="292" font-size="9" fill="#767568" text-anchor="middle">Profitable anywhere between the short strikes — a range bet</text>

<text x="320" y="375" font-size="9.5" fill="#767568" text-anchor="middle">Both structures have their maximum loss fixed at entry</text>
</svg>
