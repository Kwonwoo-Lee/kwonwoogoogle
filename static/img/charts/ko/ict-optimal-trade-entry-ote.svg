<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="620" height="440" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="13.5" fill="#20201a" text-anchor="middle" font-weight="700">ICT OTE: 구조 전환 → 62~79% 되돌림 → FVG 합류 진입</text>

<text x="40" y="52" font-size="12" fill="#5a5950" font-weight="700">① 먼저 구조 전환(MSS)으로 유효한 스윙을 확정</text>

<path d="M 50,95 L 95,80 L 140,88 L 185,62 L 230,100 L 275,70" fill="none" stroke="#9b9a8f" stroke-width="2.5"/>
<circle cx="185" cy="62" r="5" fill="#767568"/>
<text x="185" y="48" font-size="10" fill="#5a5950" text-anchor="middle" font-weight="700">직전 스윙고점</text>
<circle cx="230" cy="100" r="5.5" fill="#1a5fb4"/>
<text x="230" y="118" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">구조 전환(MSS)</text>
<text x="330" y="78" font-size="10" fill="#5a5950">→ 새로운 상승 스윙이 유효해짐</text>

<line x1="20" y1="140" x2="600" y2="140" stroke="#e1e0d9" stroke-width="1"/>

<text x="40" y="164" font-size="12" fill="#5a5950" font-weight="700">② OTE 구간: 62%~79% 되돌림 + FVG 합류에서 진입</text>

<line x1="60" y1="190" x2="460" y2="190" stroke="#c7c6bd" stroke-width="1" stroke-dasharray="4,3"/>
<text x="468" y="194" font-size="10.5" fill="#5a5950">0% (스윙 고점)</text>

<rect x="60" y="255" width="400" height="55" fill="#c98a1f" opacity="0.15"/>
<line x1="60" y1="255" x2="460" y2="255" stroke="#c98a1f" stroke-width="1.3" stroke-dasharray="4,3"/>
<text x="468" y="259" font-size="10.5" fill="#c98a1f" font-weight="700">62%</text>

<line x1="60" y1="282" x2="460" y2="282" stroke="#a8691a" stroke-width="1.5" stroke-dasharray="2,2"/>
<text x="468" y="286" font-size="10.5" fill="#a8691a" font-weight="700">70.5% (스윗스팟)</text>

<line x1="60" y1="310" x2="460" y2="310" stroke="#c98a1f" stroke-width="1.3" stroke-dasharray="4,3"/>
<text x="468" y="314" font-size="10.5" fill="#c98a1f" font-weight="700">79%</text>

<line x1="60" y1="365" x2="460" y2="365" stroke="#c7c6bd" stroke-width="1" stroke-dasharray="4,3"/>
<text x="468" y="369" font-size="10.5" fill="#5a5950">100% (스윙 저점)</text>

<line x1="60" y1="378" x2="460" y2="378" stroke="#d0453b" stroke-width="1.3" stroke-dasharray="6,3"/>
<text x="65" y="394" font-size="10" fill="#d0453b" font-weight="700">손절 기준선: 100% 바로 아래</text>

<path d="M 70,365 L 130,320 L 190,260 L 240,190" fill="none" stroke="#1a5fb4" stroke-width="3"/>
<circle cx="70" cy="365" r="5.5" fill="#1f9d55"/>
<text x="70" y="384" font-size="10" fill="#1f9d55" text-anchor="middle" font-weight="700">스윙 저점</text>
<circle cx="240" cy="190" r="5.5" fill="#1a5fb4"/>
<text x="240" y="176" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">스윙 고점</text>

<path d="M 240,190 L 270,230 L 295,265 L 310,283" fill="none" stroke="#1a5fb4" stroke-width="3"/>

<rect x="285" y="263" width="55" height="40" fill="#1a5fb4" opacity="0.18" stroke="#1a5fb4" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="312" y="256" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">FVG 합류</text>
<circle cx="312" cy="283" r="6" fill="#d0453b"/>

<path d="M 310,283 L 335,250 L 365,200 L 400,150 L 430,100" fill="none" stroke="#1a5fb4" stroke-width="3"/>
<circle cx="400" cy="150" r="5.5" fill="#1f9d55"/>
<text x="403" y="136" font-size="10" fill="#177a42" text-anchor="start" font-weight="700">1차 목표 (0%)</text>

<line x1="430" y1="100" x2="460" y2="100" stroke="#8a4fd1" stroke-width="1.3" stroke-dasharray="4,3"/>
<text x="466" y="104" font-size="10" fill="#6a3aa8" font-weight="700">-0.5 확장 목표</text>
<circle cx="430" cy="100" r="5" fill="#6a3aa8"/>

<rect x="60" y="408" width="500" height="26" rx="6" fill="#fbeee9" stroke="#d0453b" stroke-width="1"/>
<text x="310" y="425" font-size="10" fill="#a8362d" text-anchor="middle" font-weight="700">⚠ 구조 전환 확인 전 임의의 되돌림에 OTE 적용 금지</text>
</svg>
