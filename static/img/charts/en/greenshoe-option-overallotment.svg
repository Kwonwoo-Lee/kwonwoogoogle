<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="640" height="420" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="30" font-size="16" fill="#20201a" text-anchor="middle" font-weight="700">How the Greenshoe Option Responds to Price Direction</text>

<rect x="190" y="55" width="260" height="50" rx="8" fill="#c7c6ba"/>
<text x="320" y="76" font-size="13" fill="#20201a" text-anchor="middle" font-weight="700">Sells 15% over-allotment block</text>
<text x="320" y="95" font-size="11" fill="#20201a" text-anchor="middle">(borrowed from major shareholder, sold to investors)</text>

<line x1="320" y1="105" x2="320" y2="130" stroke="#767568" stroke-width="1.5"/>
<line x1="150" y1="130" x2="490" y2="130" stroke="#767568" stroke-width="1.5"/>
<line x1="150" y1="130" x2="150" y2="150" stroke="#767568" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="490" y1="130" x2="490" y2="150" stroke="#767568" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="55" y="150" width="190" height="42" rx="8" fill="#1a5fb4"/>
<text x="150" y="176" font-size="13" fill="#fdfdfb" text-anchor="middle" font-weight="700">Price &gt; offer price</text>

<rect x="395" y="150" width="190" height="42" rx="8" fill="#c0392b"/>
<text x="490" y="176" font-size="13" fill="#fdfdfb" text-anchor="middle" font-weight="700">Price &lt; offer price</text>

<line x1="150" y1="192" x2="150" y2="215" stroke="#767568" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="490" y1="192" x2="490" y2="215" stroke="#767568" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="35" y="215" width="230" height="56" rx="8" fill="#eef2f8" stroke="#1a5fb4"/>
<text x="150" y="238" font-size="13" fill="#1a5fb4" text-anchor="middle" font-weight="700">Exercise the option</text>
<text x="150" y="256" font-size="11" fill="#20201a" text-anchor="middle">Buys new shares from issuer</text>
<text x="150" y="270" font-size="11" fill="#20201a" text-anchor="middle">at offer price to repay loan</text>

<rect x="375" y="215" width="230" height="56" rx="8" fill="#fbeceb" stroke="#c0392b"/>
<text x="490" y="238" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Buy in the open market</text>
<text x="490" y="256" font-size="11" fill="#20201a" text-anchor="middle">Repays loan with market buys;</text>
<text x="490" y="270" font-size="11" fill="#20201a" text-anchor="middle">buying cushions the decline</text>

<line x1="150" y1="271" x2="150" y2="295" stroke="#767568" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="490" y1="271" x2="490" y2="295" stroke="#767568" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="35" y="295" width="230" height="46" rx="8" fill="#f4f4ef"/>
<text x="150" y="317" font-size="12" fill="#20201a" text-anchor="middle" font-weight="700">Company raises extra capital</text>
<text x="150" y="333" font-size="12" fill="#20201a" text-anchor="middle" font-weight="700">Underwriter earns larger fee</text>

<rect x="375" y="295" width="230" height="46" rx="8" fill="#f4f4ef"/>
<text x="490" y="317" font-size="12" fill="#20201a" text-anchor="middle" font-weight="700">Underwriter profits on the spread</text>
<text x="490" y="333" font-size="12" fill="#20201a" text-anchor="middle" font-weight="700">Market: decline is cushioned</text>

<text x="320" y="375" font-size="12" fill="#767568" text-anchor="middle">The underwriter comes out ahead either way; this intervention is limited to roughly 30 days post-listing</text>

<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="#767568"/>
</marker>
</defs>
</svg>
