<line x1="335" y1="308" x2="360" y2="308" stroke="#1f9d55" stroke-width="3"/>
<text x="367" y="312" font-size="10" fill="#20201a">첫 방문은 반응 강함(프레시존)</text>
<line x1="335" y1="325" x2="360" y2="325" stroke="#d0453b" stroke-width="3"/>
<text x="367" y="329" font-size="10" fill="#20201a">재방문할수록 반응 약화·붕괴</text>
