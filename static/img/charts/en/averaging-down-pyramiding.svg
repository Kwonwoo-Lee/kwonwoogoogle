<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="640" height="430" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="24" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">Averaging Down vs. Pyramiding: Which Way Average Cost Moves</text>

<line x1="320" y1="42" x2="320" y2="400" stroke="#e1e0d9" stroke-width="1"/>

<text x="170" y="58" font-size="12" fill="#b03a30" text-anchor="middle" font-weight="700">Averaging Down (adding on declines)</text>
<line x1="55" y1="330" x2="300" y2="330" stroke="#8a8a7c" stroke-width="1.2"/>
<line x1="55" y1="330" x2="55" y2="90" stroke="#8a8a7c" stroke-width="1.2"/>

<path d="M 55,328 L 300,328 L 300,300 L 55,312 Z" fill="#d0453b" opacity="0.07"/>
<text x="177" y="320" font-size="8.5" fill="#b03a30" text-anchor="middle" font-weight="700">No stop — losses can keep growing</text>

<path d="M 70,110 L 110,150 L 150,190 L 190,220 L 230,250 L 270,275" fill="none" stroke="#1a5fb4" stroke-width="2.6"/>
<path d="M 70,110 L 110,128 L 150,150 L 190,172 L 230,192 L 270,208" fill="none" stroke="#8a4fd1" stroke-width="2" stroke-dasharray="5,4"/>

<circle cx="70" cy="110" r="4.5" fill="#20201a"/>
<text x="70" y="98" font-size="8.5" fill="#20201a" text-anchor="middle" font-weight="700">1st buy</text>

<circle cx="110" cy="150" r="5" fill="#d0453b"/>
<text x="118" y="142" font-size="8.5" fill="#b03a30" text-anchor="middle" font-weight="700">2nd add</text>

<circle cx="190" cy="220" r="5" fill="#d0453b"/>
<text x="198" y="212" font-size="8.5" fill="#b03a30" text-anchor="middle" font-weight="700">3rd add</text>

<circle cx="270" cy="275" r="5" fill="#d0453b"/>
<text x="256" y="267" font-size="8.5" fill="#b03a30" text-anchor="middle" font-weight="700">4th add</text>

<text x="177" y="350" font-size="8.5" fill="#5a5950" text-anchor="middle">Price (solid) falls faster than avg. cost (dashed)</text>
<text x="177" y="363" font-size="8.5" fill="#5a5950" text-anchor="middle">→ dollar loss can grow even as avg. cost falls</text>

<text x="480" y="58" font-size="12" fill="#188a48" text-anchor="middle" font-weight="700">Pyramiding (adding on advances)</text>
<line x1="375" y1="330" x2="620" y2="330" stroke="#8a8a7c" stroke-width="1.2"/>
<line x1="375" y1="330" x2="375" y2="90" stroke="#8a8a7c" stroke-width="1.2"/>

<path d="M 390,275 L 430,245 L 470,205 L 510,165 L 550,125 L 590,100" fill="none" stroke="#1a5fb4" stroke-width="2.6"/>
<path d="M 390,275 L 430,258 L 470,232 L 510,200 L 550,168 L 590,145" fill="none" stroke="#8a4fd1" stroke-width="2" stroke-dasharray="5,4"/>

<path d="M 390,310 L 430,310 L 430,280 L 470,280 L 470,240 L 510,240 L 510,200 L 550,200" fill="none" stroke="#1f9d55" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="470" y="322" font-size="8.5" fill="#188a48" text-anchor="middle" font-weight="700">Stop-loss rises with each add</text>

<circle cx="390" cy="275" r="4.5" fill="#20201a"/>
<text x="390" y="290" font-size="8.5" fill="#20201a" text-anchor="middle" font-weight="700">1st buy</text>

<circle cx="470" cy="205" r="5" fill="#1f9d55"/>
<text x="478" y="195" font-size="8.5" fill="#188a48" text-anchor="middle" font-weight="700">2nd add</text>

<circle cx="550" cy="125" r="5" fill="#1f9d55"/>
<text x="558" y="115" font-size="8.5" fill="#188a48" text-anchor="middle" font-weight="700">3rd add</text>

<text x="497" y="350" font-size="8.5" fill="#5a5950" text-anchor="middle">Price (solid) rises faster than avg. cost (dashed)</text>
<text x="497" y="363" font-size="8.5" fill="#5a5950" text-anchor="middle">→ avg. cost rises, but the rising stop protects profit</text>

<line x1="55" y1="398" x2="80" y2="398" stroke="#1a5fb4" stroke-width="2.6"/>
<text x="87" y="402" font-size="10" fill="#20201a">Price (close)</text>
<line x1="195" y1="398" x2="220" y2="398" stroke="#8a4fd1" stroke-width="2" stroke-dasharray="5,4"/>
<text x="227" y="402" font-size="10" fill="#20201a">Average cost</text>
<line x1="360" y1="398" x2="385" y2="398" stroke="#1f9d55" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="392" y="402" font-size="10" fill="#20201a">Stepped stop-loss (pyramiding)</text>
</svg>
