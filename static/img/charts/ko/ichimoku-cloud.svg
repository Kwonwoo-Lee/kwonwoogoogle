<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="640" height="340" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="24" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">일목균형표: 구름 돌파·전환선-기준선 크로스와 구름 두께에 따른 신뢰도 차이</text>

<line x1="330" y1="34" x2="330" y2="318" stroke="#e1e0d9" stroke-width="1"/>

<text x="175" y="46" font-size="11.5" fill="#5a5950" text-anchor="middle" font-weight="700">구름 돌파 + 전환선-기준선 크로스</text>

<polygon points="40,190 90,188 140,182 190,168 240,140 290,110 290,122 240,160 190,195 140,213 90,222 40,225" fill="#1f9d55" opacity="0.14" stroke="#1f9d55" stroke-width="1" stroke-dasharray="3,2"/>
<text x="60" y="240" font-size="10" fill="#1f9d55" font-weight="700">구름(양운)</text>

<path d="M 40,210 L 90,202 L 140,188 L 180,165 L 210,130 L 250,95 L 290,70" fill="none" stroke="#1a5fb4" stroke-width="3"/>
<text x="292" y="66" font-size="10.5" fill="#1a5fb4" font-weight="700">가격</text>

<path d="M 110,205 L 150,190 L 190,155 L 225,118" fill="none" stroke="#1f9d55" stroke-width="2"/>
<path d="M 110,198 L 150,192 L 190,180 L 225,162" fill="none" stroke="#d0453b" stroke-width="2" stroke-dasharray="5,3"/>
<circle cx="172" cy="186" r="4.5" fill="#8a4fd1"/>
<text x="172" y="278" font-size="10" fill="#8a4fd1" text-anchor="middle" font-weight="700">전환선-기준선 크로스</text>
<line x1="172" y1="190" x2="172" y2="272" stroke="#8a4fd1" stroke-width="1" stroke-dasharray="2,2"/>

<path d="M 40,155 L 75,150 L 110,143" fill="none" stroke="#767568" stroke-width="2" stroke-dasharray="4,3"/>
<text x="40" y="140" font-size="9.5" fill="#5a5950" font-weight="700">후행스팬(26봉 전 가격과 비교)</text>

<line x1="40" y1="298" x2="65" y2="298" stroke="#1a5fb4" stroke-width="3"/>
<text x="72" y="302" font-size="10" fill="#20201a">가격</text>
<line x1="105" y1="298" x2="130" y2="298" stroke="#1f9d55" stroke-width="2"/>
<text x="137" y="302" font-size="10" fill="#20201a">전환선</text>
<line x1="180" y1="298" x2="205" y2="298" stroke="#d0453b" stroke-width="2" stroke-dasharray="5,3"/>
<text x="212" y="302" font-size="10" fill="#20201a">기준선</text>

<text x="470" y="46" font-size="11.5" fill="#5a5950" text-anchor="middle" font-weight="700">구름 두께 = 지지·저항 강도</text>

<polygon points="360,140 420,138 480,135 540,132 540,165 480,168 420,172 360,175" fill="#1f9d55" opacity="0.16" stroke="#1f9d55" stroke-width="1" stroke-dasharray="3,2"/>
<path d="M 360,160 L 420,150 L 480,110 L 540,80 L 600,60" fill="none" stroke="#1a5fb4" stroke-width="2.5"/>
<circle cx="480" cy="110" r="4" fill="#1f9d55"/>
<text x="600" y="56" font-size="9.5" fill="#1f9d55" text-anchor="end" font-weight="700">두꺼운 구름 돌파 → 강한 추세 전환</text>

<polygon points="360,240 420,238 480,236 540,234 540,244 480,246 420,248 360,250" fill="#d0453b" opacity="0.14" stroke="#d0453b" stroke-width="1" stroke-dasharray="3,2"/>
<path d="M 360,260 L 420,245 L 480,225 L 510,215 L 540,235 L 600,255" fill="none" stroke="#1a5fb4" stroke-width="2.5"/>
<circle cx="510" cy="215" r="4" fill="#d0453b"/>
<text x="600" y="272" font-size="9.5" fill="#d0453b" text-anchor="end" font-weight="700">얇은 구름 돌파 → 되돌림(가짜 돌파) 위험</text>
</svg>
