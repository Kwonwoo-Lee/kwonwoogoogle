<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="640" height="420" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="26" font-size="15" fill="#20201a" text-anchor="middle" font-weight="700">캐리 트레이드: 계단으로 쌓고 엘리베이터로 무너진다</text>

<line x1="70" y1="360" x2="600" y2="360" stroke="#8a8a7c" stroke-width="1.5"/>
<line x1="70" y1="360" x2="70" y2="55" stroke="#8a8a7c" stroke-width="1.5"/>
<text x="335" y="392" font-size="12" fill="#5a5a4e" text-anchor="middle">시간 (수개월 ~ 수년)</text>
<text x="42" y="210" font-size="12" fill="#5a5a4e" text-anchor="middle" transform="rotate(-90 42 210)">누적 수익(캐리)</text>

<line x1="70" y1="330" x2="600" y2="330" stroke="#c7c6ba" stroke-width="1" stroke-dasharray="3,3"/>
<text x="130" y="325" font-size="11" fill="#8a8a7c">진입 시점 (0%)</text>

<path d="M 70,330 L 130,330 L 130,312 L 190,312 L 190,296 L 250,296 L 250,280 L 310,280 L 310,264 L 370,264 L 370,248 L 430,248 L 430,232 L 470,232" fill="none" stroke="#1a5fb4" stroke-width="2.6"/>
<text x="230" y="270" font-size="11.5" fill="#1a5fb4" font-weight="700">완만한 금리차(캐리) 수익 누적</text>
<text x="230" y="284" font-size="10.5" fill="#1a5fb4">(저금리 통화 차입 → 고금리 자산 매수, 매일 조금씩 쌓임)</text>

<path d="M 470,232 L 500,370" fill="none" stroke="#c0392b" stroke-width="3"/>
<circle cx="470" cy="232" r="4.5" fill="#1f9d55"/>
<text x="470" y="219" font-size="10.5" fill="#188a48" text-anchor="middle" font-weight="700">리스크오프 트리거</text>

<line x1="500" y1="361" x2="500" y2="379" stroke="#c0392b" stroke-width="2.4"/>
<line x1="491" y1="370" x2="509" y2="370" stroke="#c0392b" stroke-width="2.4"/>
<text x="555" y="365" font-size="11.5" fill="#c0392b" text-anchor="middle" font-weight="700">엔화 급등 → 마진콜</text>
<text x="555" y="379" font-size="10.5" fill="#c0392b" text-anchor="middle">→ 강제 청산(디레버리징)</text>

<line x1="500" y1="330" x2="600" y2="330" stroke="#8a8a7c" stroke-width="1" stroke-dasharray="3,3"/>
<text x="560" y="325" font-size="10.5" fill="#8a8a7c">수개월 수익이 며칠 만에 증발</text>

<line x1="90" y1="405" x2="115" y2="405" stroke="#1a5fb4" stroke-width="2.6"/>
<text x="122" y="409" font-size="10.5" fill="#20201a">캐리 수익 누적 구간</text>
<line x1="290" y1="405" x2="315" y2="405" stroke="#c0392b" stroke-width="2.6"/>
<text x="322" y="409" font-size="10.5" fill="#20201a">청산(언와인드) 구간</text>
</svg>
