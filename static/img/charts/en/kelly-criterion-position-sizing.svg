<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="26" font-size="15" fill="#20201a" text-anchor="middle" font-weight="700">Compound Growth Rate vs. Bet Fraction (f)</text>

<line x1="70" y1="330" x2="600" y2="330" stroke="#8a8a7c" stroke-width="1.5"/>
<line x1="70" y1="330" x2="70" y2="60" stroke="#8a8a7c" stroke-width="1.5"/>
<text x="335" y="368" font-size="12" fill="#5a5a4e" text-anchor="middle">Bet fraction (% of capital, f)</text>
<text x="40" y="195" font-size="12" fill="#5a5a4e" text-anchor="middle" transform="rotate(-90 40 195)">Expected compound growth</text>

<line x1="70" y1="220" x2="600" y2="220" stroke="#d8d7cc" stroke-width="1" stroke-dasharray="3,3"/>
<text x="605" y="224" font-size="10.5" fill="#9c9b8f">0%</text>

<rect x="500" y="60" width="100" height="270" fill="#d0453b" opacity="0.06"/>
<text x="550" y="80" font-size="10" fill="#b03a30" text-anchor="middle" font-weight="700">Overbetting zone</text>
<text x="550" y="93" font-size="10" fill="#b03a30" text-anchor="middle" font-weight="700">(ruin risk rises fast)</text>

<path d="M 70,220 C 160,90 260,60 340,68 C 420,76 480,140 520,220 C 545,270 560,300 585,325"
      fill="none" stroke="#1a5fb4" stroke-width="3"/>

<circle cx="200" cy="103" r="6" fill="#1f9d55"/>
<line x1="200" y1="103" x2="200" y2="330" stroke="#1f9d55" stroke-width="1.3" stroke-dasharray="5,4"/>
<text x="200" y="345" font-size="11" fill="#188a48" text-anchor="middle" font-weight="700">Half Kelly (f*/2)</text>
<text x="200" y="358" font-size="10" fill="#188a48" text-anchor="middle">~75% growth, much lower volatility</text>

<circle cx="340" cy="68" r="6.5" fill="#d0453b"/>
<line x1="340" y1="68" x2="340" y2="330" stroke="#d0453b" stroke-width="1.3" stroke-dasharray="5,4"/>
<text x="340" y="50" font-size="11.5" fill="#b03a30" text-anchor="middle" font-weight="700">Full Kelly (f*) = peak growth</text>

<circle cx="470" cy="220" r="5.5" fill="#9c5a1e"/>
<line x1="470" y1="220" x2="470" y2="330" stroke="#9c5a1e" stroke-width="1.3" stroke-dasharray="5,4"/>
<text x="470" y="345" font-size="11" fill="#9c5a1e" text-anchor="middle" font-weight="700">2× Full Kelly (2f*)</text>
<text x="470" y="358" font-size="10" fill="#9c5a1e" text-anchor="middle">growth hits 0% — turns negative past here</text>

<line x1="90" y1="385" x2="115" y2="385" stroke="#1a5fb4" stroke-width="3"/>
<text x="122" y="389" font-size="11.5" fill="#20201a">Conceptual curve — exact shape depends on win rate and reward-to-risk</text>
</svg>
