<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="-apple-system, 'Segoe UI', sans-serif">
<rect x="0" y="0" width="640" height="460" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="24" font-size="13" fill="#20201a" text-anchor="middle" font-weight="700">Dollar Smile Theory: The U-Shape Between Crisis Strength and Exceptionalism Strength</text>

<defs>
  <marker id="dsArrowEn" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#767568"/>
  </marker>
</defs>

<!-- axes -->
<line x1="80" y1="80" x2="80" y2="300" stroke="#c9c7ba" stroke-width="1.5"/>
<line x1="80" y1="300" x2="580" y2="300" stroke="#c9c7ba" stroke-width="1.5"/>
<text x="68" y="90" font-size="10.5" fill="#5a5850" text-anchor="end">Strong</text>
<text x="68" y="252" font-size="10.5" fill="#5a5850" text-anchor="end">Weak</text>
<text x="38" y="195" font-size="11" fill="#5a5850" text-anchor="middle" font-weight="700" transform="rotate(-90 38 195)">Dollar strength</text>

<!-- main smile curve (solid) -->
<path d="M 100,120 C 160,108 210,118 260,165 C 295,196 320,206 320,210 C 320,206 345,196 380,165 C 430,118 480,108 540,120"
      fill="none" stroke="#20201a" stroke-width="3"/>

<!-- alternate 2026 "smirk" path on the right (dashed, lower) -->
<path d="M 380,165 C 430,145 480,152 540,172"
      fill="none" stroke="#767568" stroke-width="2.2" stroke-dasharray="6,5"/>

<!-- key points -->
<circle cx="100" cy="120" r="7" fill="#d0453b"/>
<circle cx="320" cy="210" r="7" fill="#767568"/>
<circle cx="540" cy="120" r="7" fill="#1f9d55"/>
<circle cx="540" cy="172" r="6" fill="#767568" opacity="0.8"/>

<!-- zone bands -->
<rect x="80" y="340" width="150" height="56" rx="8" fill="#d0453b" opacity="0.10" stroke="#d0453b" stroke-width="1.2"/>
<text x="155" y="360" font-size="12" fill="#d0453b" text-anchor="middle" font-weight="700">Regime 1: Global crisis</text>
<text x="155" y="378" font-size="9.5" fill="#5a5950" text-anchor="middle">Safe-haven demand → strong</text>

<rect x="245" y="340" width="150" height="56" rx="8" fill="#767568" opacity="0.10" stroke="#767568" stroke-width="1.2"/>
<text x="320" y="360" font-size="12" fill="#5a5950" text-anchor="middle" font-weight="700">Regime 2: Soft US growth</text>
<text x="320" y="378" font-size="9.5" fill="#5a5950" text-anchor="middle">Both engines idle → the dip</text>

<rect x="410" y="340" width="150" height="56" rx="8" fill="#1f9d55" opacity="0.10" stroke="#1f9d55" stroke-width="1.2"/>
<text x="485" y="360" font-size="12" fill="#1f9d55" text-anchor="middle" font-weight="700">Regime 3: US exceptionalism</text>
<text x="485" y="378" font-size="9.5" fill="#5a5950" text-anchor="middle">Rate &amp; growth appeal → strong</text>

<!-- connector ticks from curve points to zone bands -->
<line x1="100" y1="127" x2="155" y2="338" stroke="#d0453b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
<line x1="320" y1="217" x2="320" y2="338" stroke="#767568" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
<line x1="540" y1="127" x2="485" y2="338" stroke="#1f9d55" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

<text x="320" y="420" font-size="10.5" fill="#5a5850" text-anchor="middle">Regime (global risk appetite ↔ US economy's relative standing)</text>

<line x1="60" y1="440" x2="90" y2="440" stroke="#767568" stroke-width="2.2" stroke-dasharray="6,5"/>
<text x="98" y="444" font-size="10" fill="#767568" text-anchor="start">Dashed: the asymmetric 2026 "smirk" some institutions (e.g. J.P. Morgan) argue has replaced the right corner</text>
</svg>
