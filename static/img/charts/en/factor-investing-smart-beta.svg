<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="-apple-system, 'Segoe UI', sans-serif">
<rect x="0" y="0" width="640" height="420" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="24" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">Factor Investing: From Universe to Factor Screens to Multi-Factor Portfolio</text>

<defs>
  <marker id="fiArrowEn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#767568"/>
  </marker>
</defs>

<!-- universe box -->
<rect x="190" y="44" width="260" height="46" rx="8" fill="#20201a" opacity="0.06" stroke="#767568" stroke-width="1.2"/>
<text x="320" y="63" font-size="12.5" fill="#20201a" text-anchor="middle" font-weight="700">Stock Universe</text>
<text x="320" y="80" font-size="10.5" fill="#5a5950" text-anchor="middle">e.g. the 500 S&amp;P 500 stocks</text>

<path d="M 320,90 L 320,106" fill="none" stroke="#767568" stroke-width="1.4" marker-end="url(#fiArrowEn)"/>
<path d="M 320,106 L 95,128" fill="none" stroke="#767568" stroke-width="1.2" marker-end="url(#fiArrowEn)"/>
<path d="M 320,106 L 245,128" fill="none" stroke="#767568" stroke-width="1.2" marker-end="url(#fiArrowEn)"/>
<path d="M 320,106 L 395,128" fill="none" stroke="#767568" stroke-width="1.2" marker-end="url(#fiArrowEn)"/>
<path d="M 320,106 L 545,128" fill="none" stroke="#767568" stroke-width="1.2" marker-end="url(#fiArrowEn)"/>

<!-- four factor screens -->
<rect x="20" y="130" width="150" height="70" rx="8" fill="#1a5fb4" opacity="0.1" stroke="#1a5fb4" stroke-width="1.3"/>
<text x="95" y="153" font-size="11.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">Value Factor</text>
<text x="95" y="170" font-size="9.5" fill="#5a5950" text-anchor="middle">Low P/E · low P/B</text>
<text x="95" y="184" font-size="9.5" fill="#5a5950" text-anchor="middle">top-ranked names</text>

<rect x="170" y="130" width="150" height="70" rx="8" fill="#1f9d55" opacity="0.1" stroke="#1f9d55" stroke-width="1.3"/>
<text x="245" y="153" font-size="11.5" fill="#188a48" text-anchor="middle" font-weight="700">Momentum Factor</text>
<text x="245" y="170" font-size="9.5" fill="#5a5950" text-anchor="middle">Top trailing</text>
<text x="245" y="184" font-size="9.5" fill="#5a5950" text-anchor="middle">12-month return</text>

<rect x="320" y="130" width="150" height="70" rx="8" fill="#8a4fd1" opacity="0.1" stroke="#8a4fd1" stroke-width="1.3"/>
<text x="395" y="153" font-size="11.5" fill="#6a3aa8" text-anchor="middle" font-weight="700">Quality Factor</text>
<text x="395" y="170" font-size="9.5" fill="#5a5950" text-anchor="middle">High ROE</text>
<text x="395" y="184" font-size="9.5" fill="#5a5950" text-anchor="middle">low debt, top-ranked</text>

<rect x="470" y="130" width="150" height="70" rx="8" fill="#c98a1f" opacity="0.1" stroke="#c98a1f" stroke-width="1.3"/>
<text x="545" y="153" font-size="11.5" fill="#a9710f" text-anchor="middle" font-weight="700">Low-Vol Factor</text>
<text x="545" y="170" font-size="9.5" fill="#5a5950" text-anchor="middle">Lowest historical</text>
<text x="545" y="184" font-size="9.5" fill="#5a5950" text-anchor="middle">volatility, top-ranked</text>

<!-- convergence -->
<path d="M 95,200 L 320,260" fill="none" stroke="#767568" stroke-width="1.2" marker-end="url(#fiArrowEn)"/>
<path d="M 245,200 L 320,260" fill="none" stroke="#767568" stroke-width="1.2" marker-end="url(#fiArrowEn)"/>
<path d="M 395,200 L 320,260" fill="none" stroke="#767568" stroke-width="1.2" marker-end="url(#fiArrowEn)"/>
<path d="M 545,200 L 320,260" fill="none" stroke="#767568" stroke-width="1.2" marker-end="url(#fiArrowEn)"/>

<rect x="140" y="262" width="360" height="62" rx="8" fill="#d0453b" opacity="0.08" stroke="#d0453b" stroke-width="1.4"/>
<text x="320" y="286" font-size="12.5" fill="#b03a30" text-anchor="middle" font-weight="700">Multi-Factor Portfolio</text>
<text x="320" y="304" font-size="10.5" fill="#5a5950" text-anchor="middle">Stocks ranking highly on several factors at once</text>
<text x="320" y="318" font-size="10.5" fill="#5a5950" text-anchor="middle">(smart beta ETFs automate this whole process)</text>

<path d="M 320,324 L 320,340" fill="none" stroke="#767568" stroke-width="1.4" marker-end="url(#fiArrowEn)"/>
<text x="320" y="366" font-size="11" fill="#20201a" text-anchor="middle" font-weight="700">Diversified across dozens to hundreds of names</text>
<text x="320" y="384" font-size="10" fill="#767568" text-anchor="middle">Rescored and rebalanced on a regular schedule</text>
<text x="320" y="406" font-size="10" fill="#767568" text-anchor="middle">Targets the average effect of a trait, not one stock's outcome</text>
</svg>
