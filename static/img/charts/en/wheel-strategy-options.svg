<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="28" font-size="15" fill="#20201a" text-anchor="middle" font-weight="700">The Wheel Strategy: Cycling Between Cash and Stock</text>

<!-- Left box: Cash-secured put -->
<rect x="30" y="150" width="260" height="130" rx="10" fill="#1a5fb4" opacity="0.08" stroke="#1a5fb4" stroke-width="1.5"/>
<text x="160" y="172" font-size="11" fill="#1a5fb4" text-anchor="middle" font-weight="700">LEG 1 · Holding Cash</text>
<text x="160" y="192" font-size="13" fill="#20201a" text-anchor="middle" font-weight="700">Sell Cash-Secured Put</text>
<text x="160" y="209" font-size="9.5" fill="#767568" text-anchor="middle">(Cash-Secured Put)</text>
<text x="160" y="230" font-size="9.5" fill="#20201a" text-anchor="middle">Set aside strike × 100 shares in cash</text>
<text x="160" y="246" font-size="9.5" fill="#20201a" text-anchor="middle">&#8594; Collect put premium up front</text>
<text x="160" y="264" font-size="9" fill="#767568" text-anchor="middle">Entry: a stock you'd want at this price</text>

<!-- Right box: Covered call -->
<rect x="350" y="150" width="260" height="130" rx="10" fill="#1f9d55" opacity="0.08" stroke="#1f9d55" stroke-width="1.5"/>
<text x="480" y="172" font-size="11" fill="#1f9d55" text-anchor="middle" font-weight="700">LEG 2 · Holding 100 Shares</text>
<text x="480" y="192" font-size="13" fill="#20201a" text-anchor="middle" font-weight="700">Sell Covered Call</text>
<text x="480" y="209" font-size="9.5" fill="#767568" text-anchor="middle">(Covered Call)</text>
<text x="480" y="230" font-size="9.5" fill="#20201a" text-anchor="middle">Sell a call against the 100 shares</text>
<text x="480" y="246" font-size="9.5" fill="#20201a" text-anchor="middle">&#8594; Collect call premium too</text>
<text x="480" y="264" font-size="9" fill="#767568" text-anchor="middle">Exit: a target price you're fine selling at</text>

<!-- Top arrow: put assigned -->
<line x1="290" y1="175" x2="345" y2="175" stroke="#d0453b" stroke-width="2"/>
<polygon points="345,175 336,170 336,180" fill="#d0453b"/>
<text x="317" y="150" font-size="10.5" fill="#d0453b" text-anchor="middle" font-weight="700">Assigned</text>
<text x="317" y="163" font-size="8.5" fill="#20201a" text-anchor="middle">Put finishes ITM &#8594; shares purchased</text>

<!-- Bottom arrow: call exercised -->
<line x1="350" y1="255" x2="295" y2="255" stroke="#1a5fb4" stroke-width="2"/>
<polygon points="295,255 304,250 304,260" fill="#1a5fb4"/>
<text x="317" y="285" font-size="10.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">Called Away</text>
<text x="317" y="298" font-size="8.5" fill="#20201a" text-anchor="middle">Call finishes ITM &#8594; shares sold, back to cash</text>

<!-- Self-loop above left box -->
<path d="M 95,150 C 95,105 225,105 225,150" fill="none" stroke="#767568" stroke-width="1.5" stroke-dasharray="4,3"/>
<polygon points="225,150 217,142 230,140" fill="#767568"/>
<text x="160" y="100" font-size="9" fill="#767568" text-anchor="middle" font-weight="700">Expires OTM &#8594; premium locked in, repeat</text>

<!-- Self-loop above right box -->
<path d="M 415,150 C 415,105 545,105 545,150" fill="none" stroke="#767568" stroke-width="1.5" stroke-dasharray="4,3"/>
<polygon points="545,150 537,142 550,140" fill="#767568"/>
<text x="480" y="100" font-size="9" fill="#767568" text-anchor="middle" font-weight="700">Expires OTM &#8594; sell a new call, repeat</text>

<!-- Legend -->
<line x1="60" y1="340" x2="85" y2="340" stroke="#d0453b" stroke-width="2.5"/>
<text x="93" y="345" font-size="10.5" fill="#20201a" text-anchor="start">Assigned/exercised &#8594; move to the other leg</text>
<line x1="360" y1="340" x2="385" y2="340" stroke="#767568" stroke-width="2.5" stroke-dasharray="4,3"/>
<text x="393" y="345" font-size="10.5" fill="#20201a" text-anchor="start">Expires OTM &#8594; repeat the same leg</text>

<text x="320" y="375" font-size="9.5" fill="#767568" text-anchor="middle">Either way, the premium was already collected at the moment of the sale</text>
</svg>
