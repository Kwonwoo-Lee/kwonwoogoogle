<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="640" height="420" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="26" font-size="15" fill="#20201a" text-anchor="middle" font-weight="700">Carry Trade: Up the Stairs, Down the Elevator</text>

<line x1="70" y1="360" x2="600" y2="360" stroke="#8a8a7c" stroke-width="1.5"/>
<line x1="70" y1="360" x2="70" y2="55" stroke="#8a8a7c" stroke-width="1.5"/>
<text x="335" y="392" font-size="12" fill="#5a5a4e" text-anchor="middle">Time (months to years)</text>
<text x="42" y="210" font-size="12" fill="#5a5a4e" text-anchor="middle" transform="rotate(-90 42 210)">Cumulative return (carry)</text>

<line x1="70" y1="330" x2="600" y2="330" stroke="#c7c6ba" stroke-width="1" stroke-dasharray="3,3"/>
<text x="130" y="325" font-size="11" fill="#8a8a7c">Entry (0%)</text>

<path d="M 70,330 L 130,330 L 130,312 L 190,312 L 190,296 L 250,296 L 250,280 L 310,280 L 310,264 L 370,264 L 370,248 L 430,248 L 430,232 L 470,232" fill="none" stroke="#1a5fb4" stroke-width="2.6"/>
<text x="230" y="270" font-size="11.5" fill="#1a5fb4" font-weight="700">Slow, steady accrual of the rate differential</text>
<text x="230" y="284" font-size="10.5" fill="#1a5fb4">(borrow low-yield currency, hold high-yield assets, carry accrues daily)</text>

<path d="M 470,232 L 500,370" fill="none" stroke="#c0392b" stroke-width="3"/>
<circle cx="470" cy="232" r="4.5" fill="#1f9d55"/>
<text x="470" y="219" font-size="10.5" fill="#188a48" text-anchor="middle" font-weight="700">Risk-off trigger</text>

<line x1="500" y1="361" x2="500" y2="379" stroke="#c0392b" stroke-width="2.4"/>
<line x1="491" y1="370" x2="509" y2="370" stroke="#c0392b" stroke-width="2.4"/>
<text x="555" y="365" font-size="11.5" fill="#c0392b" text-anchor="middle" font-weight="700">Funding currency spikes</text>
<text x="555" y="379" font-size="10.5" fill="#c0392b" text-anchor="middle">→ margin calls → forced unwind</text>

<line x1="500" y1="330" x2="600" y2="330" stroke="#8a8a7c" stroke-width="1" stroke-dasharray="3,3"/>
<text x="560" y="325" font-size="10.5" fill="#8a8a7c">Months of carry gone in days</text>

<line x1="90" y1="405" x2="115" y2="405" stroke="#1a5fb4" stroke-width="2.6"/>
<text x="122" y="409" font-size="10.5" fill="#20201a">Carry accrual phase</text>
<line x1="290" y1="405" x2="315" y2="405" stroke="#c0392b" stroke-width="2.6"/>
<text x="322" y="409" font-size="10.5" fill="#20201a">Unwind phase</text>
</svg>
