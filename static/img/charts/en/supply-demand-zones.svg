<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="620" height="380" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="13.5" fill="#20201a" text-anchor="middle" font-weight="700">Fresh Zone: Strong First Touch vs. a Zone Worn Down by Repeated Retests</text>

<line x1="310" y1="34" x2="310" y2="345" stroke="#e1e0d9" stroke-width="1"/>

<text x="35" y="52" font-size="12" fill="#5a5950" font-weight="700">1. Fresh Zone: Strong Bounce on First Touch</text>

<rect x="35" y="185" width="265" height="45" fill="#c98a1f" opacity="0.15" stroke="#c98a1f" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="35" y1="185" x2="300" y2="185" stroke="#a06a10" stroke-width="1.2"/>
<line x1="35" y1="230" x2="300" y2="230" stroke="#a06a10" stroke-width="1.2" stroke-dasharray="2,2"/>
<text x="40" y="180" font-size="10.5" fill="#a06a10" font-weight="700">Demand zone (base: 3 candles)</text>
<text x="255" y="197" font-size="8.5" fill="#a06a10">Proximal</text>
<text x="262" y="243" font-size="8.5" fill="#a06a10">Distal</text>

<rect x="90" y="193" width="12" height="16" fill="#eceae2" stroke="#767568" stroke-width="1.2"/>
<rect x="118" y="195" width="12" height="17" fill="#eceae2" stroke="#767568" stroke-width="1.2"/>
<rect x="146" y="192" width="12" height="16" fill="#eceae2" stroke="#767568" stroke-width="1.2"/>

<path d="M 40,120 L 70,160 L 96,199 L 124,204 L 152,200 L 185,130 L 210,75 L 235,95 L 260,195 L 285,140" fill="none" stroke="#1a5fb4" stroke-width="3"/>

<circle cx="260" cy="195" r="5.5" fill="#1f9d55"/>
<line x1="260" y1="195" x2="260" y2="252" stroke="#1f9d55" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="260" y="264" font-size="9.5" fill="#1f9d55" text-anchor="middle" font-weight="700">First touch (fresh) → strong bounce</text>

<line x1="35" y1="295" x2="60" y2="295" stroke="#c98a1f" stroke-width="8" opacity="0.3"/>
<text x="67" y="299" font-size="10" fill="#20201a">Demand zone (full base range)</text>
<rect x="35" y="308" width="12" height="14" fill="#eceae2" stroke="#767568" stroke-width="1.2"/>
<text x="67" y="319" font-size="10" fill="#20201a">Individual candles forming the base</text>

<text x="335" y="52" font-size="12" fill="#5a5950" font-weight="700">2. Same Zone, Worn Down by Retests → Fails</text>

<rect x="335" y="185" width="265" height="45" fill="#c98a1f" opacity="0.12" stroke="#c98a1f" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="335" y1="185" x2="600" y2="185" stroke="#a06a10" stroke-width="1.2"/>
<line x1="335" y1="230" x2="600" y2="230" stroke="#a06a10" stroke-width="1.2" stroke-dasharray="2,2"/>

<rect x="390" y="193" width="12" height="16" fill="#eceae2" stroke="#767568" stroke-width="1.2"/>
<rect x="418" y="195" width="12" height="17" fill="#eceae2" stroke="#767568" stroke-width="1.2"/>
<rect x="446" y="192" width="12" height="16" fill="#eceae2" stroke="#767568" stroke-width="1.2"/>

<path d="M 335,120 L 365,160 L 391,199 L 419,204 L 447,200 L 480,130 L 505,75 L 530,195 L 552,118 L 570,90 L 585,195 L 600,255" fill="none" stroke="#1a5fb4" stroke-width="3"/>

<circle cx="530" cy="195" r="5" fill="#1f9d55"/>
<line x1="530" y1="195" x2="530" y2="248" stroke="#1f9d55" stroke-width="1.1" stroke-dasharray="3,2"/>
<text x="530" y="259" font-size="9" fill="#1f9d55" text-anchor="middle" font-weight="700">1st touch: bounces</text>

<circle cx="585" cy="195" r="5.5" fill="#d0453b"/>
<line x1="585" y1="195" x2="585" y2="278" stroke="#d0453b" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="585" y="290" font-size="9" fill="#d0453b" text-anchor="middle" font-weight="700">2nd touch: zone fails</text>

<line x1="335" y1="308" x2="360" y2="308" stroke="#1f9d55" stroke-width="3"/>
<text x="367" y="312" font-size="10" fill="#20201a">First visit reacts strongly (fresh)</text>
<line x1="335" y1="325" x2="360" y2="325" stroke="#d0453b" stroke-width="3"/>
<text x="367" y="329" font-size="10" fill="#20201a">Each retest weakens, then fails</text>
</svg>
