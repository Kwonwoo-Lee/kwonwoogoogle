<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="620" height="380" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="13.5" fill="#20201a" text-anchor="middle" font-weight="700">수요존 프레시존 첫 터치 반등 vs 반복 테스트 후 존 붕괴</text>

<line x1="310" y1="34" x2="310" y2="345" stroke="#e1e0d9" stroke-width="1"/>

<text x="35" y="52" font-size="12" fill="#5a5950" font-weight="700">① 프레시존: 첫 터치에서 강한 반등</text>

