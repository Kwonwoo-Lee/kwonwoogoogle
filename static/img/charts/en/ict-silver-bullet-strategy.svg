<text x="529" y="92" font-size="9.5" fill="#177a42" text-anchor="middle">(14:00-15:00)</text>

<text x="580" y="150" font-size="9.5" fill="#9b9a8f" text-anchor="end" font-style="italic">* All times shown in New York time (ET)</text>

<line x1="20" y1="172" x2="600" y2="172" stroke="#e1e0d9" stroke-width="1"/>

<text x="40" y="196" font-size="12" fill="#5a5950" font-weight="700">② Inside the Killzone: Liquidity Sweep → Displacement → FVG Entry</text>

<line x1="70" y1="300" x2="270" y2="300" stroke="#767568" stroke-width="1.3" stroke-dasharray="5,4"/>
<text x="72" y="292" font-size="10" fill="#767568">Prior low (liquidity)</text>

<path d="M 60,250 L 110,268 L 150,318 L 190,232 L 230,178 L 270,196 L 320,168 L 360,178" fill="none" stroke="#1a5fb4" stroke-width="3"/>

<circle cx="150" cy="318" r="5.5" fill="#d0453b"/>
<text x="150" y="336" font-size="10" fill="#d0453b" text-anchor="middle" font-weight="700">Liquidity sweep</text>

