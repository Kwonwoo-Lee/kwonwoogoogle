<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="620" height="400" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="15" fill="#20201a" text-anchor="middle" font-weight="700">VIX 선물 기간구조: 콘탱고 vs 백워데이션</text>

<!-- Contango panel -->
<text x="150" y="52" font-size="12" fill="#1a5fb4" text-anchor="middle" font-weight="700">콘탱고 (평온한 시장의 기본 상태)</text>
<line x1="60" y1="150" x2="60" y2="60" stroke="#8a8a7c" stroke-width="1.5"/>
<line x1="60" y1="150" x2="270" y2="150" stroke="#8a8a7c" stroke-width="1.5"/>
<path d="M 60,140 L 130,115 L 200,90 L 270,68" fill="none" stroke="#1a5fb4" stroke-width="3"/>
<circle cx="60" cy="140" r="4" fill="#1a5fb4"/>
<circle cx="130" cy="115" r="4" fill="#1a5fb4"/>
<circle cx="200" cy="90" r="4" fill="#1a5fb4"/>
<circle cx="270" cy="68" r="4" fill="#1a5fb4"/>
<text x="60" y="165" font-size="10.5" fill="#5a5a4e" text-anchor="middle">현물</text>
<text x="130" y="165" font-size="10.5" fill="#5a5a4e" text-anchor="middle">1개월물</text>
<text x="200" y="165" font-size="10.5" fill="#5a5a4e" text-anchor="middle">2개월물</text>
<text x="270" y="165" font-size="10.5" fill="#5a5a4e" text-anchor="middle">3개월물</text>
<path d="M 130,112 L 100,140" fill="none" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow1)"/>
<text x="90" y="132" font-size="10" fill="#b8860b" text-anchor="end">롤다운</text>

<!-- Backwardation panel -->
<text x="470" y="52" font-size="12" fill="#d0453b" text-anchor="middle" font-weight="700">백워데이션 (급락·위기 직후의 예외 상태)</text>
<line x1="380" y1="150" x2="380" y2="60" stroke="#8a8a7c" stroke-width="1.5"/>
<line x1="380" y1="150" x2="590" y2="150" stroke="#8a8a7c" stroke-width="1.5"/>
<path d="M 380,68 L 450,90 L 520,112 L 590,132" fill="none" stroke="#d0453b" stroke-width="3"/>
<circle cx="380" cy="68" r="4" fill="#d0453b"/>
<circle cx="450" cy="90" r="4" fill="#d0453b"/>
<circle cx="520" cy="112" r="4" fill="#d0453b"/>
<circle cx="590" cy="132" r="4" fill="#d0453b"/>
<text x="380" y="165" font-size="10.5" fill="#5a5a4e" text-anchor="middle">현물</text>
<text x="450" y="165" font-size="10.5" fill="#5a5a4e" text-anchor="middle">1개월물</text>
<text x="520" y="165" font-size="10.5" fill="#5a5a4e" text-anchor="middle">2개월물</text>
<text x="590" y="165" font-size="10.5" fill="#5a5a4e" text-anchor="middle">3개월물</text>

<line x1="40" y1="195" x2="580" y2="195" stroke="#e1e0d9" stroke-width="1"/>

<!-- VIX3M/VIX ratio timeline -->
<text x="310" y="220" font-size="12.5" fill="#20201a" text-anchor="middle" font-weight="700">VIX3M / VIX 비율로 본 체제 전환</text>
<line x1="60" y1="330" x2="580" y2="330" stroke="#8a8a7c" stroke-width="1.5"/>
<line x1="60" y1="330" x2="60" y2="250" stroke="#8a8a7c" stroke-width="1.5"/>
<line x1="60" y1="290" x2="580" y2="290" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="585" y="294" font-size="11" fill="#b8860b" text-anchor="start">비율 = 1.0</text>
<text x="55" y="290" font-size="10.5" fill="#8a8a7c" text-anchor="end">1.0</text>

<path d="M 60,270 L 130,265 L 200,275 L 270,260 L 340,320 L 400,325 L 460,300 L 520,278 L 580,268" fill="none" stroke="#3a3a30" stroke-width="2.5"/>
<rect x="300" y="252" width="120" height="80" fill="#d0453b" opacity="0.08"/>
<text x="360" y="345" font-size="10.5" fill="#d0453b" text-anchor="middle" font-weight="700">백워데이션 구간(급락)</text>
<text x="150" y="345" font-size="10.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">콘탱고 구간(평온)</text>
<text x="500" y="345" font-size="10.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">콘탱고로 복귀</text>

<line x1="50" y1="378" x2="80" y2="378" stroke="#1a5fb4" stroke-width="3"/>
<text x="88" y="383" font-size="12.5" fill="#20201a" text-anchor="start">콘탱고: 원월물이 근월물보다 비쌈(우상향)</text>
<line x1="330" y1="378" x2="360" y2="378" stroke="#d0453b" stroke-width="3"/>
<text x="368" y="383" font-size="12.5" fill="#20201a" text-anchor="start">백워데이션: 근월물이 원월물보다 비쌈(우하향)</text>
</svg>
