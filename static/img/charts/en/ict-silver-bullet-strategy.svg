<text x="158" y="92" font-size="9.5" fill="#6a3aa8" text-anchor="middle">(03:00-04:00)</text>

<rect x="377.5" y="98" width="33.75" height="24" fill="#1a5fb4" opacity="0.18" stroke="#1a5fb4" stroke-width="1.5"/>
<text x="394" y="80" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">AM Session SB</text>
<text x="394" y="92" font-size="9.5" fill="#1a5fb4" text-anchor="middle">(10:00-11:00)</text>

<rect x="512.5" y="98" width="33.75" height="24" fill="#1f9d55" opacity="0.18" stroke="#1f9d55" stroke-width="1.5"/>
