<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="620" height="340" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="15" fill="#20201a" text-anchor="middle" font-weight="700">AAII Bull-Bear Spread vs NAAIM Exposure Index</text>
<text x="310" y="44" font-size="11" fill="#5a5850" text-anchor="middle">Retail investors' "opinion" vs. active managers' "actual position"</text>

<!-- AAII gauge -->
<text x="40" y="78" font-size="12" fill="#20201a" text-anchor="start" font-weight="700">AAII Bull-Bear Spread</text>
<rect x="60" y="88" width="130" height="36" fill="#d0453b"/>
<rect x="190" y="88" width="104" height="36" fill="#e08a5c"/>
<rect x="294" y="88" width="52" height="36" fill="#c9c7ba"/>
<rect x="346" y="88" width="104" height="36" fill="#8fc08a"/>
<rect x="450" y="88" width="130" height="36" fill="#1f9d55"/>
<rect x="60" y="88" width="520" height="36" fill="none" stroke="#3a3a30" stroke-width="1.5"/>

<text x="60" y="134" font-size="9" fill="#5a5850" text-anchor="middle">-50</text>
<text x="190" y="134" font-size="9" fill="#5a5850" text-anchor="middle">-20</text>
<text x="320" y="134" font-size="9" fill="#5a5850" text-anchor="middle">0</text>
<text x="450" y="134" font-size="9" fill="#5a5850" text-anchor="middle">+20</text>
<text x="580" y="134" font-size="9" fill="#5a5850" text-anchor="middle">+50</text>

<circle cx="146" cy="106" r="5" fill="#20201a" stroke="#fff" stroke-width="1"/>
<line x1="146" y1="106" x2="146" y2="160" stroke="#20201a" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="146" y="174" font-size="11" fill="#20201a" text-anchor="middle" font-weight="700">Example: -33%</text>

<!-- NAAIM gauge -->
<text x="40" y="208" font-size="12" fill="#20201a" text-anchor="start" font-weight="700">NAAIM Exposure Index</text>
<rect x="60" y="218" width="110" height="36" fill="#d0453b"/>
<rect x="170" y="218" width="110" height="36" fill="#e08a5c"/>
<rect x="280" y="218" width="130" height="36" fill="#c9c7ba"/>
<rect x="410" y="218" width="100" height="36" fill="#8fc08a"/>
<rect x="510" y="218" width="70" height="36" fill="#1f9d55"/>
<rect x="60" y="218" width="520" height="36" fill="none" stroke="#3a3a30" stroke-width="1.5"/>

<text x="60" y="264" font-size="9" fill="#5a5850" text-anchor="middle">0</text>
<text x="170" y="264" font-size="9" fill="#5a5850" text-anchor="middle">40</text>
<text x="345" y="264" font-size="9" fill="#5a5850" text-anchor="middle">~60-70 avg</text>
<text x="510" y="264" font-size="9" fill="#5a5850" text-anchor="middle">90</text>
<text x="580" y="264" font-size="9" fill="#5a5850" text-anchor="middle">130</text>

<circle cx="94" cy="236" r="5" fill="#20201a" stroke="#fff" stroke-width="1"/>
<line x1="94" y1="236" x2="94" y2="285" stroke="#20201a" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="94" y="299" font-size="11" fill="#20201a" text-anchor="middle" font-weight="700">Example: 28</text>

<text x="400" y="178" font-size="10" fill="#8a4a44" text-anchor="middle" font-style="italic">Both gauges leaning the same way = broad-based pessimism/defense</text>

<line x1="40" y1="320" x2="70" y2="320" stroke="#3a3a30" stroke-width="3"/>
<text x="78" y="325" font-size="11" fill="#20201a" text-anchor="start" font-weight="400">Top: retail survey (opinion) · Bottom: active managers' actual exposure (position)</text>
</svg>
