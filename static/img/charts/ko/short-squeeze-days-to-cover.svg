<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="620" height="340" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="14.5" fill="#20201a" text-anchor="middle" font-weight="700">숏스퀴즈: 되먹임 고리 &amp; 잔고 소진 vs 주가 급등 패턴</text>

<line x1="30" y1="180" x2="290" y2="180" stroke="#e1e0d9" stroke-width="1"/>
<text x="30" y="52" font-size="12" fill="#5a5950" font-weight="700">되먹임 고리</text>

<circle cx="150" cy="90" r="46" fill="none" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="3,3"/>

<rect x="45" y="60" width="86" height="36" rx="8" fill="#1a5fb4" opacity="0.12" stroke="#1a5fb4" stroke-width="1.3"/>
<text x="88" y="80" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">① 주가 상승</text>
<text x="88" y="92" font-size="9" fill="#1a5fb4" text-anchor="middle">(촉매 발생)</text>

<rect x="185" y="60" width="90" height="36" rx="8" fill="#d0453b" opacity="0.12" stroke="#d0453b" stroke-width="1.3"/>
<text x="230" y="80" font-size="10" fill="#d0453b" text-anchor="middle" font-weight="700">② 손실 확대</text>
<text x="230" y="92" font-size="9" fill="#d0453b" text-anchor="middle">(공매도 평가손)</text>

<rect x="185" y="130" width="90" height="36" rx="8" fill="#c98a1f" opacity="0.14" stroke="#c98a1f" stroke-width="1.3"/>
<text x="230" y="150" font-size="10" fill="#a06a10" text-anchor="middle" font-weight="700">③ 마진콜·청산</text>
<text x="230" y="162" font-size="9" fill="#a06a10" text-anchor="middle">(강제 매수 주문)</text>

<rect x="45" y="130" width="86" height="36" rx="8" fill="#1f9d55" opacity="0.14" stroke="#1f9d55" stroke-width="1.3"/>
<text x="88" y="150" font-size="10" fill="#177a42" text-anchor="middle" font-weight="700">④ 커버 매수</text>
<text x="88" y="162" font-size="9" fill="#177a42" text-anchor="middle">(주가 추가 상승)</text>

<path d="M 131,78 L 183,78" fill="none" stroke="#767568" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 230,96 L 230,128" fill="none" stroke="#767568" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 183,148 L 133,148" fill="none" stroke="#767568" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 88,128 L 88,98" fill="none" stroke="#767568" stroke-width="1.6" marker-end="url(#arrow)"/>

<defs>
  <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#767568"/>
  </marker>
</defs>

<text x="160" y="200" font-size="10.5" fill="#5a5950" text-anchor="middle">①→②→③→④가 반복되며 짧은 시간에 가파른 상승을 만든다</text>

<line x1="325" y1="30" x2="325" y2="315" stroke="#e1e0d9" stroke-width="1"/>

<text x="475" y="52" font-size="12" fill="#5a5950" text-anchor="middle" font-weight="700">실제 스퀴즈 국면: 잔고 소진 vs 주가</text>

<line x1="345" y1="270" x2="600" y2="270" stroke="#c7c6bb" stroke-width="1"/>
<line x1="345" y1="60" x2="345" y2="270" stroke="#c7c6bb" stroke-width="1"/>

<rect x="355" y="200" width="26" height="70" fill="#c98a1f" opacity="0.55"/>
<rect x="400" y="215" width="26" height="55" fill="#c98a1f" opacity="0.55"/>
<rect x="445" y="235" width="26" height="35" fill="#c98a1f" opacity="0.55"/>
<rect x="490" y="250" width="26" height="20" fill="#c98a1f" opacity="0.55"/>
<rect x="535" y="258" width="26" height="12" fill="#c98a1f" opacity="0.55"/>
<text x="475" y="286" font-size="10" fill="#a06a10" text-anchor="middle" font-weight="700">공매도 잔고(막대, 소진 중)</text>

<path d="M 368,235 L 413,205 L 458,170 L 503,120 L 548,80" fill="none" stroke="#1a5fb4" stroke-width="3"/>
<circle cx="548" cy="80" r="5" fill="#1a5fb4"/>
<text x="548" y="66" font-size="10.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">주가(선, 급등)</text>

<text x="475" y="300" font-size="9.5" fill="#767568" text-anchor="middle">잔고가 줄어드는 동안(커버 매수) 주가는 가파르게 상승</text>
</svg>
