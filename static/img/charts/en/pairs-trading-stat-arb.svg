<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="620" height="340" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="14.5" fill="#20201a" text-anchor="middle" font-weight="700">Pairs Trading: Spread Divergence &amp; Z-Score Entry</text>

<line x1="30" y1="180" x2="290" y2="180" stroke="#e1e0d9" stroke-width="1"/>
<text x="30" y="50" font-size="12" fill="#5a5950" font-weight="700">Two correlated stocks temporarily diverge</text>

<rect x="160" y="55" width="110" height="180" fill="#d0453b" opacity="0.07" stroke="#d0453b" stroke-width="1.3" stroke-dasharray="5,4"/>
<text x="215" y="70" font-size="10.5" fill="#d0453b" text-anchor="middle" font-weight="700">Divergence window</text>

<path d="M 40,180 L 80,182 L 120,179 L 160,177 L 200,176 L 240,178 L 270,175" fill="none" stroke="#767568" stroke-width="3"/>
<path d="M 40,180 L 80,178 L 120,172 L 160,155 L 200,125 L 240,100 L 270,85" fill="none" stroke="#1a5fb4" stroke-width="3"/>

<circle cx="40" cy="180" r="5" fill="#20201a"/>
<text x="40" y="198" font-size="9.5" fill="#20201a" text-anchor="middle" font-weight="700">Moving together</text>

<circle cx="270" cy="85" r="5" fill="#1a5fb4"/>
<circle cx="270" cy="175" r="5" fill="#767568"/>
<line x1="270" y1="85" x2="270" y2="175" stroke="#d0453b" stroke-width="1.3" stroke-dasharray="3,2"/>
<text x="222" y="122" font-size="9.5" fill="#d0453b" text-anchor="middle" font-weight="700">Spread</text>

<line x1="40" y1="225" x2="65" y2="225" stroke="#1a5fb4" stroke-width="3"/>
<text x="72" y="229" font-size="10.5" fill="#20201a">Stock A (relatively expensive)</text>
<line x1="40" y1="245" x2="65" y2="245" stroke="#767568" stroke-width="3"/>
<text x="72" y="249" font-size="10.5" fill="#20201a">Stock B (relatively cheap)</text>

<line x1="325" y1="30" x2="325" y2="315" stroke="#e1e0d9" stroke-width="1"/>

<text x="470" y="50" font-size="12" fill="#5a5950" text-anchor="middle" font-weight="700">Spread z-score</text>

<line x1="345" y1="130" x2="600" y2="130" stroke="#c98a1f" stroke-width="1.3" stroke-dasharray="5,3"/>
<text x="605" y="134" font-size="10" fill="#c98a1f" text-anchor="start" font-weight="700">+2</text>
<line x1="345" y1="180" x2="600" y2="180" stroke="#767568" stroke-width="1.3" stroke-dasharray="5,3"/>
<text x="605" y="184" font-size="10" fill="#767568" text-anchor="start" font-weight="700">0</text>
<line x1="345" y1="230" x2="600" y2="230" stroke="#c98a1f" stroke-width="1.3" stroke-dasharray="5,3" opacity="0.6"/>
<text x="605" y="234" font-size="10" fill="#c98a1f" text-anchor="start" font-weight="700" opacity="0.6">-2</text>

<path d="M 345,178 L 390,163 L 435,138 L 460,128 L 480,110 L 525,124 L 570,180" fill="none" stroke="#1a5fb4" stroke-width="3"/>

<circle cx="460" cy="128" r="6" fill="#d0453b"/>
<line x1="460" y1="128" x2="460" y2="255" stroke="#d0453b" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="460" y="270" font-size="10" fill="#d0453b" text-anchor="middle" font-weight="700">Entry: short the spread</text>
<text x="460" y="283" font-size="9" fill="#d0453b" text-anchor="middle">(short A + long B)</text>

<circle cx="570" cy="180" r="6" fill="#1f9d55"/>
<line x1="570" y1="180" x2="570" y2="255" stroke="#1f9d55" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="570" y="270" font-size="10" fill="#1f9d55" text-anchor="middle" font-weight="700">Exit: reversion</text>
<text x="570" y="283" font-size="9" fill="#1f9d55" text-anchor="middle">complete</text>

<line x1="345" y1="300" x2="365" y2="300" stroke="#1a5fb4" stroke-width="3"/>
<text x="372" y="304" font-size="10.5" fill="#20201a">Spread z-score path</text>
</svg>
