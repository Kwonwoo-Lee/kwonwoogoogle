<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="620" height="340" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="14.5" fill="#20201a" text-anchor="middle" font-weight="700">0DTE: 세타·감마 급증 곡선 &amp; 아이언콘도르 손익 구조</text>

<text x="30" y="50" font-size="12" fill="#5a5950" font-weight="700">만기가 가까워질수록 커지는 세타·감마</text>

<line x1="45" y1="270" x2="300" y2="270" stroke="#c7c6bb" stroke-width="1"/>
<line x1="45" y1="70" x2="45" y2="270" stroke="#c7c6bb" stroke-width="1"/>

<path d="M 45,262 C 130,258 200,240 240,205 C 265,180 285,140 300,90" fill="none" stroke="#d0453b" stroke-width="3"/>
<text x="303" y="86" font-size="10.5" fill="#d0453b" font-weight="700">감마</text>

<path d="M 45,255 C 130,245 195,215 235,175 C 262,148 282,115 300,80" fill="none" stroke="#1a5fb4" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="303" y="72" font-size="10.5" fill="#1a5fb4" font-weight="700">세타</text>

<line x1="255" y1="70" x2="255" y2="270" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="255" y="284" font-size="10" fill="#a06a10" text-anchor="middle" font-weight="700">0DTE 구간</text>

<text x="45" y="298" font-size="10" fill="#767568" text-anchor="start">만기 여유 있음</text>
<text x="300" y="298" font-size="10" fill="#767568" text-anchor="end">당일 만기(0DTE)</text>
<text x="172" y="312" font-size="9.5" fill="#5a5950" text-anchor="middle">만기까지 남은 시간 (오른쪽으로 갈수록 0에 수렴)</text>

<line x1="325" y1="30" x2="325" y2="315" stroke="#e1e0d9" stroke-width="1"/>

<text x="475" y="50" font-size="12" fill="#5a5950" text-anchor="middle" font-weight="700">0DTE 아이언콘도르 손익 구조</text>

<line x1="345" y1="240" x2="600" y2="240" stroke="#c7c6bb" stroke-width="1"/>
<line x1="345" y1="90" x2="345" y2="240" stroke="#c7c6bb" stroke-width="1"/>
<text x="341" y="150" font-size="9" fill="#767568" text-anchor="end">손익</text>

<path d="M 355,225 L 400,225 L 430,150 L 460,120 L 545,120 L 575,150 L 595,225" fill="#1f9d55" opacity="0.14" stroke="none"/>
<path d="M 355,225 L 400,225 L 430,150 L 460,120 L 545,120 L 575,150 L 595,225" fill="none" stroke="#1f9d55" stroke-width="2.5"/>

<line x1="345" y1="120" x2="600" y2="120" stroke="#1f9d55" stroke-width="1" stroke-dasharray="3,3"/>
<text x="600" y="114" font-size="9.5" fill="#177a42" text-anchor="end">최대 이익(받은 프리미엄)</text>

<line x1="345" y1="225" x2="600" y2="225" stroke="#d0453b" stroke-width="1" stroke-dasharray="3,3"/>
<text x="600" y="235" font-size="9.5" fill="#a5342c" text-anchor="end">최대 손실(스프레드 폭 - 프리미엄)</text>

<line x1="430" y1="90" x2="430" y2="240" stroke="#c7c6bb" stroke-width="1" stroke-dasharray="2,3"/>
<text x="430" y="252" font-size="9" fill="#767568" text-anchor="middle">풋 매도 행사가</text>
<line x1="545" y1="90" x2="545" y2="240" stroke="#c7c6bb" stroke-width="1" stroke-dasharray="2,3"/>
<text x="545" y="252" font-size="9" fill="#767568" text-anchor="middle">콜 매도 행사가</text>

<text x="475" y="268" font-size="9.5" fill="#767568" text-anchor="middle">두 행사가 사이에 머물면 이익, 벗어나면 정의된 손실</text>
</svg>
