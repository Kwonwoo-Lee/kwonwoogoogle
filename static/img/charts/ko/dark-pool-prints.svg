<circle cx="375" cy="203" r="5" fill="#1a5fb4" opacity="0.75"/>

<circle cx="435" cy="204" r="5" fill="#1a5fb4" opacity="0.75"/>
<circle cx="435" cy="192" r="5" fill="#1a5fb4" opacity="0.75"/>
<circle cx="435" cy="180" r="6" fill="#1a5fb4" opacity="0.75"/>

<circle cx="495" cy="190" r="6" fill="#1a5fb4" opacity="0.75"/>
