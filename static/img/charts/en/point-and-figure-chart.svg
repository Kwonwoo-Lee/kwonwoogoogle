<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="620" height="400" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="15" fill="#20201a" text-anchor="middle" font-weight="700">Time-Based Candlestick Chart vs. Point and Figure (P&amp;F) Chart</text>

<text x="165" y="50" font-size="12" fill="#5a5950" text-anchor="middle" font-weight="700">Candlesticks (new bar every period)</text>
<text x="460" y="50" font-size="12" fill="#5a5950" text-anchor="middle" font-weight="700">P&amp;F (column flips only on 3-box reversal)</text>

<line x1="310" y1="45" x2="310" y2="345" stroke="#c7c6bd" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="30" y1="345" x2="590" y2="345" stroke="#e1e0d9" stroke-width="1"/>

<!-- Left panel: noisy time-based price line -->
<polyline points="45,335 65,328 85,332 105,310 125,318 145,290 165,300 185,260 205,270 225,225 245,235 265,195 285,205 300,165"
  fill="none" stroke="#5a5950" stroke-width="2"/>
<circle cx="45" cy="335" r="3" fill="#5a5950"/>
<circle cx="65" cy="328" r="3" fill="#5a5950"/>
<circle cx="85" cy="332" r="3.5" fill="#d0453b"/>
<circle cx="105" cy="310" r="3" fill="#5a5950"/>
<circle cx="125" cy="318" r="3.5" fill="#d0453b"/>
<circle cx="145" cy="290" r="3" fill="#5a5950"/>
<circle cx="165" cy="300" r="3.5" fill="#d0453b"/>
<circle cx="185" cy="260" r="3" fill="#5a5950"/>
<circle cx="205" cy="270" r="3.5" fill="#d0453b"/>
<circle cx="225" cy="225" r="3" fill="#5a5950"/>
<circle cx="245" cy="235" r="3.5" fill="#d0453b"/>
<circle cx="265" cy="195" r="3" fill="#5a5950"/>
<circle cx="285" cy="205" r="3.5" fill="#d0453b"/>
<circle cx="300" cy="165" r="3" fill="#5a5950"/>
<text x="167" y="368" font-size="10" fill="#a8362d" text-anchor="middle">Every small wiggle still gets its own candle</text>

<!-- Right panel: P&F grid, box size guide -->
<line x1="335" y1="345" x2="335" y2="323" stroke="#767568" stroke-width="1"/>
<line x1="330" y1="345" x2="340" y2="345" stroke="#767568" stroke-width="1"/>
<line x1="330" y1="323" x2="340" y2="323" stroke="#767568" stroke-width="1"/>
<text x="322" y="331" font-size="8.5" fill="#767568" text-anchor="end">box</text>
<text x="322" y="340" font-size="8.5" fill="#767568" text-anchor="end">size</text>

<!-- Column A: X's rising 5 boxes, x=345-371, box height 22 -->
<g>
  <rect x="345" y="323" width="26" height="22" fill="#e3f5e8" stroke="#1f9d55" stroke-width="1.5"/>
  <rect x="345" y="301" width="26" height="22" fill="#e3f5e8" stroke="#1f9d55" stroke-width="1.5"/>
  <rect x="345" y="279" width="26" height="22" fill="#e3f5e8" stroke="#1f9d55" stroke-width="1.5"/>
  <rect x="345" y="257" width="26" height="22" fill="#e3f5e8" stroke="#1f9d55" stroke-width="1.5"/>
  <rect x="345" y="235" width="26" height="22" fill="#e3f5e8" stroke="#1f9d55" stroke-width="1.5"/>
  <text x="358" y="339" font-size="14" text-anchor="middle" font-weight="700" fill="#1f9d55">X</text>
  <text x="358" y="317" font-size="14" text-anchor="middle" font-weight="700" fill="#1f9d55">X</text>
  <text x="358" y="295" font-size="14" text-anchor="middle" font-weight="700" fill="#1f9d55">X</text>
  <text x="358" y="273" font-size="14" text-anchor="middle" font-weight="700" fill="#1f9d55">X</text>
  <text x="358" y="251" font-size="14" text-anchor="middle" font-weight="700" fill="#1f9d55">X</text>
</g>

<!-- Column B: O's falling 3 boxes (reversal), x=373-399 -->
<g>
  <rect x="373" y="279" width="26" height="22" fill="#fbe1df" stroke="#d0453b" stroke-width="1.5"/>
  <rect x="373" y="301" width="26" height="22" fill="#fbe1df" stroke="#d0453b" stroke-width="1.5"/>
  <rect x="373" y="323" width="26" height="22" fill="#fbe1df" stroke="#d0453b" stroke-width="1.5"/>
  <text x="386" y="295" font-size="14" text-anchor="middle" font-weight="700" fill="#d0453b">O</text>
  <text x="386" y="317" font-size="14" text-anchor="middle" font-weight="700" fill="#d0453b">O</text>
  <text x="386" y="339" font-size="14" text-anchor="middle" font-weight="700" fill="#d0453b">O</text>
</g>
<text x="386" y="360" font-size="9" fill="#a8362d" text-anchor="middle">3-box reversal</text>

<!-- Column C: X's resuming uptrend, breaking above column A top, x=401-427 -->
<g>
  <rect x="401" y="323" width="26" height="22" fill="#e3f5e8" stroke="#1f9d55" stroke-width="1.5"/>
  <rect x="401" y="301" width="26" height="22" fill="#e3f5e8" stroke="#1f9d55" stroke-width="1.5"/>
  <rect x="401" y="279" width="26" height="22" fill="#e3f5e8" stroke="#1f9d55" stroke-width="1.5"/>
  <rect x="401" y="257" width="26" height="22" fill="#e3f5e8" stroke="#1f9d55" stroke-width="1.5"/>
  <rect x="401" y="235" width="26" height="22" fill="#e3f5e8" stroke="#1f9d55" stroke-width="1.5"/>
  <!-- breakout box, exceeding column A top -->
  <rect x="401" y="213" width="26" height="22" fill="#c3ecd0" stroke="#1f9d55" stroke-width="2.5"/>
  <text x="414" y="339" font-size="14" text-anchor="middle" font-weight="700" fill="#1f9d55">X</text>
  <text x="414" y="317" font-size="14" text-anchor="middle" font-weight="700" fill="#1f9d55">X</text>
  <text x="414" y="295" font-size="14" text-anchor="middle" font-weight="700" fill="#1f9d55">X</text>
  <text x="414" y="273" font-size="14" text-anchor="middle" font-weight="700" fill="#1f9d55">X</text>
  <text x="414" y="251" font-size="14" text-anchor="middle" font-weight="700" fill="#1f9d55">X</text>
  <text x="414" y="229" font-size="14" text-anchor="middle" font-weight="700" fill="#0d7a3c">X</text>
</g>

<line x1="401" y1="235" x2="450" y2="235" stroke="#767568" stroke-width="1" stroke-dasharray="4,2"/>
<text x="453" y="238" font-size="9" fill="#767568" text-anchor="start">prior X column high</text>

<path d="M 455 218 Q 475 200 495 210" fill="none" stroke="#1f9d55" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="497" y="192" font-size="10.5" fill="#1f9d55" text-anchor="start" font-weight="700">Double top</text>
<text x="497" y="205" font-size="10.5" fill="#1f9d55" text-anchor="start" font-weight="700">breakout</text>

<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#1f9d55"/>
  </marker>
</defs>

<rect x="70" y="380" width="12" height="12" fill="#e3f5e8" stroke="#1f9d55" stroke-width="1.5"/>
<text x="86" y="390" font-size="11" fill="#20201a" text-anchor="start">X column (up move)</text>
<rect x="230" y="380" width="12" height="12" fill="#fbe1df" stroke="#d0453b" stroke-width="1.5"/>
<text x="246" y="390" font-size="11" fill="#20201a" text-anchor="start">O column (down move, after 3-box reversal)</text>
</svg>
