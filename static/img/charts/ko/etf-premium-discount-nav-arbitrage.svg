<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="620" height="440" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="13.5" fill="#20201a" text-anchor="middle" font-weight="700">ETF 괴리율의 수렴 vs 폐쇄형펀드 디스카운트의 지속</text>

<text x="40" y="52" font-size="12" fill="#5a5950" font-weight="700">① 해외 ETF: 시차로 벌어진 괴리 → AP 차익거래로 수렴</text>

<line x1="40" y1="130" x2="580" y2="130" stroke="#767568" stroke-width="1.3" stroke-dasharray="5,4"/>
<text x="42" y="122" font-size="10" fill="#767568">NAV (전일 미국 종가 기준, 동결)</text>

<rect x="130" y="70" width="230" height="110" fill="#767568" opacity="0.12" stroke="#767568" stroke-width="1.3" stroke-dasharray="4,3"/>
<text x="245" y="86" font-size="10" fill="#5a5950" text-anchor="middle" font-weight="700">KRX 거래시간 — 미국시장 휴장</text>
<text x="245" y="98" font-size="9.5" fill="#5a5950" text-anchor="middle">(NAV는 전일 종가로 고정)</text>

<path d="M 40,130 L 130,130 L 170,112 L 220,95 L 280,88 L 360,82 L 420,105 L 480,128 L 540,130 L 580,130" fill="none" stroke="#1a5fb4" stroke-width="3"/>
<text x="300" y="68" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">ETF 시장가격 (LP 호가, 선물 선반영)</text>

<circle cx="280" cy="88" r="5" fill="#d0453b"/>
<text x="280" y="196" font-size="10" fill="#a8362d" text-anchor="middle" font-weight="700">최대 괴리(프리미엄)</text>
<line x1="280" y1="93" x2="280" y2="188" stroke="#d0453b" stroke-width="1" stroke-dasharray="3,3"/>

<line x1="420" y1="105" x2="420" y2="130" stroke="#1f9d55" stroke-width="1.5"/>
<text x="490" y="60" font-size="10" fill="#177a42" text-anchor="middle" font-weight="700">미국시장 개장 →</text>
<text x="490" y="72" font-size="10" fill="#177a42" text-anchor="middle" font-weight="700">AP 창조·환매로 재수렴</text>

<text x="580" y="152" font-size="9.5" fill="#9b9a8f" text-anchor="end" font-style="italic">* 괴리가 좁혀지는 방향(가격↓ 또는 NAV↑)은 사전에 알 수 없음</text>

<line x1="20" y1="214" x2="600" y2="214" stroke="#e1e0d9" stroke-width="1"/>

<text x="40" y="240" font-size="12" fill="#5a5950" font-weight="700">② 폐쇄형펀드(CEF): 차익거래 메커니즘 없음 → 디스카운트 장기 지속</text>

<line x1="40" y1="280" x2="580" y2="280" stroke="#767568" stroke-width="1.3" stroke-dasharray="5,4"/>
<text x="42" y="272" font-size="10" fill="#767568">NAV (순자산가치)</text>

<path d="M 40,330 L 130,332 L 220,328 L 310,331 L 400,329 L 460,330" fill="none" stroke="#8a4fd1" stroke-width="3"/>
<text x="240" y="352" font-size="10" fill="#6a3aa8" text-anchor="middle" font-weight="700">디스카운트가 수개월~수년간 그대로 유지</text>

<rect x="40" y="280" width="420" height="50" fill="#8a4fd1" opacity="0.08"/>

<path d="M 460,330 L 500,310 L 540,270 L 580,264" fill="none" stroke="#8a4fd1" stroke-width="3"/>
<circle cx="500" cy="310" r="5" fill="#d0453b"/>
<text x="500" y="400" font-size="10" fill="#a8362d" text-anchor="middle" font-weight="700">촉매 발생</text>
<text x="500" y="412" font-size="9.5" fill="#a8362d" text-anchor="middle">(탠더오퍼·행동주의)</text>
<line x1="500" y1="315" x2="500" y2="392" stroke="#d0453b" stroke-width="1" stroke-dasharray="3,3"/>

<text x="80" y="300" font-size="10" fill="#767568" text-anchor="start">시간 →</text>

<rect x="70" y="376" width="490" height="30" rx="6" fill="#fbeee9" stroke="#d0453b" stroke-width="1"/>
<text x="315" y="395" font-size="10.5" fill="#a8362d" text-anchor="middle" font-weight="700">⚠ ETF 괴리는 빠르게 닫히지만, CEF 디스카운트는 촉매 없이는 닫히지 않음</text>
</svg>
