<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="620" height="360" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">합병 차익거래: 딜 스프레드와 딜 성사 vs 딜 브레이크 시나리오</text>

<line x1="55" y1="300" x2="580" y2="300" stroke="#c7c6bb" stroke-width="1"/>
<line x1="55" y1="55" x2="55" y2="300" stroke="#c7c6bb" stroke-width="1"/>
<text x="60" y="315" font-size="10" fill="#767568">발표 전</text>
<text x="180" y="315" font-size="10" fill="#767568">M&amp;A 발표</text>
<text x="560" y="315" font-size="10" fill="#767568" text-anchor="end">종결(예상)</text>

<line x1="55" y1="90" x2="580" y2="90" stroke="#1f9d55" stroke-width="1.3" stroke-dasharray="5,4"/>
<text x="60" y="82" font-size="10.5" fill="#177a42" font-weight="700">인수제안가 (Offer Price) $200</text>

<line x1="55" y1="270" x2="180" y2="270" stroke="#767568" stroke-width="1.3" stroke-dasharray="5,4"/>
