<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="640" height="380" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="22" font-size="13.5" fill="#20201a" text-anchor="middle" font-weight="700">Triple Witching Day: Three Expirations Converge Each Quarter</text>

<!-- legend box -->
<rect x="408" y="32" width="202" height="70" rx="6" fill="#f3f2ec" stroke="#e1e0d9"/>
<text x="418" y="46" font-size="9.5" fill="#5a5950" font-weight="700">Expiring the same day</text>
<circle cx="422" cy="59" r="4" fill="#1a5fb4"/>
<text x="431" y="62.5" font-size="9" fill="#20201a">Stock options (close settlement)</text>
<circle cx="422" cy="74" r="4" fill="#d0453b"/>
<text x="431" y="77.5" font-size="9" fill="#20201a">Index futures &amp; options (open settlement)</text>
<circle cx="422" cy="89" r="4" fill="#8a4fd1"/>
<text x="431" y="92.5" font-size="9" fill="#20201a">Index rebalancing (often overlaps)</text>

<!-- baseline -->
<line x1="40" y1="270" x2="612" y2="270" stroke="#e1e0d9" stroke-width="1"/>
<text x="45" y="90" font-size="10.5" fill="#5a5950" font-weight="700">Volume</text>

<!-- 12 month bars -->
<g>
<rect x="50" y="252" width="26" height="18" fill="#9c9b8f" opacity="0.45"/>
<text x="63" y="284" font-size="9" fill="#5a5950" text-anchor="middle">Jan</text>

<rect x="95" y="248" width="26" height="22" fill="#9c9b8f" opacity="0.45"/>
<text x="108" y="284" font-size="9" fill="#5a5950" text-anchor="middle">Feb</text>

<rect x="140" y="128" width="26" height="142" fill="#d0453b" opacity="0.85"/>
<text x="153" y="116" font-size="9.5" fill="#b03a30" text-anchor="middle" font-weight="700">Witching</text>
<text x="153" y="284" font-size="9" fill="#20201a" font-weight="700" text-anchor="middle">Mar</text>

<rect x="185" y="250" width="26" height="20" fill="#9c9b8f" opacity="0.45"/>
<text x="198" y="284" font-size="9" fill="#5a5950" text-anchor="middle">Apr</text>

<rect x="230" y="254" width="26" height="16" fill="#9c9b8f" opacity="0.45"/>
<text x="243" y="284" font-size="9" fill="#5a5950" text-anchor="middle">May</text>

<rect x="275" y="130" width="26" height="140" fill="#d0453b" opacity="0.85"/>
<text x="288" y="118" font-size="9.5" fill="#b03a30" text-anchor="middle" font-weight="700">Witching</text>
<text x="288" y="284" font-size="9" fill="#20201a" font-weight="700" text-anchor="middle">Jun</text>

<rect x="320" y="251" width="26" height="19" fill="#9c9b8f" opacity="0.45"/>
<text x="333" y="284" font-size="9" fill="#5a5950" text-anchor="middle">Jul</text>

<rect x="365" y="249" width="26" height="21" fill="#9c9b8f" opacity="0.45"/>
<text x="378" y="284" font-size="9" fill="#5a5950" text-anchor="middle">Aug</text>

<rect x="410" y="126" width="26" height="144" fill="#d0453b" opacity="0.85"/>
<text x="423" y="114" font-size="9.5" fill="#b03a30" text-anchor="middle" font-weight="700">Witching</text>
<text x="423" y="284" font-size="9" fill="#20201a" font-weight="700" text-anchor="middle">Sep</text>

<rect x="455" y="253" width="26" height="17" fill="#9c9b8f" opacity="0.45"/>
<text x="468" y="284" font-size="9" fill="#5a5950" text-anchor="middle">Oct</text>

<rect x="500" y="255" width="26" height="15" fill="#9c9b8f" opacity="0.45"/>
<text x="513" y="284" font-size="9" fill="#5a5950" text-anchor="middle">Nov</text>

<rect x="545" y="124" width="26" height="146" fill="#d0453b" opacity="0.85"/>
<text x="558" y="112" font-size="9.5" fill="#b03a30" text-anchor="middle" font-weight="700">Witching</text>
<text x="558" y="284" font-size="9" fill="#20201a" font-weight="700" text-anchor="middle">Dec</text>
<text x="558" y="296" font-size="8" fill="#8a4fd1" text-anchor="middle">(next: Dec 18)</text>
</g>

<!-- divider -->
<line x1="40" y1="308" x2="612" y2="308" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="3,3"/>
<text x="320" y="324" font-size="11" fill="#20201a" text-anchor="middle" font-weight="700">Zooming into One Witching Friday: Two Separate Settlement Moments</text>

<!-- zoom timeline -->
<line x1="90" y1="350" x2="560" y2="350" stroke="#9c9b8f" stroke-width="1.6"/>
<circle cx="150" cy="350" r="6" fill="#d0453b"/>
<text x="150" y="340" font-size="9.5" fill="#b03a30" text-anchor="middle" font-weight="700">Open (SOQ)</text>
<text x="150" y="366" font-size="8.5" fill="#20201a" text-anchor="middle">Index futures &amp; options settle</text>

<circle cx="500" cy="350" r="6" fill="#1a5fb4"/>
<text x="500" y="340" font-size="9.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">Close (MOC)</text>
<text x="500" y="366" font-size="8.5" fill="#20201a" text-anchor="middle">Stock option assignment &amp; index rebalance</text>
</svg>
