<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="620" height="400" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="15" fill="#20201a" text-anchor="middle" font-weight="700">Candlestick vs. Three Line Break: No Box Size — Just the Low of the Last 3 Lines</text>

<text x="165" y="50" font-size="12.5" fill="#5a5950" text-anchor="middle" font-weight="700">Candlestick chart (one bar per time interval)</text>
<text x="460" y="50" font-size="12.5" fill="#5a5950" text-anchor="middle" font-weight="700">Three Line Break (line height varies, tracks reversals only)</text>

<line x1="310" y1="45" x2="310" y2="345" stroke="#c7c6bd" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="30" y1="345" x2="590" y2="345" stroke="#e1e0d9" stroke-width="1"/>

<!-- Left panel: noisy time-based price line with small chop -->
<polyline points="45,325 65,318 85,330 105,300 125,312 145,270 165,285 185,240 205,255 225,205 245,220 265,175 285,190 300,150"
  fill="none" stroke="#5a5950" stroke-width="2"/>
<circle cx="45" cy="325" r="3" fill="#5a5950"/>
<circle cx="65" cy="318" r="3" fill="#5a5950"/>
<circle cx="85" cy="330" r="3.5" fill="#d0453b"/>
<circle cx="105" cy="300" r="3" fill="#5a5950"/>
<circle cx="125" cy="312" r="3.5" fill="#d0453b"/>
<circle cx="145" cy="270" r="3" fill="#5a5950"/>
<circle cx="165" cy="285" r="3.5" fill="#d0453b"/>
<circle cx="185" cy="240" r="3" fill="#5a5950"/>
<circle cx="205" cy="255" r="3.5" fill="#d0453b"/>
<circle cx="225" cy="205" r="3" fill="#5a5950"/>
<circle cx="245" cy="220" r="3.5" fill="#d0453b"/>
<circle cx="265" cy="175" r="3" fill="#5a5950"/>
<circle cx="285" cy="190" r="3.5" fill="#d0453b"/>
<circle cx="300" cy="150" r="3" fill="#5a5950"/>
<text x="167" y="368" font-size="10.5" fill="#a8362d" text-anchor="middle">Every small wiggle still prints its own candle</text>

<!-- Right panel: Three Line Break — unequal-height up-lines, reversal threshold, failed pullback, reversal line -->
<rect x="345" y="295" width="26" height="30" fill="#e3f5e8" stroke="#1f9d55" stroke-width="2"/>
<text x="358" y="313" font-size="10" fill="#1f9d55" text-anchor="middle" font-weight="700">L1</text>
<rect x="373" y="255" width="26" height="40" fill="#e3f5e8" stroke="#1f9d55" stroke-width="2"/>
<text x="386" y="278" font-size="10" fill="#1f9d55" text-anchor="middle" font-weight="700">L2</text>
<rect x="401" y="215" width="26" height="40" fill="#e3f5e8" stroke="#1f9d55" stroke-width="2"/>
<text x="414" y="238" font-size="10" fill="#1f9d55" text-anchor="middle" font-weight="700">L3</text>

<!-- Reversal threshold: low of the oldest of the last 3 up-lines -->
<line x1="335" y1="325" x2="560" y2="325" stroke="#767568" stroke-width="1.3" stroke-dasharray="5,3"/>
<text x="337" y="337" font-size="9.5" fill="#767568" text-anchor="start">Reversal line = lowest low of the last 3 lines (L1–L3)</text>

<!-- Failed pullback: stays above the threshold, so no new line is drawn -->
<rect x="429" y="255" width="26" height="38" fill="#fbe1df" stroke="#d0453b" stroke-width="2" stroke-dasharray="4,3" opacity="0.6"/>
<text x="442" y="276" font-size="8.5" fill="#a8362d" text-anchor="middle">pullback</text>
<text x="442" y="286" font-size="8.5" fill="#a8362d" text-anchor="middle">falls short</text>

<!-- Reversal line: close breaks below the threshold -->
<rect x="457" y="215" width="26" height="135" fill="#fbe1df" stroke="#d0453b" stroke-width="2.5"/>
<text x="470" y="253" font-size="10" fill="#a8362d" text-anchor="middle" font-weight="700">Reversal</text>
<text x="470" y="266" font-size="8.5" fill="#a8362d" text-anchor="middle">line (L3 high</text>
<text x="470" y="277" font-size="8.5" fill="#a8362d" text-anchor="middle">to below threshold)</text>

<text x="460" y="368" font-size="10.5" fill="#1f9d55" text-anchor="middle" font-weight="700">Line height is never fixed — it's whatever the move actually covered</text>

<rect x="50" y="380" width="12" height="12" fill="#e3f5e8" stroke="#1f9d55" stroke-width="1.5"/>
<text x="66" y="390" font-size="11" fill="#20201a" text-anchor="start">Up-line (no fixed box size)</text>
<rect x="250" y="380" width="12" height="12" fill="#fbe1df" stroke="#d0453b" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="266" y="390" font-size="11" fill="#20201a" text-anchor="start">Below threshold (shaded, no line printed)</text>
<rect x="480" y="380" width="12" height="12" fill="#fbe1df" stroke="#d0453b" stroke-width="1.5"/>
<text x="496" y="390" font-size="11" fill="#20201a" text-anchor="start">Reversal line</text>
</svg>
