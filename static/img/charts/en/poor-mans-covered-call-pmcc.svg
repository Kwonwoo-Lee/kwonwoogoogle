<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="27" font-size="14.5" fill="#20201a" text-anchor="middle" font-weight="700">Covered Call vs. PMCC: Capital Required for the Same Short Call</text>

<line x1="320" y1="36" x2="320" y2="372" stroke="#e1e0d9" stroke-width="1"/>

<!-- LEFT: Traditional covered call -->
<text x="160" y="58" font-size="11.5" fill="#5a5950" text-anchor="middle" font-weight="700">Traditional Covered Call</text>

<!-- big capital block -->
<rect x="70" y="150" width="180" height="150" rx="8" fill="#1a5fb4" opacity="0.10" stroke="#1a5fb4" stroke-width="1.5"/>
<text x="160" y="185" font-size="12.5" fill="#20201a" text-anchor="middle" font-weight="700">100 Shares</text>
<text x="160" y="204" font-size="10" fill="#767568" text-anchor="middle">Stock at $100</text>
<text x="160" y="240" font-size="17" fill="#1a5fb4" text-anchor="middle" font-weight="700">$10,000</text>
<text x="160" y="258" font-size="9.5" fill="#767568" text-anchor="middle">capital tied up</text>
<text x="160" y="278" font-size="9.5" fill="#767568" text-anchor="middle">Delta ≈ 1.00</text>

<!-- small short call block on top -->
<rect x="95" y="95" width="130" height="42" rx="6" fill="#1f9d55" opacity="0.12" stroke="#1f9d55" stroke-width="1.5"/>
<text x="160" y="113" font-size="10" fill="#177a42" text-anchor="middle" font-weight="700">Sell Short Call</text>
<text x="160" y="128" font-size="8.5" fill="#20201a" text-anchor="middle">$105 strike · 35 DTE</text>

<line x1="160" y1="137" x2="160" y2="150" stroke="#767568" stroke-width="1.5"/>

<!-- RIGHT: PMCC -->
<text x="480" y="58" font-size="11.5" fill="#5a5950" text-anchor="middle" font-weight="700">PMCC (Long Call Diagonal)</text>

<!-- smaller capital block -->
<rect x="390" y="205" width="180" height="95" rx="8" fill="#1a5fb4" opacity="0.10" stroke="#1a5fb4" stroke-width="1.5"/>
<text x="480" y="232" font-size="12.5" fill="#20201a" text-anchor="middle" font-weight="700">LEAPS Call</text>
<text x="480" y="250" font-size="10" fill="#767568" text-anchor="middle">$70 strike · 12mo+ · Δ≈0.80</text>
<text x="480" y="277" font-size="17" fill="#1a5fb4" text-anchor="middle" font-weight="700">$3,400</text>
<text x="480" y="292" font-size="9.5" fill="#767568" text-anchor="middle">capital tied up</text>

<!-- small short call block on top -->
<rect x="415" y="95" width="130" height="42" rx="6" fill="#1f9d55" opacity="0.12" stroke="#1f9d55" stroke-width="1.5"/>
<text x="480" y="113" font-size="10" fill="#177a42" text-anchor="middle" font-weight="700">Sell Short Call</text>
<text x="480" y="128" font-size="8.5" fill="#20201a" text-anchor="middle">$105 strike · 35 DTE</text>

<line x1="480" y1="137" x2="480" y2="205" stroke="#767568" stroke-width="1.5"/>

<!-- savings callout -->
<path d="M 260,225 C 300,225 320,225 350,225" fill="none" stroke="#d0453b" stroke-width="1.5" stroke-dasharray="4,3"/>
<polygon points="350,225 341,220 341,230" fill="#d0453b"/>
<text x="305" y="215" font-size="10" fill="#d0453b" text-anchor="middle" font-weight="700">≈66% less capital</text>

<text x="160" y="330" font-size="9" fill="#767568" text-anchor="middle">Max loss: stock can fall to $0</text>
<text x="480" y="330" font-size="9" fill="#767568" text-anchor="middle">Max loss: capped at net debit paid ($3,150)</text>

<text x="320" y="360" font-size="9.5" fill="#767568" text-anchor="middle">Same short call sold on top of both positions — the LEAPS stands in for the 100 shares</text>
<text x="320" y="384" font-size="8.5" fill="#9a9989" text-anchor="middle">Illustrative example, not a live quote. LEAPS pays no dividends and has its own expiration.</text>
</svg>
