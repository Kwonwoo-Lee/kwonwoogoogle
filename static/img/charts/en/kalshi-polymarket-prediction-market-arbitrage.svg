<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="640" height="420" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="26" font-size="15" fill="#20201a" text-anchor="middle" font-weight="700">Two Ways to Trade Prediction Markets</text>

<!-- Divider -->
<line x1="320" y1="46" x2="320" y2="392" stroke="#e1e0d9" stroke-width="1.5"/>

<!-- LEFT PANEL: complete-set arbitrage -->
<text x="170" y="62" font-size="12.5" fill="#20201a" text-anchor="middle" font-weight="700">Complete-Set Arbitrage (same venue)</text>

<line x1="60" y1="330" x2="280" y2="330" stroke="#8a8a7c" stroke-width="1.2"/>

<rect x="80" y="245" width="50" height="85" fill="#1a5fb4" opacity="0.85"/>
<text x="105" y="235" font-size="11" fill="#1a5fb4" text-anchor="middle" font-weight="700">YES 42¢</text>

<rect x="140" y="223" width="50" height="107" fill="#c0392b" opacity="0.85"/>
<text x="165" y="213" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">NO 53¢</text>

<path d="M 80,205 L 80,195 L 190,195 L 190,205" fill="none" stroke="#5a5950" stroke-width="1.2"/>
<text x="135" y="188" font-size="11" fill="#5a5950" text-anchor="middle">Buy both: 95¢ total</text>

<path d="M 200,270 L 238,270" fill="none" stroke="#1f9d55" stroke-width="2.2" marker-end="url(#arrow-en)"/>
<defs>
  <marker id="arrow-en" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1f9d55"/>
  </marker>
</defs>

<rect x="245" y="90" width="50" height="240" fill="#1f9d55" opacity="0.85"/>
<text x="270" y="80" font-size="11" fill="#1f9d55" text-anchor="middle" font-weight="700">Settles $1.00</text>

<text x="170" y="348" font-size="10.5" fill="#5a5950" text-anchor="middle">Either outcome pays $1 guaranteed</text>
<text x="170" y="364" font-size="12" fill="#188a48" text-anchor="middle" font-weight="700">Profit = $1.00 − 95¢ = 5¢</text>

<!-- RIGHT PANEL: cross-market convergence -->
<text x="470" y="62" font-size="12.5" fill="#20201a" text-anchor="middle" font-weight="700">Cross-Market Convergence (Kalshi vs CME FedWatch)</text>

<line x1="360" y1="330" x2="600" y2="330" stroke="#8a8a7c" stroke-width="1.2"/>
<line x1="360" y1="330" x2="360" y2="90" stroke="#8a8a7c" stroke-width="1.2"/>
<text x="480" y="352" font-size="10.5" fill="#5a5950" text-anchor="middle">Time until decision →</text>
<text x="340" y="210" font-size="10.5" fill="#5a5950" text-anchor="middle" transform="rotate(-90 340 210)">Implied hold probability</text>

<path d="M 360,140 L 420,138 L 480,160 L 530,220 L 570,275 L 598,290" fill="none" stroke="#1a5fb4" stroke-width="2.5"/>
<text x="400" y="128" font-size="10.5" fill="#1a5fb4" font-weight="700">Kalshi (68¢)</text>

<path d="M 360,290 L 420,285 L 480,280 L 530,283 L 570,286 L 598,290" fill="none" stroke="#b8860b" stroke-width="2.5" stroke-dasharray="5,3"/>
<text x="400" y="303" font-size="10.5" fill="#8a6d1a" font-weight="700">CME FedWatch (48%)</text>

<circle cx="598" cy="290" r="4.5" fill="#1f9d55"/>
<text x="598" y="308" font-size="10.5" fill="#188a48" text-anchor="middle" font-weight="700">Decision day: &lt;1¢ gap</text>

<rect x="365" y="95" width="140" height="20" fill="#c0392b" opacity="0.08"/>
<text x="435" y="108" font-size="10" fill="#c0392b" text-anchor="middle">20-point divergence window</text>

<line x1="370" y1="380" x2="395" y2="380" stroke="#1a5fb4" stroke-width="2.5"/>
<text x="402" y="384" font-size="10.5" fill="#20201a">Prediction-market price</text>
<line x1="500" y1="380" x2="525" y2="380" stroke="#b8860b" stroke-width="2.5" stroke-dasharray="5,3"/>
<text x="532" y="384" font-size="10.5" fill="#20201a">Traditional-market implied odds</text>
</svg>
