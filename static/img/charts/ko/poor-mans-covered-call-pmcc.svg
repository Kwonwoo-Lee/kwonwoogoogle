<text x="480" y="292" font-size="9.5" fill="#767568" text-anchor="middle">필요 자본</text>

<!-- small short call block on top -->
<rect x="415" y="95" width="130" height="42" rx="6" fill="#1f9d55" opacity="0.12" stroke="#1f9d55" stroke-width="1.5"/>
<text x="480" y="113" font-size="10" fill="#177a42" text-anchor="middle" font-weight="700">단기 콜 매도</text>
<text x="480" y="128" font-size="8.5" fill="#20201a" text-anchor="middle">행사가 $105 · 만기 35일</text>

<line x1="480" y1="137" x2="480" y2="205" stroke="#767568" stroke-width="1.5"/>

<!-- savings callout -->
<path d="M 260,225 C 300,225 320,225 350,225" fill="none" stroke="#d0453b" stroke-width="1.5" stroke-dasharray="4,3"/>
<polygon points="350,225 341,220 341,230" fill="#d0453b"/>
<text x="305" y="215" font-size="10" fill="#d0453b" text-anchor="middle" font-weight="700">자본 약 66% 절감</text>

<text x="160" y="330" font-size="9" fill="#767568" text-anchor="middle">최대 손실: 주가가 0까지 하락 가능</text>
