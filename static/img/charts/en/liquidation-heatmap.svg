<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="620" height="340" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="24" font-size="14.5" fill="#20201a" text-anchor="middle" font-weight="700">Liquidation Heatmap: Dense Zones Act as a "Liquidity Magnet," Then Cascade</text>

<line x1="470" y1="34" x2="495" y2="34" stroke="#1a5fb4" stroke-width="2.5"/>
<text x="500" y="38" font-size="10" fill="#5a5950" text-anchor="start">Price</text>

<rect x="40" y="50" width="540" height="240" fill="none" stroke="#c7c6bb" stroke-width="1"/>

<rect x="40" y="62" width="540" height="20" fill="#d0453b" opacity="0.45"/>
<rect x="40" y="82" width="540" height="14" fill="#d0453b" opacity="0.2"/>
<text x="56" y="76" font-size="10.5" fill="#8a2a22" font-weight="700">Dense short-liquidation zone (clustered short leverage)</text>

<rect x="40" y="235" width="540" height="20" fill="#1a5fb4" opacity="0.4"/>
<rect x="40" y="255" width="540" height="14" fill="#1a5fb4" opacity="0.18"/>
<text x="56" y="249" font-size="10.5" fill="#1a3f8a" font-weight="700">Dense long-liquidation zone (clustered long leverage)</text>

<line x1="40" y1="168" x2="580" y2="168" stroke="#5a5950" stroke-width="1.3" stroke-dasharray="6,4"/>
<text x="56" y="163" font-size="10.5" fill="#5a5950" font-weight="700">Current price</text>

<path d="M 40,168 L 90,175 L 140,160 L 190,172 L 240,158 L 290,166 L 330,150"
      fill="none" stroke="#1a5fb4" stroke-width="2.6"/>

<path d="M 330,150 L 365,115 L 395,88 L 420,68"
      fill="none" stroke="#d0453b" stroke-width="3.2"/>
<text x="382" y="105" font-size="10" fill="#8a2a22" font-weight="700" text-anchor="middle" transform="rotate(-32 382 105)">Cascade acceleration</text>

<path d="M 420,68 L 450,95 L 490,150 L 540,175 L 575,180"
      fill="none" stroke="#1f9d55" stroke-width="2.6"/>
<circle cx="420" cy="68" r="4.5" fill="#d0453b"/>
<text x="440" y="55" font-size="10" fill="#177a42" font-weight="700" text-anchor="start">Cluster exhausted → reversal (wick)</text>

<path d="M 330,150 L 300,130" fill="none" stroke="#767568" stroke-width="1.3" stroke-dasharray="3,3"/>
<text x="255" y="123" font-size="10" fill="#767568" text-anchor="middle">Dense zone pulls price toward it</text>

<text x="310" y="312" font-size="10" fill="#5a5950" text-anchor="middle">When price reaches a liquidation-dense zone, forced closes add pressure that accelerates the move into a cascade; once the cluster is exhausted, price often reverses</text>
</svg>
