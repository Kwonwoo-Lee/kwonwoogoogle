<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="620" height="400" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="15" fill="#20201a" text-anchor="middle" font-weight="700">ADX·DMI: 횡보 구간 vs 추세 구간에서의 DI 크로스와 ADX</text>

<text x="44" y="50" font-size="12" fill="#767568" text-anchor="start" font-weight="700">가격</text>
<line x1="250" y1="40" x2="250" y2="200" stroke="#c7c6bd" stroke-width="1" stroke-dasharray="3,3"/>
<text x="130" y="212" font-size="11.5" fill="#9a998d" text-anchor="middle">횡보 구간</text>
<text x="415" y="212" font-size="11.5" fill="#9a998d" text-anchor="middle">추세 구간</text>
<path d="M 40,120 L 80,100 L 120,130 L 160,105 L 200,125 L 250,110 L 300,95 L 350,105 L 400,80 L 450,90 L 500,65 L 550,75 L 580,55" fill="none" stroke="#1a5fb4" stroke-width="3"/>

<line x1="30" y1="225" x2="590" y2="225" stroke="#e1e0d9" stroke-width="1"/>

<text x="44" y="245" font-size="12" fill="#767568" text-anchor="start" font-weight="700">ADX / +DI / -DI (0~100)</text>

<rect x="30" y="230" width="230" height="135" fill="#f3ebe9" opacity="0.6"/>
<rect x="260" y="230" width="330" height="135" fill="#e8f5ea" opacity="0.6"/>

<line x1="30" y1="295" x2="590" y2="295" stroke="#9a998d" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="596" y="299" font-size="10.5" fill="#767568" text-anchor="start">25</text>
<line x1="30" y1="360" x2="590" y2="360" stroke="#e1e0d9" stroke-width="1"/>
<text x="596" y="364" font-size="10" fill="#9a998d" text-anchor="start">0</text>

<text x="44" y="290" font-size="11" fill="#20201a" text-anchor="start" font-weight="700">ADX</text>
<path d="M 40,329 L 80,321 L 120,334 L 160,316 L 200,324 L 250,313 L 300,298 L 350,282 L 400,269 L 450,259 L 500,251 L 550,243 L 580,238" fill="none" stroke="#20201a" stroke-width="3"/>

<path d="M 40,313 L 80,298 L 120,318 L 160,303 L 200,316 L 250,308 L 300,292 L 350,282 L 400,272 L 450,264 L 500,256 L 550,251 L 580,246" fill="none" stroke="#1f9d55" stroke-width="2.2"/>
<path d="M 40,303 L 80,316 L 120,300 L 160,318 L 200,298 L 250,311 L 300,321 L 350,326 L 400,331 L 450,337 L 500,339 L 550,342 L 580,344" fill="none" stroke="#d0453b" stroke-width="2.2"/>

<circle cx="225" cy="309" r="5" fill="#20201a"/>
<line x1="225" y1="309" x2="150" y2="252" stroke="#20201a" stroke-width="1" stroke-dasharray="4,3"/>
<text x="150" y="248" font-size="11" fill="#20201a" text-anchor="middle" font-weight="700">+DI/-DI 크로스</text>

<circle cx="323" cy="288" r="5" fill="#1f9d55"/>
<line x1="323" y1="288" x2="400" y2="248" stroke="#1f9d55" stroke-width="1" stroke-dasharray="4,3"/>
<text x="430" y="245" font-size="11" fill="#1f9d55" text-anchor="middle" font-weight="700">ADX 25 상향 돌파</text>
<text x="430" y="260" font-size="10.5" fill="#1f9d55" text-anchor="middle">= 추세 강도 확인</text>

<rect x="44" y="378" width="12" height="12" fill="#20201a"/>
<text x="60" y="388" font-size="11" fill="#20201a" text-anchor="start">ADX (추세 강도)</text>
<rect x="200" y="378" width="12" height="12" fill="#1f9d55"/>
<text x="216" y="388" font-size="11" fill="#1f9d55" text-anchor="start">+DI (상승 방향성)</text>
<rect x="356" y="378" width="12" height="12" fill="#d0453b"/>
<text x="372" y="388" font-size="11" fill="#d0453b" text-anchor="start">-DI (하락 방향성)</text>
</svg>
