<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="640" height="380" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="24" font-size="13.5" fill="#20201a" text-anchor="middle" font-weight="700">종가 경매 임밸런스: 마감 10분 동안 불균형이 좁혀지는 과정</text>

<!-- legend box -->
<rect x="412" y="34" width="198" height="78" rx="6" fill="#f3f2ec" stroke="#e1e0d9"/>
<text x="422" y="48" font-size="9.5" fill="#5a5950" font-weight="700">범례</text>
<rect x="422" y="56" width="12" height="10" fill="#1a5fb4" opacity="0.85"/>
<text x="439" y="65" font-size="9" fill="#20201a">매수 우위 임밸런스 수량</text>
<circle cx="428" cy="79" r="4" fill="#d0453b"/>
<text x="439" y="82.5" font-size="9" fill="#20201a">프리즈 시작 / 갱신주기 전환</text>
<circle cx="428" cy="94" r="4" fill="#20201a"/>
<text x="439" y="97.5" font-size="9" fill="#20201a">종가 결정(Closing Print)</text>

<!-- baseline -->
<line x1="40" y1="300" x2="400" y2="300" stroke="#e1e0d9" stroke-width="1"/>
<text x="45" y="130" font-size="10.5" fill="#5a5950" font-weight="700">임밸런스 수량</text>

<!-- imbalance bars shrinking over time -->
<g>
<rect x="55" y="160" width="34" height="140" fill="#1a5fb4" opacity="0.85"/>
<text x="72" y="150" font-size="9.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">10만</text>
<text x="72" y="314" font-size="9" fill="#20201a" text-anchor="middle">15:50</text>

<rect x="110" y="178" width="34" height="122" fill="#1a5fb4" opacity="0.8"/>
<text x="127" y="168" font-size="9.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">8.6만</text>
<text x="127" y="314" font-size="9" fill="#20201a" text-anchor="middle">15:52</text>

<rect x="165" y="200" width="34" height="100" fill="#1a5fb4" opacity="0.75"/>
<text x="182" y="190" font-size="9.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">7만</text>
<text x="182" y="314" font-size="9" fill="#20201a" text-anchor="middle">15:54</text>

<rect x="220" y="228" width="34" height="72" fill="#1a5fb4" opacity="0.7"/>
<text x="237" y="218" font-size="9.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">5만</text>
<text x="237" y="314" font-size="9" fill="#20201a" text-anchor="middle">15:56</text>

<rect x="275" y="252" width="34" height="48" fill="#1a5fb4" opacity="0.65"/>
<text x="292" y="242" font-size="9.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">3.2만</text>
<text x="292" y="314" font-size="9" fill="#20201a" text-anchor="middle">15:58</text>

<rect x="330" y="282" width="34" height="18" fill="#1a5fb4" opacity="0.55"/>
<text x="347" y="272" font-size="9.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">1.1만</text>
<text x="347" y="314" font-size="9" fill="#20201a" text-anchor="middle">15:59:30</text>
</g>

<!-- offsetting order arrows -->
<path d="M72 150 L127 168" stroke="#d0453b" stroke-width="1.3" stroke-dasharray="3,2" fill="none" marker-end="url(#arrow)"/>
<path d="M127 168 L182 190" stroke="#d0453b" stroke-width="1.3" stroke-dasharray="3,2" fill="none" marker-end="url(#arrow)"/>
<path d="M182 190 L237 218" stroke="#d0453b" stroke-width="1.3" stroke-dasharray="3,2" fill="none" marker-end="url(#arrow)"/>
<path d="M237 218 L292 242" stroke="#d0453b" stroke-width="1.3" stroke-dasharray="3,2" fill="none" marker-end="url(#arrow)"/>
<path d="M292 242 L347 272" stroke="#d0453b" stroke-width="1.3" stroke-dasharray="3,2" fill="none" marker-end="url(#arrow)"/>
<text x="210" y="125" font-size="9" fill="#b03a30" text-anchor="middle">상쇄(매도) 주문 유입에 따라 임밸런스가 계속 축소</text>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M0 0 L10 5 L0 10 z" fill="#d0453b"/>
</marker>
</defs>

<!-- final print marker -->
<line x1="390" y1="300" x2="390" y2="140" stroke="#20201a" stroke-width="1.6"/>
<circle cx="390" cy="140" r="6" fill="#20201a"/>
<text x="390" y="128" font-size="9.5" fill="#20201a" text-anchor="middle" font-weight="700">16:00 종가 결정</text>

<!-- divider -->
<line x1="40" y1="330" x2="612" y2="330" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="3,3"/>
<text x="320" y="346" font-size="11" fill="#20201a" text-anchor="middle" font-weight="700">갱신 주기 전환: 10초 → 1초</text>

<!-- timeline zoom -->
<line x1="90" y1="365" x2="560" y2="365" stroke="#9c9b8f" stroke-width="1.6"/>
<circle cx="150" cy="365" r="6" fill="#d0453b"/>
<text x="150" y="358" font-size="9" fill="#b03a30" text-anchor="middle" font-weight="700">15:50</text>
<circle cx="380" cy="365" r="6" fill="#1a5fb4"/>
<text x="380" y="358" font-size="9" fill="#1a5fb4" text-anchor="middle" font-weight="700">15:55</text>
<circle cx="540" cy="365" r="6" fill="#20201a"/>
<text x="540" y="358" font-size="9" fill="#20201a" text-anchor="middle" font-weight="700">16:00</text>
</svg>
