<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="620" height="380" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="24" font-size="14.5" fill="#20201a" text-anchor="middle" font-weight="700">MVRV Z-Score and SOPR: Reading Bitcoin Cycle Extremes with On-Chain Data</text>

<text x="44" y="46" font-size="12" fill="#767568" text-anchor="start" font-weight="700">Bitcoin Price</text>
<rect x="40" y="52" width="540" height="140" fill="none" stroke="#c7c6bb" stroke-width="1"/>
<path d="M 60,168 L 150,150 L 250,128 L 340,92 L 400,58 L 460,92 L 520,140 L 580,166"
      fill="none" stroke="#1a5fb4" stroke-width="2.8"/>
<circle cx="60" cy="168" r="5" fill="#1f9d55"/>
<circle cx="400" cy="58" r="5" fill="#d0453b"/>
<circle cx="580" cy="166" r="5" fill="#1f9d55"/>
<text x="60" y="185" font-size="10" fill="#177a42" text-anchor="middle">Accumulation</text>
<text x="400" y="48" font-size="10" fill="#8a2a22" text-anchor="middle" font-weight="700">Cycle top</text>
<text x="580" y="185" font-size="10" fill="#177a42" text-anchor="middle">Panic selling (capitulation)</text>

<line x1="400" y1="58" x2="400" y2="235" stroke="#9a998d" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="580" y1="166" x2="580" y2="320" stroke="#9a998d" stroke-width="1" stroke-dasharray="3,3"/>

<text x="44" y="212" font-size="12" fill="#767568" text-anchor="start" font-weight="700">MVRV Z-Score (with SOPR reference)</text>
<rect x="40" y="218" width="540" height="120" fill="none" stroke="#c7c6bb" stroke-width="1"/>

<rect x="40" y="218" width="540" height="26" fill="#d0453b" opacity="0.4"/>
<text x="56" y="235" font-size="10" fill="#8a2a22" font-weight="700">Overheated zone (Z &gt; ~7, rule of thumb)</text>

<rect x="40" y="312" width="540" height="26" fill="#1f9d55" opacity="0.35"/>
<text x="56" y="329" font-size="10" fill="#177a42" font-weight="700">Undervalued zone (Z &lt; 0, rule of thumb)</text>

<line x1="40" y1="278" x2="580" y2="278" stroke="#c7c6bd" stroke-width="1" stroke-dasharray="4,3"/>
<text x="586" y="282" font-size="9.5" fill="#9a998d" text-anchor="start">Neutral</text>

<path d="M 60,320 L 150,296 L 250,268 L 340,235 L 400,222 L 460,258 L 520,300 L 580,318"
      fill="none" stroke="#a5670b" stroke-width="2.6"/>
<circle cx="60" cy="320" r="4.5" fill="#1f9d55"/>
<circle cx="400" cy="222" r="4.5" fill="#d0453b"/>
<circle cx="580" cy="318" r="4.5" fill="#1f9d55"/>

<text x="250" y="256" font-size="9.5" fill="#5a5950" text-anchor="middle">SOPR holds 1.0, bounces</text>
<text x="580" y="335" font-size="9.5" fill="#177a42" text-anchor="middle" font-weight="700">SOPR &lt; 1.0</text>

<text x="310" y="365" font-size="10.5" fill="#5a5950" text-anchor="middle">The MVRV Z-Score's swing from the undervalued zone to the overheated zone broadly tracks price cycle lows and highs, while SOPR oscillates around 1.0 within that cycle to show short-term profit-taking pressure</text>
</svg>
