<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="620" height="400" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="15" fill="#20201a" text-anchor="middle" font-weight="700">캔들차트 vs 삼선전환도: 박스 크기 없이 "최근 3개 선 저점"으로 반전을 잡는다</text>

<text x="165" y="50" font-size="12.5" fill="#5a5950" text-anchor="middle" font-weight="700">캔들차트 (시간마다 캔들 생성)</text>
<text x="460" y="50" font-size="12.5" fill="#5a5950" text-anchor="middle" font-weight="700">삼선전환도 (선 높이는 제각각, 반전만 추적)</text>

<line x1="310" y1="45" x2="310" y2="345" stroke="#c7c6bd" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="30" y1="345" x2="590" y2="345" stroke="#e1e0d9" stroke-width="1"/>

<!-- Left panel: noisy time-based price line with small chop -->
<polyline points="45,325 65,318 85,330 105,300 125,312 145,270 165,285 185,240 205,255 225,205 245,220 265,175 285,190 300,150"
  fill="none" stroke="#5a5950" stroke-width="2"/>
<circle cx="45" cy="325" r="3" fill="#5a5950"/>
<circle cx="65" cy="318" r="3" fill="#5a5950"/>
<circle cx="85" cy="330" r="3.5" fill="#d0453b"/>
<circle cx="105" cy="300" r="3" fill="#5a5950"/>
<circle cx="125" cy="312" r="3.5" fill="#d0453b"/>
<circle cx="145" cy="270" r="3" fill="#5a5950"/>
<circle cx="165" cy="285" r="3.5" fill="#d0453b"/>
<circle cx="185" cy="240" r="3" fill="#5a5950"/>
<circle cx="205" cy="255" r="3.5" fill="#d0453b"/>
<circle cx="225" cy="205" r="3" fill="#5a5950"/>
<circle cx="245" cy="220" r="3.5" fill="#d0453b"/>
<circle cx="265" cy="175" r="3" fill="#5a5950"/>
<circle cx="285" cy="190" r="3.5" fill="#d0453b"/>
<circle cx="300" cy="150" r="3" fill="#5a5950"/>
<text x="167" y="368" font-size="10.5" fill="#a8362d" text-anchor="middle">잔파동 하나하나가 전부 캔들로 남음</text>

<!-- Right panel: Three Line Break — unequal-height up-lines, reversal threshold, failed pullback, reversal line -->
<rect x="345" y="295" width="26" height="30" fill="#e3f5e8" stroke="#1f9d55" stroke-width="2"/>
<text x="358" y="313" font-size="10.5" fill="#1f9d55" text-anchor="middle" font-weight="700">선1</text>
<rect x="373" y="255" width="26" height="40" fill="#e3f5e8" stroke="#1f9d55" stroke-width="2"/>
<text x="386" y="278" font-size="10.5" fill="#1f9d55" text-anchor="middle" font-weight="700">선2</text>
<rect x="401" y="215" width="26" height="40" fill="#e3f5e8" stroke="#1f9d55" stroke-width="2"/>
<text x="414" y="238" font-size="10.5" fill="#1f9d55" text-anchor="middle" font-weight="700">선3</text>

<!-- Reversal threshold: low of the oldest of the last 3 up-lines -->
<line x1="335" y1="325" x2="560" y2="325" stroke="#767568" stroke-width="1.3" stroke-dasharray="5,3"/>
<text x="337" y="337" font-size="9.5" fill="#767568" text-anchor="start">반전 기준선 = 최근 3개 선(선1~선3) 중 최저가</text>

<!-- Failed pullback: stays above the threshold, so no new line is drawn -->
<rect x="429" y="255" width="26" height="38" fill="#fbe1df" stroke="#d0453b" stroke-width="2" stroke-dasharray="4,3" opacity="0.6"/>
<text x="442" y="279" font-size="9" fill="#a8362d" text-anchor="middle">반전 기준</text>
<text x="442" y="289" font-size="9" fill="#a8362d" text-anchor="middle">미달(선없음)</text>

<!-- Reversal line: close breaks below the threshold -->
<rect x="457" y="215" width="26" height="135" fill="#fbe1df" stroke="#d0453b" stroke-width="2.5"/>
<text x="470" y="255" font-size="10.5" fill="#a8362d" text-anchor="middle" font-weight="700">반전선</text>
<text x="470" y="269" font-size="9" fill="#a8362d" text-anchor="middle">(선3 고점→</text>
<text x="470" y="280" font-size="9" fill="#a8362d" text-anchor="middle">기준선 하회)</text>

<text x="460" y="368" font-size="10.5" fill="#1f9d55" text-anchor="middle" font-weight="700">선 높이는 고정값이 아니라 그때그때 가격 변동폭 그대로</text>

<rect x="60" y="380" width="12" height="12" fill="#e3f5e8" stroke="#1f9d55" stroke-width="1.5"/>
<text x="76" y="390" font-size="11" fill="#20201a" text-anchor="start">상승선 (고정 박스 크기 없음)</text>
<rect x="250" y="380" width="12" height="12" fill="#fbe1df" stroke="#d0453b" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="266" y="390" font-size="11" fill="#20201a" text-anchor="start">기준 미달 구간(음영, 실제 선 없음)</text>
<rect x="470" y="380" width="12" height="12" fill="#fbe1df" stroke="#d0453b" stroke-width="1.5"/>
<text x="486" y="390" font-size="11" fill="#20201a" text-anchor="start">반전선</text>
</svg>
