<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="22" font-size="13.5" fill="#20201a" text-anchor="middle" font-weight="700">Dividend Capture: Ex-Date Price Adjustment vs. the Dividend</text>

<!-- legend box -->
<rect x="414" y="30" width="196" height="82" rx="6" fill="#f3f2ec" stroke="#e1e0d9"/>
<text x="424" y="44" font-size="9.5" fill="#5a5950" font-weight="700">Legend</text>
<circle cx="428" cy="57" r="4" fill="#1a5fb4"/>
<text x="437" y="60.5" font-size="9" fill="#20201a">Buy date (day before ex-date)</text>
<circle cx="428" cy="72" r="4" fill="#d0453b"/>
<text x="437" y="75.5" font-size="9" fill="#20201a">Ex-dividend date (price adjusts)</text>
<rect x="424" y="81" width="8" height="8" fill="#2f8f5b" opacity="0.6"/>
<text x="437" y="88.5" font-size="9" fill="#20201a">Dividend received (+$500)</text>
<rect x="424" y="96" width="8" height="8" fill="#d0453b" opacity="0.6"/>
<text x="437" y="103.5" font-size="9" fill="#20201a">Ex-date price drop (−$500)</text>

<!-- price timeline -->
<line x1="40" y1="120" x2="400" y2="120" stroke="#9c9b8f" stroke-width="1.6"/>
<g font-size="9" fill="#5a5950" text-anchor="middle">
<line x1="80" y1="114" x2="80" y2="126" stroke="#9c9b8f"/>
<text x="80" y="140">D-1 (buy)</text>
<line x1="220" y1="114" x2="220" y2="126" stroke="#9c9b8f"/>
<text x="220" y="140">Ex-date</text>
<line x1="360" y1="114" x2="360" y2="126" stroke="#9c9b8f"/>
<text x="360" y="140">D+1 (sell)</text>
</g>

<!-- price line: flat at 50, step down at ex-div to 49.50, flat after -->
<polyline points="80,90 220,90 220,98 360,98" fill="none" stroke="#1a5fb4" stroke-width="2.4"/>
<circle cx="80" cy="90" r="5" fill="#1a5fb4"/>
<text x="80" y="76" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">$50.00</text>
<circle cx="220" cy="98" r="5" fill="#d0453b"/>
<text x="258" y="101" font-size="10" fill="#b03a30" font-weight="700">$49.50 (−$0.50)</text>
<circle cx="360" cy="98" r="5" fill="#5a5950"/>

<!-- offset bars: dividend vs price drop -->
<text x="320" y="172" font-size="11" fill="#20201a" text-anchor="middle" font-weight="700">On a $0.50/share dividend — the two sides are built to offset</text>
<g font-size="9.5" fill="#20201a">
<text x="46" y="196" font-weight="700">Dividend received</text>
<rect x="170" y="186" width="120" height="16" fill="#2f8f5b" opacity="0.75"/>
<text x="230" y="197" font-size="8.5" fill="#fff" text-anchor="middle">+$500 (pre-tax)</text>
<text x="46" y="222" font-weight="700">Ex-date price drop</text>
<rect x="170" y="212" width="120" height="16" fill="#d0453b" opacity="0.75"/>
<text x="230" y="223" font-size="8.5" fill="#fff" text-anchor="middle">−$500 (unrealized)</text>
</g>
<line x1="170" y1="234" x2="520" y2="234" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="2,3"/>
<text x="520" y="200" font-size="9" fill="#5a5950">Pre-tax wash = $0</text>
<text x="520" y="222" font-size="9" fill="#b03a30">+fees/tax = net loss</text>

<!-- divider -->
<line x1="40" y1="250" x2="612" y2="250" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="3,3"/>
<text x="320" y="268" font-size="11" fill="#20201a" text-anchor="middle" font-weight="700">Technique A vs. Technique B: who carries the price-drop risk</text>

<!-- Technique A: naked capture -->
<text x="46" y="296" font-size="9.5" fill="#5a5950" font-weight="700">Technique A</text>
<rect x="130" y="286" width="120" height="16" fill="#1a5fb4" opacity="0.8"/>
<text x="190" y="297" font-size="8.5" fill="#fff" text-anchor="middle">Buy stock</text>
<rect x="250" y="286" width="310" height="16" fill="#d0453b" opacity="0.35"/>
<text x="405" y="297" font-size="8.5" fill="#8a2a22" text-anchor="middle">Full price-drop risk exposed (unhedged)</text>

<!-- Technique B: hedged -->
<text x="46" y="326" font-size="9.5" fill="#5a5950" font-weight="700">Technique B</text>
<rect x="130" y="316" width="120" height="16" fill="#8a4fd1" opacity="0.8"/>
<text x="190" y="327" font-size="8.5" fill="#fff" text-anchor="middle">Stock + put</text>
<rect x="250" y="316" width="190" height="16" fill="#8a4fd1" opacity="0.3"/>
<text x="345" y="327" font-size="8.5" fill="#4a2e73" text-anchor="middle">Downside capped</text>
<rect x="440" y="316" width="120" height="16" fill="#e8a33d" opacity="0.5"/>
<text x="500" y="327" font-size="8.5" fill="#7a5018" text-anchor="middle">Option cost</text>

<line x1="40" y1="350" x2="612" y2="350" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="3,3"/>
<text x="320" y="368" font-size="9.5" fill="#5a5950" text-anchor="middle">The drop rarely matches the dividend exactly — fees and taxes eat the thin margin that's left</text>
</svg>
