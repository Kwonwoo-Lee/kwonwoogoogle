<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="640" height="440" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="26" font-size="15" fill="#20201a" text-anchor="middle" font-weight="700">워크포워드 분석: 인샘플·아웃오브샘플 창을 밀어가며 반복 검증</text>

<!-- fold rows: in-sample (blue) then out-of-sample (orange), shifting right each fold -->
<rect x="60" y="76" width="240" height="26" rx="4" fill="#1a5fb4"/>
<rect x="300" y="76" width="60" height="26" rx="4" fill="#d98324"/>
<text x="55" y="94" font-size="11" fill="#5a5950" text-anchor="end">폴드1</text>

<rect x="120" y="128" width="240" height="26" rx="4" fill="#1a5fb4"/>
<rect x="360" y="128" width="60" height="26" rx="4" fill="#d98324"/>
<text x="115" y="146" font-size="11" fill="#5a5950" text-anchor="end">폴드2</text>

<rect x="180" y="180" width="240" height="26" rx="4" fill="#1a5fb4"/>
<rect x="420" y="180" width="60" height="26" rx="4" fill="#d98324"/>
<text x="175" y="198" font-size="11" fill="#5a5950" text-anchor="end">폴드3</text>

<rect x="240" y="232" width="240" height="26" rx="4" fill="#1a5fb4"/>
<rect x="480" y="232" width="60" height="26" rx="4" fill="#d98324"/>
<text x="235" y="250" font-size="11" fill="#5a5950" text-anchor="end">폴드4</text>

<text x="560" y="250" font-size="16" fill="#9c9b8f" text-anchor="middle" font-weight="700">⋯</text>
<text x="600" y="276" font-size="9.5" fill="#767568" text-anchor="end">전체 10년 동안</text>
<text x="600" y="288" font-size="9.5" fill="#767568" text-anchor="end">약 14~16개 폴드까지 반복</text>

<!-- roll-forward arrow -->
<path d="M 95,110 C 95,120 115,120 115,128" fill="none" stroke="#9c9b8f" stroke-width="1.6" marker-end="url(#arrow)"/>
<defs>
  <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 Z" fill="#9c9b8f"/>
  </marker>
</defs>
<text x="330" y="300" font-size="10" fill="#767568" text-anchor="middle">창을 6개월씩(= 아웃오브샘플 길이) 밀면서 같은 과정을 반복</text>

<!-- time axis -->
<line x1="60" y1="330" x2="600" y2="330" stroke="#8a8a7c" stroke-width="1.3"/>
<line x1="60" y1="330" x2="60" y2="322" stroke="#8a8a7c" stroke-width="1.3"/>
<line x1="168" y1="330" x2="168" y2="322" stroke="#8a8a7c" stroke-width="1.3"/>
<line x1="276" y1="330" x2="276" y2="322" stroke="#8a8a7c" stroke-width="1.3"/>
<line x1="384" y1="330" x2="384" y2="322" stroke="#8a8a7c" stroke-width="1.3"/>
<line x1="492" y1="330" x2="492" y2="322" stroke="#8a8a7c" stroke-width="1.3"/>
<line x1="600" y1="330" x2="600" y2="322" stroke="#8a8a7c" stroke-width="1.3"/>
<text x="60" y="345" font-size="10" fill="#767568" text-anchor="middle">0년</text>
<text x="168" y="345" font-size="10" fill="#767568" text-anchor="middle">2년</text>
<text x="276" y="345" font-size="10" fill="#767568" text-anchor="middle">4년</text>
<text x="384" y="345" font-size="10" fill="#767568" text-anchor="middle">6년</text>
<text x="492" y="345" font-size="10" fill="#767568" text-anchor="middle">8년</text>
<text x="600" y="345" font-size="10" fill="#767568" text-anchor="middle">10년</text>
<text x="330" y="365" font-size="11" fill="#5a5950" text-anchor="middle">전체 데이터 기간(시간 축)</text>

<!-- legend -->
<rect x="90" y="390" width="18" height="14" rx="3" fill="#1a5fb4"/>
<text x="114" y="401" font-size="11" fill="#20201a">인샘플(훈련 구간, 파라미터 최적화)</text>
<rect x="90" y="414" width="18" height="14" rx="3" fill="#d98324"/>
<text x="114" y="425" font-size="11" fill="#20201a">아웃오브샘플(검증 구간, 미리보지 않은 데이터)</text>
</svg>
