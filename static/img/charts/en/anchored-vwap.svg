<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="620" height="340" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="14.5" fill="#20201a" text-anchor="middle" font-weight="700">Anchored VWAP: Support From a Swing Low &amp; Multi-Anchor Confluence</text>

<line x1="30" y1="180" x2="290" y2="180" stroke="#e1e0d9" stroke-width="1"/>
