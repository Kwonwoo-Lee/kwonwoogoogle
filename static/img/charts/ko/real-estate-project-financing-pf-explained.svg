<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="620" height="460" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="13.5" fill="#20201a" text-anchor="middle" font-weight="700">부동산 PF의 3단계 자금조달과 부실 전이 경로</text>

<rect x="30" y="50" width="160" height="62" rx="6" fill="#eef1f7" stroke="#1a5fb4" stroke-width="1.3"/>
<text x="110" y="74" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">① 브릿지론</text>
<text x="110" y="90" font-size="9" fill="#1a5fb4" text-anchor="middle">토지 매입·인허가 전</text>
<text x="110" y="102" font-size="9" fill="#1a5fb4" text-anchor="middle">(고금리 단기대출)</text>

<rect x="230" y="50" width="160" height="62" rx="6" fill="#eef1f7" stroke="#1a5fb4" stroke-width="1.3"/>
<text x="310" y="74" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">② 본PF</text>
<text x="310" y="90" font-size="9" fill="#1a5fb4" text-anchor="middle">시공사 책임준공 + 공사비</text>
<text x="310" y="102" font-size="9" fill="#1a5fb4" text-anchor="middle">(선분양·중도금 병행)</text>

<rect x="430" y="50" width="160" height="62" rx="6" fill="#eafaf0" stroke="#1f9d55" stroke-width="1.3"/>
<text x="510" y="74" font-size="10" fill="#177a42" text-anchor="middle" font-weight="700">③ 준공·상환</text>
<text x="510" y="90" font-size="9" fill="#177a42" text-anchor="middle">분양대금으로</text>
<text x="510" y="102" font-size="9" fill="#177a42" text-anchor="middle">본PF 최종 상환</text>

<path d="M 190,81 L 230,81" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow3)"/>
<path d="M 390,81 L 430,81" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow3)"/>

<line x1="20" y1="140" x2="600" y2="140" stroke="#e1e0d9" stroke-width="1"/>
<text x="40" y="162" font-size="12" fill="#a5342c" font-weight="700">분양 부진 또는 금리 급등 → 사슬이 끊어지면 벌어지는 일</text>

<rect x="30" y="178" width="170" height="54" rx="6" fill="#fdecea" stroke="#d0453b" stroke-width="1.3"/>
<text x="115" y="200" font-size="9.5" fill="#a5342c" text-anchor="middle" font-weight="700">브릿지론 부도</text>
<text x="115" y="214" font-size="9.5" fill="#a5342c" text-anchor="middle" font-weight="700">(본PF 전환 실패)</text>

<rect x="230" y="178" width="170" height="54" rx="6" fill="#fdecea" stroke="#d0453b" stroke-width="1.3"/>
<text x="315" y="200" font-size="9.5" fill="#a5342c" text-anchor="middle" font-weight="700">시공사 책임준공</text>
<text x="315" y="214" font-size="9.5" fill="#a5342c" text-anchor="middle" font-weight="700">우발부채 → 실제 부채</text>

<rect x="430" y="178" width="160" height="54" rx="6" fill="#fdecea" stroke="#d0453b" stroke-width="1.3"/>
<text x="510" y="200" font-size="9.5" fill="#a5342c" text-anchor="middle" font-weight="700">대주단 손실</text>
<text x="510" y="214" font-size="9.5" fill="#a5342c" text-anchor="middle" font-weight="700">(저축은행·증권사 등)</text>

<path d="M 115,178 L 115,160" fill="none" stroke="#c0453b" stroke-width="1.4" marker-end="url(#arrow4)"/>
<path d="M 200,205 L 230,205" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow3)"/>
<path d="M 400,205 L 430,205" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow3)"/>

<rect x="130" y="262" width="360" height="54" rx="6" fill="#f4f0e8" stroke="#9a998d" stroke-width="1.3"/>
<text x="310" y="284" font-size="9.8" fill="#5a5950" text-anchor="middle" font-weight="700">건설·금융업종 전반으로 신뢰 전이</text>
<text x="310" y="298" font-size="9.8" fill="#5a5950" text-anchor="middle" font-weight="700">(2011 저축은행 사태 · 2022 레고랜드 · 2024 태영건설)</text>

<path d="M 315,232 L 315,262" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow3)"/>
<path d="M 510,232 L 400,262" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow3)"/>

<rect x="40" y="340" width="540" height="42" rx="6" fill="#fbeee9" stroke="#d0453b" stroke-width="1"/>
<text x="310" y="358" font-size="10" fill="#a5342c" text-anchor="middle" font-weight="700">⚠ 시행사 자기자본이 얇을수록(통상 사업비의 5% 안팎) 작은 충격에도</text>
<text x="310" y="372" font-size="10" fill="#a5342c" text-anchor="middle" font-weight="700">사슬 전체가 끊어지기 쉽습니다</text>

<text x="310" y="408" font-size="9.5" fill="#9b9a8f" text-anchor="middle" font-style="italic">* 구조를 보여주기 위한 설명용 예시이며 특정 사업장의 실제 수치가 아닙니다</text>

<defs>
  <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#9a998d"/>
  </marker>
  <marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#c0453b"/>
  </marker>
</defs>
</svg>
