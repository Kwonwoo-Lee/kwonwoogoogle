<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="-apple-system, 'Segoe UI', sans-serif">
<rect x="0" y="0" width="600" height="280" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="300" y="28" font-size="15" fill="#20201a" text-anchor="middle" font-weight="700">Bollinger Bands: touching the bands signals overbought/oversold</text>
<path d="M 40,90 L 110,85 L 180,95 L 250,80 L 320,70 L 390,90 L 460,100 L 540,95" fill="none" stroke="#767568" stroke-width="2" stroke-dasharray="6,4"/>
<path d="M 40,150 L 110,150 L 180,152 L 250,150 L 320,148 L 390,150 L 460,152 L 540,150" fill="none" stroke="#767568" stroke-width="1.5"/>
<path d="M 40,210 L 110,215 L 180,208 L 250,220 L 320,225 L 390,210 L 460,200 L 540,205" fill="none" stroke="#767568" stroke-width="2" stroke-dasharray="6,4"/>
<path d="M 40,145 L 80,120 L 110,88 L 150,105 L 180,98 L 215,145 L 250,205 L 285,222 L 320,228 L 355,200 L 390,155 L 425,105 L 460,102 L 500,130 L 540,150" fill="none" stroke="#1a5fb4" stroke-width="3"/>
<circle cx="320" cy="228" r="7" fill="#d0453b"/>
<text x="320" y="255" font-size="13" fill="#d0453b" text-anchor="middle" font-weight="700">Oversold (lower band)</text>
<circle cx="320" cy="70" r="7" fill="#1f9d55"/>
<text x="320" y="60" font-size="13" fill="#1f9d55" text-anchor="middle" font-weight="700">Overbought (upper band)</text>
</svg>
