<text x="320" y="360" font-size="9.5" fill="#767568" text-anchor="middle">두 구조 모두 위에는 같은 단기 콜을 매도 — LEAPS가 주식 100주 자리를 대신한다</text>
<text x="320" y="384" font-size="8.5" fill="#9a9989" text-anchor="middle">예시를 위한 가상의 수치이며 실시간 시세가 아닙니다. LEAPS는 배당을 받지 못하며 자체 만기가 있습니다.</text>
