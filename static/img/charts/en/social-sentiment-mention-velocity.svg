<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="620" height="350" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="14.5" fill="#20201a" text-anchor="middle" font-weight="700">Mention Velocity Spike vs. the Lagging Price</text>

<rect x="192" y="40" width="152" height="205" fill="#1f9d55" opacity="0.08" stroke="#1f9d55" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="268" y="255" font-size="10" fill="#1f9d55" text-anchor="middle" font-weight="700">Momentum-entry candidate</text>

<rect x="374" y="40" width="152" height="205" fill="#d0453b" opacity="0.08" stroke="#d0453b" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="450" y="255" font-size="10" fill="#d0453b" text-anchor="middle" font-weight="700">Fade candidate</text>

<!-- baseline dashed line -->
<line x1="70" y1="231" x2="580" y2="231" stroke="#5a5850" stroke-width="1.3" stroke-dasharray="4,4"/>
<text x="585" y="235" font-size="9.5" fill="#5a5850" text-anchor="start">20d avg</text>

<!-- bars: mentions per 15min -->
<rect x="76"  y="223" width="38" height="8"   fill="#1a5fb4"/>
<rect x="138" y="217" width="38" height="14"  fill="#1a5fb4"/>
<rect x="200" y="207" width="38" height="24"  fill="#1a5fb4"/>
<rect x="262" y="163" width="38" height="68"  fill="#1a5fb4"/>
<rect x="324" y="81"  width="38" height="150" fill="#1a5fb4"/>
<rect x="386" y="104" width="38" height="127" fill="#1a5fb4"/>
<rect x="448" y="152" width="38" height="79"  fill="#1a5fb4"/>
<rect x="510" y="175" width="38" height="56"  fill="#1a5fb4"/>

<text x="95"  y="246" font-size="9.5" fill="#5a5850" text-anchor="middle">09:30</text>
<text x="157" y="246" font-size="9.5" fill="#5a5850" text-anchor="middle">09:45</text>
<text x="219" y="246" font-size="9.5" fill="#5a5850" text-anchor="middle">10:00</text>
<text x="281" y="246" font-size="9.5" fill="#5a5850" text-anchor="middle">10:15</text>
<text x="343" y="246" font-size="9.5" fill="#5a5850" text-anchor="middle">10:30</text>
<text x="405" y="246" font-size="9.5" fill="#5a5850" text-anchor="middle">10:45</text>
<text x="467" y="246" font-size="9.5" fill="#5a5850" text-anchor="middle">11:00</text>
<text x="529" y="246" font-size="9.5" fill="#5a5850" text-anchor="middle">11:15</text>

<text x="95"  y="218" font-size="8.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">22</text>
<text x="343" y="76"  font-size="8.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">400</text>

<!-- price line, independent scale, lagging -->
<polyline points="95,205 157,200 219,190 281,163 343,128 405,102 467,96 529,105" fill="none" stroke="#e08a5c" stroke-width="2.5"/>
<circle cx="95" cy="205" r="3.5" fill="#e08a5c"/>
<circle cx="157" cy="200" r="3.5" fill="#e08a5c"/>
<circle cx="219" cy="190" r="3.5" fill="#e08a5c"/>
<circle cx="281" cy="163" r="3.5" fill="#e08a5c"/>
<circle cx="343" cy="128" r="3.5" fill="#e08a5c"/>
<circle cx="405" cy="102" r="3.5" fill="#e08a5c"/>
<circle cx="467" cy="96" r="3.5" fill="#e08a5c"/>
<circle cx="529" cy="105" r="3.5" fill="#e08a5c"/>

<line x1="45" y1="300" x2="70" y2="300" stroke="#1a5fb4" stroke-width="6"/>
<text x="78" y="305" font-size="10.5" fill="#20201a" text-anchor="start">Mentions per 15 min (bars, left axis)</text>
<line x1="320" y1="300" x2="345" y2="300" stroke="#e08a5c" stroke-width="2.5"/>
<text x="353" y="305" font-size="10.5" fill="#20201a" text-anchor="start">Price (line, relative change)</text>

<text x="310" y="330" font-size="10" fill="#5a5850" text-anchor="middle">Price often keeps rising or stalls even after mention velocity itself has rolled over</text>
</svg>
