<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="640" height="430" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="24" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">틱지수 극단값 페이드: 가격 급등과 틱지수 +1000 극단값의 동시 반전</text>

<!-- upper panel: ES futures price -->
<rect x="40" y="40" width="560" height="155" fill="none" stroke="#e1e0d9"/>
<text x="50" y="55" font-size="10.5" fill="#5a5950">ES 선물 가격</text>

<path d="M 60,170 L 140,150 L 220,120 L 300,90 L 380,100 L 460,130 L 560,150" fill="none" stroke="#1a5fb4" stroke-width="2.8" stroke-linecap="round"/>
<circle cx="300" cy="90" r="5" fill="#1a5fb4"/>
<text x="300" y="78" font-size="10" fill="#1a5fb4" font-weight="700" text-anchor="middle">급등 고점 / 저항대 근접</text>
<circle cx="560" cy="150" r="4" fill="#1a5fb4"/>
<text x="560" y="165" font-size="9.5" fill="#1a5fb4" text-anchor="end">되돌림 시작</text>

<!-- lower panel: TICK index -->
<rect x="40" y="215" width="560" height="180" fill="none" stroke="#e1e0d9"/>
<text x="50" y="230" font-size="10.5" fill="#5a5950">NYSE 틱지수($TICK)</text>
<line x1="40" y1="305" x2="600" y2="305" stroke="#767568" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="605" y="309" font-size="9.5" fill="#767568">0선</text>
<line x1="40" y1="255" x2="600" y2="255" stroke="#c98a1f" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="605" y="259" font-size="9.5" fill="#c98a1f">+1000 극단값</text>

<path d="M 60,290 L 140,270 L 220,245 L 300,255 L 380,290 L 460,330 L 560,340" fill="none" stroke="#8a4fd1" stroke-width="2.8" stroke-linecap="round"/>
<circle cx="300" cy="255" r="5" fill="#8a4fd1"/>
<text x="300" y="243" font-size="9.5" fill="#8a4fd1" font-weight="700" text-anchor="middle">틱지수 +1050 극단값</text>
<circle cx="460" cy="330" r="4" fill="#8a4fd1"/>

<path d="M 300,90 L 300,255" stroke="#c98a1f" stroke-width="1.4" stroke-dasharray="4,3"/>
<path d="M 300,340 L 460,340" stroke="#8a4fd1" stroke-width="0" />
<text x="380" y="370" font-size="10" fill="#c98a1f" font-weight="700" text-anchor="middle">극단값 이후 0선 방향으로 빠르게 축소 = 페이드 신호</text>

<text x="320" y="415" font-size="10" fill="#5a5950" text-anchor="middle">가격이 저항대 근처에서 고점을 찍는 순간 틱지수도 +1000을 넘는 극단값을 찍고, 이후 두 지표 모두 함께 되돌아오는 전형적인 틱지수 페이드 패턴</text>
</svg>
