<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="620" height="400" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="24" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">수익률 곡선 스티프닝 vs 플래트닝</text>

<rect x="40" y="52" width="540" height="248" fill="none" stroke="#c7c6bb" stroke-width="1"/>
<text x="44" y="46" font-size="12" fill="#767568" text-anchor="start" font-weight="700">만기별 국채 수익률(%)</text>

<line x1="100" y1="52" x2="100" y2="300" stroke="#e5e4da" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="360" y1="52" x2="360" y2="300" stroke="#e5e4da" stroke-width="1" stroke-dasharray="3,3"/>
<text x="100" y="314" font-size="10" fill="#5a5950" text-anchor="middle">2Y</text>
<text x="220" y="314" font-size="10" fill="#5a5950" text-anchor="middle">5Y</text>
<text x="360" y="314" font-size="10" fill="#5a5950" text-anchor="middle">10Y</text>
<text x="520" y="314" font-size="10" fill="#5a5950" text-anchor="middle">30Y</text>

<path d="M 100,237 L 220,211 L 360,184 L 520,149" fill="none" stroke="#9a998d" stroke-width="2" stroke-dasharray="5,4"/>
<path d="M 100,255 L 220,211 L 360,158 L 520,114" fill="none" stroke="#1a5fb4" stroke-width="2.8"/>
<path d="M 100,193 L 220,193 L 360,184 L 520,176" fill="none" stroke="#d0453b" stroke-width="2.8"/>

<circle cx="100" cy="237" r="3" fill="#9a998d"/>
<circle cx="220" cy="211" r="3" fill="#9a998d"/>
<circle cx="360" cy="184" r="3" fill="#9a998d"/>
<circle cx="520" cy="149" r="3" fill="#9a998d"/>
<circle cx="100" cy="255" r="3.2" fill="#1a5fb4"/>
<circle cx="520" cy="114" r="3.2" fill="#1a5fb4"/>
<circle cx="100" cy="193" r="3.2" fill="#d0453b"/>
<circle cx="520" cy="176" r="3.2" fill="#d0453b"/>

<rect x="400" y="60" width="12" height="3" fill="#9a998d"/>
<text x="416" y="65" font-size="10" fill="#5a5950" text-anchor="start">기준 곡선</text>
<rect x="400" y="76" width="12" height="3" fill="#1a5fb4"/>
<text x="416" y="81" font-size="10" fill="#1a5fb4" text-anchor="start" font-weight="700">스티프닝(장기물↑)</text>
<rect x="400" y="92" width="12" height="3" fill="#d0453b"/>
<text x="416" y="97" font-size="10" fill="#d0453b" text-anchor="start" font-weight="700">플래트닝(단기물↑)</text>

<text x="530" y="108" font-size="9.5" fill="#1a5fb4" text-anchor="start" font-weight="700">스프레드 확대</text>
<text x="528" y="186" font-size="9.5" fill="#d0453b" text-anchor="start" font-weight="700">스프레드 축소</text>

<text x="44" y="334" font-size="12" fill="#767568" text-anchor="start" font-weight="700">2s10s 스프레드 폭 비교(bp)</text>
<line x1="140" y1="392" x2="140" y2="340" stroke="#e5e4da" stroke-width="1"/>

<text x="80" y="353" font-size="10" fill="#5a5950" text-anchor="end">기준(60bp)</text>
<rect x="140" y="345" width="60" height="14" fill="#9a998d"/>

<text x="80" y="373" font-size="10" fill="#1a5fb4" text-anchor="end" font-weight="700">스티프닝(110bp)</text>
<rect x="140" y="365" width="110" height="14" fill="#1a5fb4"/>

<text x="80" y="393" font-size="10" fill="#d0453b" text-anchor="end" font-weight="700">플래트닝(10bp)</text>
<rect x="140" y="385" width="10" height="14" fill="#d0453b"/>

<text x="310" y="397" font-size="9.5" fill="#9a998d" text-anchor="middle">※ 설명용 가상 수치</text>
</svg>
