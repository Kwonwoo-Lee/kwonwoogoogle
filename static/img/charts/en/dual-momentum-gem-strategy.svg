<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="-apple-system, 'Segoe UI', sans-serif">
<rect x="0" y="0" width="640" height="420" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="24" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">Dual Momentum (GEM): the Two-Step Monthly Allocation Decision</text>

<defs>
  <marker id="dmArrowEn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#767568"/>
  </marker>
  <marker id="dmArrowGreenEn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#1f9d55"/>
  </marker>
  <marker id="dmArrowRedEn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#d0453b"/>
  </marker>
</defs>

<!-- input boxes: SPY / EFA 12-month returns -->
<rect x="55" y="46" width="230" height="58" rx="8" fill="#1a5fb4" opacity="0.09" stroke="#1a5fb4" stroke-width="1.2"/>
<text x="170" y="68" font-size="12.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">US Stocks (SPY)</text>
<text x="170" y="86" font-size="11" fill="#5a5950" text-anchor="middle">Trailing 12-month return</text>

<rect x="355" y="46" width="230" height="58" rx="8" fill="#1a5fb4" opacity="0.09" stroke="#1a5fb4" stroke-width="1.2"/>
<text x="470" y="68" font-size="12.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">Int'l Developed Stocks (EFA)</text>
<text x="470" y="86" font-size="11" fill="#5a5950" text-anchor="middle">Trailing 12-month return</text>

<path d="M 170,104 L 170,122 L 320,138" fill="none" stroke="#767568" stroke-width="1.4"/>
<path d="M 470,104 L 470,122 L 320,138" fill="none" stroke="#767568" stroke-width="1.4" marker-end="url(#dmArrowEn)"/>

<!-- step 1: relative momentum -->
<rect x="160" y="140" width="320" height="56" rx="8" fill="#8a4fd1" opacity="0.1" stroke="#8a4fd1" stroke-width="1.4"/>
<text x="320" y="162" font-size="12.5" fill="#8a4fd1" text-anchor="middle" font-weight="700">Step 1 · Relative Momentum</text>
<text x="320" y="180" font-size="11" fill="#5a5950" text-anchor="middle">Pick whichever return is higher</text>

<path d="M 320,196 L 320,220" fill="none" stroke="#767568" stroke-width="1.4" marker-end="url(#dmArrowEn)"/>

<!-- step 2: absolute momentum -->
<rect x="130" y="222" width="380" height="58" rx="8" fill="#c98a1f" opacity="0.1" stroke="#c98a1f" stroke-width="1.4"/>
<text x="320" y="245" font-size="12.5" fill="#c98a1f" text-anchor="middle" font-weight="700">Step 2 · Absolute Momentum</text>
<text x="320" y="263" font-size="11" fill="#5a5950" text-anchor="middle">Winner's return vs. US T-bills (BIL)</text>

<!-- branches -->
<path d="M 220,280 L 150,310" fill="none" stroke="#1f9d55" stroke-width="1.6" marker-end="url(#dmArrowGreenEn)"/>
<text x="150" y="300" font-size="11" fill="#1f9d55" text-anchor="middle" font-weight="700">Pass</text>

<path d="M 420,280 L 490,310" fill="none" stroke="#d0453b" stroke-width="1.6" marker-end="url(#dmArrowRedEn)"/>
<text x="492" y="300" font-size="11" fill="#d0453b" text-anchor="middle" font-weight="700">Fail</text>

<rect x="35" y="320" width="230" height="70" rx="8" fill="#1f9d55" opacity="0.09" stroke="#1f9d55" stroke-width="1.4"/>
<text x="150" y="345" font-size="12.5" fill="#1f9d55" text-anchor="middle" font-weight="700">Hold the Winning Market</text>
<text x="150" y="363" font-size="10.5" fill="#5a5950" text-anchor="middle">Keep full weight in the</text>
<text x="150" y="378" font-size="10.5" fill="#5a5950" text-anchor="middle">asset chosen in Step 1</text>

<rect x="375" y="320" width="230" height="70" rx="8" fill="#d0453b" opacity="0.09" stroke="#d0453b" stroke-width="1.4"/>
<text x="490" y="345" font-size="12.5" fill="#d0453b" text-anchor="middle" font-weight="700">Switch to Bonds (AGG)</text>
<text x="490" y="363" font-size="10.5" fill="#5a5950" text-anchor="middle">Exit stocks entirely and</text>
<text x="490" y="378" font-size="10.5" fill="#5a5950" text-anchor="middle">move into cash-like assets</text>

<text x="320" y="412" font-size="10" fill="#767568" text-anchor="middle">This process repeats once, at the end of each month</text>
</svg>
