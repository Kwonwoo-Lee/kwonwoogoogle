<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="700" height="380" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="350" y="26" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">지속형 패턴: 상승삼각형 vs 깃발형(플래그) 돌파와 목표가</text>

<line x1="350" y1="42" x2="350" y2="345" stroke="#e1e0d9" stroke-width="1.3" stroke-dasharray="4,4"/>

<text x="175" y="50" font-size="12" fill="#1a5fb4" text-anchor="middle" font-weight="700">상승삼각형</text>

<line x1="55" y1="110" x2="300" y2="110" stroke="#767568" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="60" y="102" font-size="10" fill="#5a5950" font-weight="700">수평 저항선</text>

<line x1="55" y1="250" x2="270" y2="150" stroke="#c98a1f" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="90" y="228" font-size="10" fill="#a06a10" font-weight="700">우상향 지지선(higher lows)</text>

<path d="M 55,250 L 100,110 L 140,180 L 180,110 L 220,155 L 260,110 L 300,128 L 330,60" fill="none" stroke="#1a5fb4" stroke-width="2.6"/>
<circle cx="100" cy="110" r="4" fill="#5a5950"/>
<circle cx="140" cy="180" r="4" fill="#c98a1f"/>
<circle cx="180" cy="110" r="4" fill="#5a5950"/>
<circle cx="220" cy="155" r="4" fill="#c98a1f"/>
<circle cx="260" cy="110" r="4" fill="#5a5950"/>

<circle cx="300" cy="128" r="5.5" fill="#d0453b"/>
<text x="300" y="118" font-size="9.5" fill="#d0453b" text-anchor="middle" font-weight="700">저항 돌파</text>

<line x1="65" y1="110" x2="65" y2="250" stroke="#1f9d55" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="30" y="182" font-size="9.5" fill="#188a48" font-weight="700" transform="rotate(-90 30 182)">높이 H</text>

<line x1="300" y1="128" x2="300" y2="60" stroke="#1f9d55" stroke-width="1.3" stroke-dasharray="4,3"/>
<line x1="300" y1="60" x2="330" y2="60" stroke="#1f9d55" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="315" y="52" font-size="9" fill="#188a48" text-anchor="middle" font-weight="700">목표가=저항+H</text>

<g fill="#9c9b8f">
<rect x="90" y="290" width="20" height="30" opacity="0.75"/>
<rect x="130" y="300" width="20" height="20" opacity="0.55"/>
<rect x="170" y="304" width="20" height="16" opacity="0.5"/>
<rect x="210" y="308" width="20" height="12" opacity="0.45"/>
<rect x="250" y="310" width="20" height="10" opacity="0.4"/>
<rect x="300" y="278" width="20" height="42" fill="#1f9d55" opacity="0.85"/>
</g>
<text x="60" y="335" font-size="9.5" fill="#5a5950">거래량: 수렴 중 감소 → 돌파 시 급증</text>

<text x="525" y="50" font-size="12" fill="#1a5fb4" text-anchor="middle" font-weight="700">깃발형(플래그)</text>

<path d="M 385,320 L 420,150" fill="none" stroke="#1a5fb4" stroke-width="3"/>
<text x="380" y="235" font-size="9.5" fill="#20201a" font-weight="700" transform="rotate(-72 380 235)">깃대(pole)</text>

<line x1="420" y1="150" x2="470" y2="185" stroke="#767568" stroke-width="1.4" stroke-dasharray="5,4"/>
<line x1="420" y1="185" x2="470" y2="220" stroke="#767568" stroke-width="1.4" stroke-dasharray="5,4"/>
<path d="M 420,150 L 440,168 L 425,178 L 450,192 L 435,202 L 470,185" fill="none" stroke="#1a5fb4" stroke-width="2.6"/>
<text x="443" y="145" font-size="9.5" fill="#5a5950" text-anchor="middle" font-weight="700">깃발(flag)</text>

<circle cx="470" cy="185" r="5.5" fill="#d0453b"/>
<text x="470" y="230" font-size="9.5" fill="#d0453b" text-anchor="middle" font-weight="700">깃발 상단 돌파</text>

<path d="M 470,185 L 620,55" fill="none" stroke="#1a5fb4" stroke-width="2.6"/>

<line x1="378" y1="320" x2="378" y2="150" stroke="#1f9d55" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="358" y="240" font-size="9.5" fill="#188a48" font-weight="700" transform="rotate(-90 358 240)">깃대 높이 H</text>

<line x1="470" y1="185" x2="470" y2="55" stroke="#1f9d55" stroke-width="1.3" stroke-dasharray="4,3"/>
<line x1="470" y1="55" x2="610" y2="55" stroke="#1f9d55" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="580" y="47" font-size="9" fill="#188a48" text-anchor="middle" font-weight="700">목표가=돌파가+H</text>

<g fill="#9c9b8f">
<rect x="390" y="300" width="16" height="20" fill="#1f9d55" opacity="0.85"/>
<rect x="425" y="325" width="16" height="10" opacity="0.5"/>
<rect x="445" y="328" width="16" height="7" opacity="0.4"/>
<rect x="465" y="330" width="16" height="5" opacity="0.35"/>
<rect x="490" y="300" width="16" height="35" fill="#1f9d55" opacity="0.85"/>
</g>
<text x="390" y="352" font-size="9.5" fill="#5a5950">거래량: 깃대는 급증, 깃발은 마름, 돌파 시 재급증</text>
</svg>
