<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="620" height="340" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">News Trading: Bracket Orders &amp; Breakout vs Fade</text>

<line x1="315" y1="34" x2="315" y2="318" stroke="#e1e0d9" stroke-width="1"/>
<text x="30" y="52" font-size="12" fill="#5a5950" font-weight="700">Before release: two-sided bracket</text>

<line x1="35" y1="140" x2="285" y2="140" stroke="#c7c6bc" stroke-width="1" stroke-dasharray="2,3"/>
<text x="35" y="132" font-size="9" fill="#9a988c">pre-release range</text>
<path d="M 45,150 L 90,148 L 130,142 L 170,144 L 210,141 L 260,140" fill="none" stroke="#5a5950" stroke-width="1.8"/>

<line x1="35" y1="95" x2="285" y2="95" stroke="#1a5fb4" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="290" y="98" font-size="9" fill="#1a5fb4" text-anchor="start">buy stop</text>

<line x1="35" y1="190" x2="285" y2="190" stroke="#d0453b" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="290" y="193" font-size="9" fill="#d0453b" text-anchor="start">sell stop</text>

<circle cx="260" cy="140" r="3.5" fill="#20201a"/>
<text x="260" y="205" font-size="9.5" fill="#20201a" text-anchor="middle" font-weight="700">release moment</text>

<path d="M 260,140 L 260,95" fill="none" stroke="#1a5fb4" stroke-width="2.2" marker-end="url(#arrowB)"/>
<text x="222" y="118" font-size="9" fill="#1a5fb4" text-anchor="middle">fills →</text>

<path d="M 260,140 L 260,190" fill="none" stroke="#c7c6bc" stroke-width="2" stroke-dasharray="3,2"/>
<text x="222" y="168" font-size="9" fill="#9a988c" text-anchor="middle">canceled ✕</text>

<rect x="35" y="220" width="250" height="60" rx="8" fill="#1a5fb4" opacity="0.08" stroke="#1a5fb4" stroke-width="1"/>
<text x="160" y="240" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">Only one side fills —</text>
<text x="160" y="256" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">the other is canceled at once</text>
<text x="160" y="272" font-size="8.5" fill="#5a5950" text-anchor="middle">distance set from ATR, not fixed pips</text>

<defs>
  <marker id="arrowB" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#1a5fb4"/>
  </marker>
  <marker id="arrowG" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#1f9d55"/>
  </marker>
  <marker id="arrowR" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#d0453b"/>
  </marker>
</defs>

<text x="340" y="52" font-size="12" fill="#5a5950" font-weight="700">After release: two paths</text>

<line x1="345" y1="140" x2="595" y2="140" stroke="#c7c6bc" stroke-width="1" stroke-dasharray="2,3"/>
<path d="M 355,150 L 400,148 L 430,142 L 460,144 L 480,141" fill="none" stroke="#5a5950" stroke-width="1.8"/>
<circle cx="480" cy="141" r="3" fill="#20201a"/>

<path d="M 480,141 L 510,105 L 540,90 L 570,78" fill="none" stroke="#1f9d55" stroke-width="2" marker-end="url(#arrowG)"/>
<text x="580" y="72" font-size="9" fill="#177a42" text-anchor="end" font-weight="700">breakout continues</text>

<path d="M 480,141 L 505,118 L 525,132 L 555,190 L 580,205" fill="none" stroke="#d0453b" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrowR)"/>
<text x="580" y="220" font-size="9" fill="#a03830" text-anchor="end" font-weight="700">fade (reversal)</text>

<text x="480" y="235" font-size="9" fill="#20201a" text-anchor="middle" font-weight="700">initial spike</text>

<rect x="345" y="255" width="245" height="60" rx="8" fill="#d0453b" opacity="0.08" stroke="#d0453b" stroke-width="1"/>
<text x="467" y="273" font-size="10" fill="#a03830" text-anchor="middle" font-weight="700">Whether the first move was</text>
<text x="467" y="289" font-size="10" fill="#a03830" text-anchor="middle" font-weight="700">overreaction or trend is only known after</text>
<text x="467" y="305" font-size="8.5" fill="#5a5950" text-anchor="middle">both paths occur in practice</text>
</svg>
