<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="620" height="340" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="14.5" fill="#20201a" text-anchor="middle" font-weight="700">Short Squeeze: Feedback Loop &amp; Short Interest Unwind vs. Price</text>

<line x1="30" y1="180" x2="290" y2="180" stroke="#e1e0d9" stroke-width="1"/>
<text x="30" y="52" font-size="12" fill="#5a5950" font-weight="700">Feedback Loop</text>

<circle cx="150" cy="90" r="46" fill="none" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="3,3"/>

<rect x="40" y="58" width="96" height="40" rx="8" fill="#1a5fb4" opacity="0.12" stroke="#1a5fb4" stroke-width="1.3"/>
<text x="88" y="76" font-size="9.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">1. Price Rises</text>
<text x="88" y="90" font-size="8.5" fill="#1a5fb4" text-anchor="middle">(catalyst hits)</text>

<rect x="180" y="58" width="100" height="40" rx="8" fill="#d0453b" opacity="0.12" stroke="#d0453b" stroke-width="1.3"/>
<text x="230" y="76" font-size="9.5" fill="#d0453b" text-anchor="middle" font-weight="700">2. Losses Widen</text>
<text x="230" y="90" font-size="8.5" fill="#d0453b" text-anchor="middle">(short p&amp;l underwater)</text>

<rect x="180" y="128" width="100" height="40" rx="8" fill="#c98a1f" opacity="0.14" stroke="#c98a1f" stroke-width="1.3"/>
<text x="230" y="146" font-size="9.5" fill="#a06a10" text-anchor="middle" font-weight="700">3. Margin Call</text>
<text x="230" y="160" font-size="8.5" fill="#a06a10" text-anchor="middle">(forced buy-in)</text>

<rect x="40" y="128" width="96" height="40" rx="8" fill="#1f9d55" opacity="0.14" stroke="#1f9d55" stroke-width="1.3"/>
<text x="88" y="146" font-size="9.5" fill="#177a42" text-anchor="middle" font-weight="700">4. Cover Buying</text>
<text x="88" y="160" font-size="8.5" fill="#177a42" text-anchor="middle">(price pushed up more)</text>

<path d="M 136,78 L 178,78" fill="none" stroke="#767568" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 230,98 L 230,126" fill="none" stroke="#767568" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 178,148 L 138,148" fill="none" stroke="#767568" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 88,126 L 88,100" fill="none" stroke="#767568" stroke-width="1.6" marker-end="url(#arrow)"/>

<defs>
  <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#767568"/>
  </marker>
</defs>

<text x="160" y="200" font-size="10" fill="#5a5950" text-anchor="middle">Steps 1→2→3→4 repeat, compressing a sharp rally into a short window</text>

<line x1="325" y1="30" x2="325" y2="315" stroke="#e1e0d9" stroke-width="1"/>

<text x="475" y="52" font-size="12" fill="#5a5950" text-anchor="middle" font-weight="700">A Real Squeeze: Short Interest vs. Price</text>

<line x1="345" y1="270" x2="600" y2="270" stroke="#c7c6bb" stroke-width="1"/>
<line x1="345" y1="60" x2="345" y2="270" stroke="#c7c6bb" stroke-width="1"/>

<rect x="355" y="200" width="26" height="70" fill="#c98a1f" opacity="0.55"/>
<rect x="400" y="215" width="26" height="55" fill="#c98a1f" opacity="0.55"/>
<rect x="445" y="235" width="26" height="35" fill="#c98a1f" opacity="0.55"/>
<rect x="490" y="250" width="26" height="20" fill="#c98a1f" opacity="0.55"/>
<rect x="535" y="258" width="26" height="12" fill="#c98a1f" opacity="0.55"/>
<text x="475" y="286" font-size="9.5" fill="#a06a10" text-anchor="middle" font-weight="700">Short interest (bars, being covered)</text>

<path d="M 368,235 L 413,205 L 458,170 L 503,120 L 548,80" fill="none" stroke="#1a5fb4" stroke-width="3"/>
<circle cx="548" cy="80" r="5" fill="#1a5fb4"/>
<text x="548" y="66" font-size="10.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">Price (line, spiking)</text>

<text x="475" y="300" font-size="9.5" fill="#767568" text-anchor="middle">As short interest is covered off, price climbs sharply</text>
</svg>
