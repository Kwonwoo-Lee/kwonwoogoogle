<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="640" height="420" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="26" font-size="15" fill="#20201a" text-anchor="middle" font-weight="700">정적 드로다운 vs 트레일링 드로다운: 같은 계좌, 다른 결과</text>

<line x1="70" y1="360" x2="600" y2="360" stroke="#8a8a7c" stroke-width="1.5"/>
<line x1="70" y1="360" x2="70" y2="55" stroke="#8a8a7c" stroke-width="1.5"/>
<text x="335" y="392" font-size="12" fill="#5a5a4e" text-anchor="middle">거래일 경과</text>
<text x="42" y="210" font-size="12" fill="#5a5a4e" text-anchor="middle" transform="rotate(-90 42 210)">계좌 잔고</text>

<line x1="70" y1="300" x2="600" y2="300" stroke="#c7c6ba" stroke-width="1" stroke-dasharray="3,3"/>
<text x="120" y="295" font-size="11" fill="#8a8a7c">초기 잔고 (예: $100,000)</text>

<line x1="70" y1="340" x2="600" y2="340" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="400" y="354" font-size="11.5" fill="#b03a30" font-weight="700">정적 드로다운 한도 (초기잔고 -10%, 항상 고정)</text>

<path d="M 70,340 L 260,340 L 260,245 L 410,245 L 410,190 L 600,190" fill="none" stroke="#1a5fb4" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="130" y="330" font-size="11.5" fill="#1a5fb4" font-weight="700">트레일링 드로다운 한도 (신고점마다 상승, 하락해도 안 내려감)</text>

<path d="M 70,300 L 150,250 L 260,205 L 340,225 L 410,150 L 445,190" fill="none" stroke="#20201a" stroke-width="2.6"/>
<path d="M 445,190 L 480,230" fill="none" stroke="#8a8a7c" stroke-width="2" stroke-dasharray="4,3"/>

<circle cx="260" cy="205" r="4.5" fill="#1f9d55"/>
<text x="260" y="192" font-size="10.5" fill="#188a48" text-anchor="middle" font-weight="700">1차 신고점</text>

<circle cx="410" cy="150" r="4.5" fill="#1f9d55"/>
<text x="410" y="137" font-size="10.5" fill="#188a48" text-anchor="middle" font-weight="700">2차 신고점(트레일링 한도 재상승)</text>

<line x1="445" y1="181" x2="445" y2="199" stroke="#c0392b" stroke-width="2.4"/>
<line x1="436" y1="190" x2="454" y2="190" stroke="#c0392b" stroke-width="2.4"/>
<text x="500" y="185" font-size="11.5" fill="#c0392b" text-anchor="middle" font-weight="700">트레일링 한도 위반</text>
<text x="500" y="199" font-size="10.5" fill="#c0392b" text-anchor="middle">→ 챌린지 실격</text>

<line x1="480" y1="230" x2="480" y2="340" stroke="#1f9d55" stroke-width="1.3" stroke-dasharray="4,3"/>
<text x="480" y="356" font-size="10.5" fill="#188a48" text-anchor="middle" font-weight="700">정적 기준이면</text>
<text x="480" y="368" font-size="10.5" fill="#188a48" text-anchor="middle" font-weight="700">아직 여유 있음</text>

<line x1="90" y1="405" x2="115" y2="405" stroke="#20201a" stroke-width="2.6"/>
<text x="122" y="409" font-size="10.5" fill="#20201a">계좌 잔고(에쿼티) 곡선</text>
<line x1="290" y1="405" x2="315" y2="405" stroke="#1a5fb4" stroke-width="1.8" stroke-dasharray="5,4"/>
<text x="322" y="409" font-size="10.5" fill="#20201a">트레일링 한도</text>
<line x1="460" y1="405" x2="485" y2="405" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5,4"/>
<text x="492" y="409" font-size="10.5" fill="#20201a">정적 한도</text>
</svg>
