<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="620" height="430" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">호가창 임밸런스와 아이스버그 · 스푸핑 비교</text>

<!-- Panel 1: order book ladder -->
<text x="40" y="50" font-size="12" fill="#1f9d55" font-weight="700">① 호가창 임밸런스 — 매수잔량 vs 매도잔량</text>

<!-- ask rows (above mid), bars extend right from axis x=310 -->
<g fill="#c94f4f" opacity="0.75">
<rect x="310" y="60" width="44" height="14"/>
<rect x="310" y="76" width="52" height="14"/>
<rect x="310" y="92" width="46" height="14"/>
<rect x="310" y="108" width="50" height="14"/>
<rect x="310" y="124" width="48" height="14"/>
</g>
<text x="300" y="70" font-size="9" fill="#5a5950" text-anchor="end">52,500</text>
<text x="300" y="86" font-size="9" fill="#5a5950" text-anchor="end">52,450</text>
<text x="300" y="102" font-size="9" fill="#5a5950" text-anchor="end">52,400</text>
<text x="300" y="118" font-size="9" fill="#5a5950" text-anchor="end">52,350</text>
<text x="300" y="134" font-size="9" fill="#5a5950" text-anchor="end">52,300</text>
<text x="360" y="70" font-size="8.5" fill="#a03c3c">2,200</text>
<text x="368" y="86" font-size="8.5" fill="#a03c3c">2,600</text>
<text x="362" y="102" font-size="8.5" fill="#a03c3c">2,300</text>
<text x="366" y="118" font-size="8.5" fill="#a03c3c">2,500</text>
<text x="364" y="134" font-size="8.5" fill="#a03c3c">2,400</text>

<!-- mid price -->
<line x1="30" y1="146" x2="590" y2="146" stroke="#20201a" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="310" y="143" font-size="9.5" fill="#20201a" text-anchor="middle" font-weight="700">현재가 52,250</text>

<!-- bid rows (below mid), bars extend left from axis x=310, much wider -->
<g fill="#1f9d55" opacity="0.75">
<rect x="186" y="156" width="124" height="14"/>
<rect x="174" y="172" width="136" height="14"/>
<rect x="194" y="188" width="116" height="14"/>
<rect x="170" y="204" width="140" height="14"/>
<rect x="180" y="220" width="130" height="14"/>
</g>
<text x="320" y="166" font-size="9" fill="#5a5950">52,200</text>
<text x="320" y="182" font-size="9" fill="#5a5950">52,150</text>
<text x="320" y="198" font-size="9" fill="#5a5950">52,100</text>
<text x="320" y="214" font-size="9" fill="#5a5950">52,050</text>
<text x="320" y="230" font-size="9" fill="#5a5950">52,000</text>
<text x="180" y="166" font-size="8.5" fill="#177a42" text-anchor="end">9,200</text>
<text x="168" y="182" font-size="8.5" fill="#177a42" text-anchor="end">10,100</text>
<text x="188" y="198" font-size="8.5" fill="#177a42" text-anchor="end">8,700</text>
<text x="164" y="214" font-size="8.5" fill="#177a42" text-anchor="end">10,400</text>
<text x="174" y="230" font-size="8.5" fill="#177a42" text-anchor="end">9,600</text>

<text x="310" y="252" font-size="10" fill="#20201a" text-anchor="middle" font-weight="700">매도잔량 합계 12,000 · 매수잔량 합계 48,000 → 임밸런스 비율 (48,000−12,000)/(48,000+12,000) = +0.6</text>

<line x1="20" y1="270" x2="600" y2="270" stroke="#e1e0d9" stroke-width="1"/>

<!-- Panel 2: iceberg vs spoofing -->
<text x="40" y="294" font-size="12" fill="#1a5fb4" font-weight="700">② 아이스버그 재노출 vs 스푸핑 — 체결 여부가 가른다</text>

<text x="40" y="320" font-size="10" fill="#1f9d55" font-weight="700">아이스버그: 체결 후 같은 가격에 즉시 재노출</text>
<line x1="56" y1="345" x2="560" y2="345" stroke="#c7c6bb" stroke-width="1"/>
<g fill="#1f9d55">
<circle cx="90" cy="345" r="7"/><circle cx="190" cy="345" r="7"/><circle cx="290" cy="345" r="7"/>
<circle cx="390" cy="345" r="7"/><circle cx="490" cy="345" r="7"/>
</g>
<path d="M 90,345 L 190,345 M 290,345 L 390,345" stroke="#1f9d55" stroke-width="1" stroke-dasharray="2,3" opacity="0.5"/>
<text x="90" y="366" font-size="8" fill="#177a42" text-anchor="middle">체결</text>
<text x="190" y="366" font-size="8" fill="#177a42" text-anchor="middle">재노출</text>
<text x="290" y="366" font-size="8" fill="#177a42" text-anchor="middle">체결</text>
<text x="390" y="366" font-size="8" fill="#177a42" text-anchor="middle">재노출</text>
<text x="490" y="366" font-size="8" fill="#177a42" text-anchor="middle">체결</text>

<text x="40" y="388" font-size="10" fill="#c94f4f" font-weight="700">스푸핑: 가격이 다가오면 체결 직전 취소</text>
<line x1="56" y1="410" x2="560" y2="410" stroke="#c7c6bb" stroke-width="1"/>
<rect x="76" y="400" width="36" height="14" fill="#c94f4f" opacity="0.75"/>
<rect x="246" y="400" width="36" height="14" fill="#c94f4f" opacity="0.3" stroke="#c94f4f" stroke-width="1.2" stroke-dasharray="3,2"/>
<line x1="246" y1="400" x2="282" y2="414" stroke="#8a2f2f" stroke-width="1.3"/>
<line x1="282" y1="400" x2="246" y2="414" stroke="#8a2f2f" stroke-width="1.3"/>
<text x="94" y="423" font-size="8" fill="#8a2f2f" text-anchor="middle">대량 호가 표시</text>
<text x="264" y="423" font-size="8" fill="#8a2f2f" text-anchor="middle">가격 접근 → 취소(체결 없음)</text>
</svg>
