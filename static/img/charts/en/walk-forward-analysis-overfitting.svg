<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="640" height="440" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="26" font-size="15" fill="#20201a" text-anchor="middle" font-weight="700">Walk-Forward Analysis: Rolling In-Sample / Out-of-Sample Windows</text>

<!-- fold rows: in-sample (blue) then out-of-sample (orange), shifting right each fold -->
<rect x="60" y="76" width="240" height="26" rx="4" fill="#1a5fb4"/>
<rect x="300" y="76" width="60" height="26" rx="4" fill="#d98324"/>
<text x="55" y="94" font-size="11" fill="#5a5950" text-anchor="end">Fold 1</text>

<rect x="120" y="128" width="240" height="26" rx="4" fill="#1a5fb4"/>
<rect x="360" y="128" width="60" height="26" rx="4" fill="#d98324"/>
<text x="115" y="146" font-size="11" fill="#5a5950" text-anchor="end">Fold 2</text>

<rect x="180" y="180" width="240" height="26" rx="4" fill="#1a5fb4"/>
<rect x="420" y="180" width="60" height="26" rx="4" fill="#d98324"/>
<text x="175" y="198" font-size="11" fill="#5a5950" text-anchor="end">Fold 3</text>

<rect x="240" y="232" width="240" height="26" rx="4" fill="#1a5fb4"/>
<rect x="480" y="232" width="60" height="26" rx="4" fill="#d98324"/>
<text x="235" y="250" font-size="11" fill="#5a5950" text-anchor="end">Fold 4</text>

<text x="560" y="250" font-size="16" fill="#9c9b8f" text-anchor="middle" font-weight="700">⋯</text>
<text x="600" y="276" font-size="9.5" fill="#767568" text-anchor="end">Repeats to roughly</text>
<text x="600" y="288" font-size="9.5" fill="#767568" text-anchor="end">14-16 folds over 10 years</text>

<!-- roll-forward arrow -->
<path d="M 95,110 C 95,120 115,120 115,128" fill="none" stroke="#9c9b8f" stroke-width="1.6" marker-end="url(#arrow)"/>
<defs>
  <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 Z" fill="#9c9b8f"/>
  </marker>
</defs>
<text x="330" y="300" font-size="9.5" fill="#767568" text-anchor="middle">Window slides forward 6 months (= out-of-sample length) and repeats</text>

<!-- time axis -->
<line x1="60" y1="330" x2="600" y2="330" stroke="#8a8a7c" stroke-width="1.3"/>
<line x1="60" y1="330" x2="60" y2="322" stroke="#8a8a7c" stroke-width="1.3"/>
<line x1="168" y1="330" x2="168" y2="322" stroke="#8a8a7c" stroke-width="1.3"/>
<line x1="276" y1="330" x2="276" y2="322" stroke="#8a8a7c" stroke-width="1.3"/>
<line x1="384" y1="330" x2="384" y2="322" stroke="#8a8a7c" stroke-width="1.3"/>
<line x1="492" y1="330" x2="492" y2="322" stroke="#8a8a7c" stroke-width="1.3"/>
<line x1="600" y1="330" x2="600" y2="322" stroke="#8a8a7c" stroke-width="1.3"/>
<text x="60" y="345" font-size="10" fill="#767568" text-anchor="middle">Yr 0</text>
<text x="168" y="345" font-size="10" fill="#767568" text-anchor="middle">Yr 2</text>
<text x="276" y="345" font-size="10" fill="#767568" text-anchor="middle">Yr 4</text>
<text x="384" y="345" font-size="10" fill="#767568" text-anchor="middle">Yr 6</text>
<text x="492" y="345" font-size="10" fill="#767568" text-anchor="middle">Yr 8</text>
<text x="600" y="345" font-size="10" fill="#767568" text-anchor="middle">Yr 10</text>
<text x="330" y="365" font-size="11" fill="#5a5950" text-anchor="middle">Full dataset (time axis)</text>

<!-- legend -->
<rect x="90" y="390" width="18" height="14" rx="3" fill="#1a5fb4"/>
<text x="114" y="401" font-size="11" fill="#20201a">In-sample (training window, parameters optimized)</text>
<rect x="90" y="414" width="18" height="14" rx="3" fill="#d98324"/>
<text x="114" y="425" font-size="11" fill="#20201a">Out-of-sample (test window, never touched during optimization)</text>
</svg>
