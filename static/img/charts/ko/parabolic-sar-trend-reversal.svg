<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="620" height="400" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="14.5" fill="#20201a" text-anchor="middle" font-weight="700">파라볼릭 SAR: 점이 가속하며 가격에 다가붙다가 반전 시 극값으로 점프</text>

<line x1="300" y1="45" x2="300" y2="345" stroke="#c7c6bd" stroke-width="1" stroke-dasharray="3,3"/>
<text x="165" y="60" font-size="11.5" fill="#9a998d" text-anchor="middle">상승 추세 (점이 가격 아래, 가속)</text>
<text x="445" y="60" font-size="11.5" fill="#9a998d" text-anchor="middle">하락 추세 (점이 가격 위, 가속)</text>

<!-- price line: uptrend to peak, then reversal down -->
<path d="M 40,300 L 90,275 L 140,245 L 190,210 L 240,175 L 270,150 L 300,175 L 340,200 L 380,225 L 420,248 L 460,268 L 500,285 L 540,298 L 590,310" fill="none" stroke="#1a5fb4" stroke-width="3"/>

<!-- EP marker at the uptrend peak -->
<circle cx="270" cy="150" r="5" fill="none" stroke="#6b5b1e" stroke-width="2"/>
<text x="270" y="134" font-size="11" fill="#6b5b1e" text-anchor="middle" font-weight="700">EP(추세 극값)</text>

<!-- uptrend dots below price, gap shrinking: 35,30,24,18,10,4 -->
<circle cx="40" cy="335" r="4.5" fill="#1f9d55"/>
<circle cx="90" cy="305" r="4.5" fill="#1f9d55"/>
<circle cx="140" cy="269" r="4.5" fill="#1f9d55"/>
<circle cx="190" cy="228" r="4.5" fill="#1f9d55"/>
<circle cx="240" cy="185" r="4.5" fill="#1f9d55"/>
<circle cx="270" cy="154" r="4.5" fill="#1f9d55"/>

<!-- downtrend dots above price, gap shrinking: 25,20,15,10,7,5,4,3 -->
<circle cx="300" cy="150" r="4.5" fill="#d0453b"/>
<circle cx="340" cy="180" r="4.5" fill="#d0453b"/>
<circle cx="380" cy="210" r="4.5" fill="#d0453b"/>
<circle cx="420" cy="238" r="4.5" fill="#d0453b"/>
<circle cx="460" cy="261" r="4.5" fill="#d0453b"/>
<circle cx="500" cy="280" r="4.5" fill="#d0453b"/>
<circle cx="540" cy="294" r="4.5" fill="#d0453b"/>
<circle cx="590" cy="307" r="4.5" fill="#d0453b"/>

<!-- jump arrow from last green dot to first red dot (same EP level) -->
<path d="M 270,154 C 285,110 285,110 298,150" fill="none" stroke="#20201a" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#20201a"/>
  </marker>
</defs>
<text x="330" y="118" font-size="11.5" fill="#20201a" text-anchor="middle" font-weight="700">반전: 새 SAR = 직전 EP로 즉시 점프</text>
<text x="330" y="133" font-size="11" fill="#20201a" text-anchor="middle">(AF는 0.02로 초기화)</text>

<text x="50" y="350" font-size="11" fill="#1f9d55" text-anchor="start" font-weight="700">점 간격이 점점 좁아짐(가속계수 AF 증가)</text>

<line x1="30" y1="365" x2="595" y2="365" stroke="#e1e0d9" stroke-width="1"/>

<rect x="44" y="378" width="12" height="12" fill="#1a5fb4"/>
<text x="60" y="388" font-size="11" fill="#20201a" text-anchor="start">가격</text>
<rect x="130" y="378" width="12" height="12" fill="#1f9d55"/>
<text x="146" y="388" font-size="11" fill="#1f9d55" text-anchor="start">SAR(상승 추세, 지지)</text>
<rect x="340" y="378" width="12" height="12" fill="#d0453b"/>
<text x="356" y="388" font-size="11" fill="#d0453b" text-anchor="start">SAR(하락 추세, 저항)</text>
</svg>
