<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="620" height="420" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="24" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">트레저리 베이시스 트레이드: 가격 수렴 + 레포 레버리지 순환</text>

<rect x="30" y="44" width="270" height="180" fill="none" stroke="#c7c6bb" stroke-width="1"/>
<text x="38" y="38" font-size="11" fill="#767568" text-anchor="start" font-weight="700">현물 vs 선물 가격 → 수렴</text>

<line x1="60" y1="60" x2="60" y2="205" stroke="#e5e4da" stroke-width="1"/>
<line x1="60" y1="205" x2="280" y2="205" stroke="#c7c6bb" stroke-width="1"/>
<text x="55" y="215" font-size="9" fill="#9a998d" text-anchor="middle">현재</text>
<text x="275" y="215" font-size="9" fill="#9a998d" text-anchor="middle">만기</text>

<path d="M 60,90 C 140,90 200,160 275,170" fill="none" stroke="#1a5fb4" stroke-width="2.6"/>
<path d="M 60,150 C 140,155 200,165 275,170" fill="none" stroke="#9a998d" stroke-width="2.2" stroke-dasharray="4,3"/>
<circle cx="60" cy="90" r="3" fill="#1a5fb4"/>
<circle cx="275" cy="170" r="3.4" fill="#20201a"/>
<circle cx="60" cy="150" r="3" fill="#9a998d"/>

<text x="100" y="82" font-size="9.5" fill="#1a5fb4" text-anchor="start" font-weight="700">선물 가격</text>
<text x="100" y="145" font-size="9.5" fill="#767568" text-anchor="start">현물(CTD 채권) 가격</text>
<text x="200" y="195" font-size="9" fill="#d0453b" text-anchor="middle" font-weight="700">베이시스 → 0</text>
<line x1="275" y1="172" x2="275" y2="168" stroke="#d0453b" stroke-width="1"/>

<rect x="320" y="44" width="270" height="180" fill="none" stroke="#c7c6bb" stroke-width="1"/>
<text x="328" y="38" font-size="11" fill="#767568" text-anchor="start" font-weight="700">레포 레버리지 순환</text>

<rect x="345" y="60" width="90" height="34" rx="6" fill="#eef1f7" stroke="#1a5fb4"/>
<text x="390" y="81" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">CTD 채권 매수</text>

<rect x="345" y="170" width="90" height="34" rx="6" fill="#f4f0e8" stroke="#9a998d"/>
<text x="390" y="191" font-size="10" fill="#5a5950" text-anchor="middle" font-weight="700">레포 담보로 제공</text>

<rect x="470" y="115" width="95" height="34" rx="6" fill="#fdecea" stroke="#d0453b"/>
<text x="517" y="136" font-size="10" fill="#d0453b" text-anchor="middle" font-weight="700">현금 차입 후 재매수</text>

<path d="M 390,94 L 390,170" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 435,186 L 470,146" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 517,115 L 435,80" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow)"/>

<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#9a998d"/>
  </marker>
</defs>

<text x="455" y="210" font-size="9" fill="#767568" text-anchor="middle">반복 → 레버리지 약 10~20배 이상</text>

<rect x="30" y="248" width="560" height="140" fill="none" stroke="#c7c6bb" stroke-width="1"/>
<text x="38" y="242" font-size="11" fill="#767568" text-anchor="start" font-weight="700">시장 스트레스 시 강제 청산 경로</text>

<rect x="48" y="300" width="100" height="40" rx="6" fill="#f4f0e8" stroke="#9a998d"/>
<text x="98" y="316" font-size="9.5" fill="#5a5950" text-anchor="middle" font-weight="700">금리·변동성</text>
<text x="98" y="330" font-size="9.5" fill="#5a5950" text-anchor="middle" font-weight="700">급변</text>

<rect x="188" y="300" width="100" height="40" rx="6" fill="#fdecea" stroke="#d0453b"/>
<text x="238" y="316" font-size="9.5" fill="#d0453b" text-anchor="middle" font-weight="700">선물 마진콜</text>
<text x="238" y="330" font-size="9.5" fill="#d0453b" text-anchor="middle" font-weight="700">발생</text>

<rect x="328" y="300" width="100" height="40" rx="6" fill="#fdecea" stroke="#d0453b"/>
<text x="378" y="316" font-size="9.5" fill="#d0453b" text-anchor="middle" font-weight="700">국채 현물</text>
<text x="378" y="330" font-size="9.5" fill="#d0453b" text-anchor="middle" font-weight="700">강제 매도</text>

<rect x="468" y="300" width="100" height="40" rx="6" fill="#fdecea" stroke="#d0453b"/>
<text x="518" y="316" font-size="9.5" fill="#d0453b" text-anchor="middle" font-weight="700">국채시장</text>
<text x="518" y="330" font-size="9.5" fill="#d0453b" text-anchor="middle" font-weight="700">유동성 악화</text>

<path d="M 148,320 L 188,320" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 288,320 L 328,320" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 428,320 L 468,320" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow)"/>

<text x="310" y="376" font-size="9.5" fill="#9a998d" text-anchor="middle">* 구조를 보여주기 위한 설명용 예시이며 실제 시장 수치가 아닙니다</text>
</svg>
