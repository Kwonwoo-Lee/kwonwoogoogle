<text x="145" y="240" font-size="9.5" fill="#5a5950">(strong reversal candle)</text>

<rect x="215" y="185" width="55" height="45" fill="#1a5fb4" opacity="0.16" stroke="#1a5fb4" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="242" y="178" font-size="10" fill="#1a5fb4" text-anchor="middle" font-weight="700">FVG (entry zone)</text>

<line x1="320" y1="168" x2="460" y2="168" stroke="#1f9d55" stroke-width="1.3" stroke-dasharray="5,4"/>
<text x="390" y="158" font-size="10" fill="#177a42" text-anchor="middle" font-weight="700">Target (DOL): session-high liquidity</text>

<rect x="70" y="355" width="480" height="30" rx="6" fill="#fbeee9" stroke="#d0453b" stroke-width="1"/>
<text x="310" y="374" font-size="10.5" fill="#a8362d" text-anchor="middle" font-weight="700">⚠ Missing HTF bias, sweep, or FVG means no trade (the Stand Down principle)</text>
</svg>
