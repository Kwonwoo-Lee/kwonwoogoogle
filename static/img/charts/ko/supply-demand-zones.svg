<text x="335" y="52" font-size="12" fill="#5a5950" font-weight="700">② 같은 존, 반복 테스트로 소모되어 붕괴</text>

<rect x="335" y="185" width="265" height="45" fill="#c98a1f" opacity="0.12" stroke="#c98a1f" stroke-width="1.5" stroke-dasharray="5,4"/>
