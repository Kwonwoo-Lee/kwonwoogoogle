<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="620" height="520" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="24" font-size="13.5" fill="#20201a" text-anchor="middle" font-weight="700">The 1.0x mNAV Line: Flywheel vs. Dilution Loop</text>

<text x="40" y="48" font-size="12" fill="#1a5fb4" font-weight="700">1. mNAV &gt; 1 — Premium Flywheel (virtuous cycle)</text>

<rect x="40" y="60" width="170" height="54" rx="6" fill="#eef1f7" stroke="#1a5fb4" stroke-width="1.3"/>
<text x="125" y="82" font-size="9.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">Stock &gt; BTC holdings</text>
<text x="125" y="96" font-size="9.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">value (mNAV &gt; 1)</text>

<rect x="410" y="60" width="170" height="54" rx="6" fill="#eef1f7" stroke="#1a5fb4" stroke-width="1.3"/>
<text x="495" y="82" font-size="9.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">Issue shares (ATM)</text>
<text x="495" y="96" font-size="9.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">at the premium price</text>

<rect x="410" y="150" width="170" height="54" rx="6" fill="#eafaf0" stroke="#1f9d55" stroke-width="1.3"/>
<text x="495" y="172" font-size="9.5" fill="#177a42" text-anchor="middle" font-weight="700">Use proceeds to buy</text>
<text x="495" y="186" font-size="9.5" fill="#177a42" text-anchor="middle" font-weight="700">more Bitcoin</text>

<rect x="40" y="150" width="170" height="54" rx="6" fill="#eafaf0" stroke="#1f9d55" stroke-width="1.3"/>
<text x="125" y="172" font-size="9.5" fill="#177a42" text-anchor="middle" font-weight="700">BTC per share rises</text>
<text x="125" y="186" font-size="9.5" fill="#177a42" text-anchor="middle" font-weight="700">(NAV/share grows)</text>

<path d="M 210,87 L 410,87" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow2)"/>
<path d="M 495,114 L 495,150" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow2)"/>
<path d="M 410,177 L 210,177" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow2)"/>
<path d="M 125,150 L 125,114" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow2)"/>
<text x="130" y="135" font-size="8.8" fill="#767568" text-anchor="start">Premium holds</text>
<text x="130" y="146" font-size="8.8" fill="#767568" text-anchor="start">or widens</text>

<line x1="20" y1="222" x2="600" y2="222" stroke="#e1e0d9" stroke-width="1"/>

<text x="40" y="246" font-size="12" fill="#a5342c" font-weight="700">2. mNAV &lt; 1 — Discount Dilution Loop</text>

<rect x="40" y="258" width="170" height="54" rx="6" fill="#fdecea" stroke="#d0453b" stroke-width="1.3"/>
<text x="125" y="280" font-size="9.5" fill="#a5342c" text-anchor="middle" font-weight="700">Stock &lt; BTC holdings</text>
<text x="125" y="294" font-size="9.5" fill="#a5342c" text-anchor="middle" font-weight="700">value (mNAV &lt; 1)</text>

<rect x="410" y="258" width="170" height="54" rx="6" fill="#fdecea" stroke="#d0453b" stroke-width="1.3"/>
<text x="495" y="280" font-size="9.5" fill="#a5342c" text-anchor="middle" font-weight="700">Issuance dilutes</text>
<text x="495" y="294" font-size="9.5" fill="#a5342c" text-anchor="middle" font-weight="700">BTC per share</text>

<rect x="410" y="348" width="170" height="54" rx="6" fill="#f4f0e8" stroke="#9a998d" stroke-width="1.3"/>
<text x="495" y="370" font-size="9.5" fill="#5a5950" text-anchor="middle" font-weight="700">Issuance halts, or</text>
<text x="495" y="384" font-size="9.5" fill="#5a5950" text-anchor="middle" font-weight="700">buybacks attempted</text>

<rect x="40" y="348" width="170" height="54" rx="6" fill="#f4f0e8" stroke="#9a998d" stroke-width="1.3"/>
<text x="125" y="370" font-size="9.5" fill="#5a5950" text-anchor="middle" font-weight="700">No arbitrage mechanism</text>
<text x="125" y="384" font-size="9.5" fill="#5a5950" text-anchor="middle" font-weight="700">(no AP/redemption)</text>

<path d="M 210,285 L 410,285" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow2)"/>
<path d="M 495,312 L 495,348" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow2)"/>
<path d="M 410,375 L 210,375" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow2)"/>
<path d="M 125,348 L 125,312" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow2)"/>
<text x="130" y="333" font-size="8.8" fill="#767568" text-anchor="start">Discount can</text>
<text x="130" y="344" font-size="8.8" fill="#767568" text-anchor="start">persist for years</text>

<rect x="40" y="420" width="540" height="40" rx="6" fill="#fbeee9" stroke="#d0453b" stroke-width="1"/>
<text x="310" y="444" font-size="10" fill="#a5342c" text-anchor="middle" font-weight="700">⚠ With no AP creation/redemption like an ETF has, neither the premium nor the discount closes on its own</text>

<text x="310" y="482" font-size="9.3" fill="#9b9a8f" text-anchor="middle" font-style="italic">* Illustrative example built to show the mechanism, not real figures for any company</text>

<defs>
  <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#9a998d"/>
  </marker>
</defs>
</svg>
