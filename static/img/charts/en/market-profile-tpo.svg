<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="640" height="460" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="26" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">Market Profile (TPO): a time-based profile built from stacked 30-minute letters</text>

<!-- value area shading behind rows 101-105 -->
<rect x="195" y="49" width="360" height="252" fill="#1f9d55" opacity="0.06"/>
<text x="560" y="55" font-size="9.5" fill="#1f9d55" font-weight="700">VAH</text>
<text x="560" y="298" font-size="9.5" fill="#1f9d55" font-weight="700">VAL</text>
<line x1="195" y1="301" x2="560" y2="301" stroke="#1f9d55" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
<line x1="195" y1="49" x2="560" y2="49" stroke="#1f9d55" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

<!-- price axis -->
<line x1="195" y1="49" x2="195" y2="301" stroke="#20201a" stroke-width="1.3"/>

<!-- rows: price labels + TPO letter stacks -->
<!-- 105: C,E -->
<text x="180" y="75" font-size="12" fill="#20201a" text-anchor="end">105</text>
<rect x="210" y="60" width="24" height="26" rx="3" fill="#d0453b" opacity="0.85"/><text x="222" y="78" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">C</text>
<rect x="238" y="60" width="24" height="26" rx="3" fill="#8a4fd1" opacity="0.85"/><text x="250" y="78" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">E</text>

<!-- 104: C,D,E -->
<text x="180" y="117" font-size="12" fill="#20201a" text-anchor="end">104</text>
<rect x="210" y="102" width="24" height="26" rx="3" fill="#d0453b" opacity="0.85"/><text x="222" y="120" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">C</text>
<rect x="238" y="102" width="24" height="26" rx="3" fill="#c98a1f" opacity="0.85"/><text x="250" y="120" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">D</text>
<rect x="266" y="102" width="24" height="26" rx="3" fill="#8a4fd1" opacity="0.85"/><text x="278" y="120" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">E</text>

<!-- 103: B,C,D,E  (POC) -->
<text x="180" y="159" font-size="12" fill="#20201a" text-anchor="end" font-weight="700">103</text>
<rect x="196" y="144" width="322" height="26" rx="3" fill="none" stroke="#20201a" stroke-width="1.6"/>
<rect x="210" y="144" width="24" height="26" rx="3" fill="#1f9d55" opacity="0.85"/><text x="222" y="162" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">B</text>
<rect x="238" y="144" width="24" height="26" rx="3" fill="#d0453b" opacity="0.85"/><text x="250" y="162" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">C</text>
<rect x="266" y="144" width="24" height="26" rx="3" fill="#c98a1f" opacity="0.85"/><text x="278" y="162" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">D</text>
<rect x="294" y="144" width="24" height="26" rx="3" fill="#8a4fd1" opacity="0.85"/><text x="306" y="162" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">E</text>
<text x="326" y="162" font-size="11" fill="#20201a" font-weight="700">← POC (4 TPOs, longest dwell)</text>

<!-- 102: A,B,C -->
<text x="180" y="201" font-size="12" fill="#20201a" text-anchor="end">102</text>
<rect x="210" y="186" width="24" height="26" rx="3" fill="#1a5fb4" opacity="0.85"/><text x="222" y="204" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">A</text>
<rect x="238" y="186" width="24" height="26" rx="3" fill="#1f9d55" opacity="0.85"/><text x="250" y="204" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">B</text>
<rect x="266" y="186" width="24" height="26" rx="3" fill="#d0453b" opacity="0.85"/><text x="278" y="204" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">C</text>

<!-- 101: A,B -->
<text x="180" y="243" font-size="12" fill="#20201a" text-anchor="end">101</text>
<rect x="210" y="228" width="24" height="26" rx="3" fill="#1a5fb4" opacity="0.85"/><text x="222" y="246" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">A</text>
<rect x="238" y="228" width="24" height="26" rx="3" fill="#1f9d55" opacity="0.85"/><text x="250" y="246" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">B</text>

<!-- 100: A -->
<text x="180" y="285" font-size="12" fill="#20201a" text-anchor="end">100</text>
<rect x="210" y="270" width="24" height="26" rx="3" fill="#1a5fb4" opacity="0.85"/><text x="222" y="288" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">A</text>

<!-- Initial Balance bracket (100-103, formed by A+B) -->
<path d="M 108,301 L 96,301 L 96,144 L 108,144" fill="none" stroke="#767568" stroke-width="1.4"/>
<text x="90" y="228" font-size="10.5" fill="#767568" text-anchor="end" transform="rotate(-90 90,228)">Initial Balance: 100–103 (A+B)</text>

<!-- Range extension arrow above IB top (103) up to 105 -->
<path d="M 320,144 L 320,66" stroke="#c98a1f" stroke-width="1.8" marker-end="url(#arrowMPen)"/>
<text x="330" y="100" font-size="10.5" fill="#c98a1f" font-weight="700">Range Extension</text>
<text x="330" y="113" font-size="9.5" fill="#c98a1f">(breaks above IB, starting period C)</text>

<defs>
  <marker id="arrowMPen" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
    <path d="M0,8 L4,0 L8,8 Z" fill="#c98a1f"/>
  </marker>
</defs>

<!-- legend: TPO periods -->
<text x="30" y="340" font-size="11" fill="#20201a" font-weight="700">TPO periods (30-minute)</text>
<rect x="30" y="352" width="16" height="16" rx="2" fill="#1a5fb4" opacity="0.85"/><text x="52" y="364" font-size="10.5" fill="#20201a">A 9:30–10:00</text>
<rect x="170" y="352" width="16" height="16" rx="2" fill="#1f9d55" opacity="0.85"/><text x="192" y="364" font-size="10.5" fill="#20201a">B 10:00–10:30 (IB complete)</text>
<rect x="380" y="352" width="16" height="16" rx="2" fill="#d0453b" opacity="0.85"/><text x="402" y="364" font-size="10.5" fill="#20201a">C 10:30–11:00</text>
<rect x="30" y="376" width="16" height="16" rx="2" fill="#c98a1f" opacity="0.85"/><text x="52" y="388" font-size="10.5" fill="#20201a">D 11:00–11:30</text>
<rect x="170" y="376" width="16" height="16" rx="2" fill="#8a4fd1" opacity="0.85"/><text x="192" y="388" font-size="10.5" fill="#20201a">E 11:30–12:00</text>
<rect x="380" y="376" width="16" height="16" rx="2" fill="#1f9d55" opacity="0.18" stroke="#1f9d55" stroke-width="1"/><text x="402" y="388" font-size="10.5" fill="#20201a">Value Area (~70% of TPOs)</text>

<text x="30" y="418" font-size="10" fill="#5a5950">Along the vertical price axis, TPO letters stack sideways into a bell shape — the thickest row (103) becomes the POC.</text>
<text x="30" y="436" font-size="10" fill="#5a5950">This example uses simplified numbers for teaching purposes; real Market Profile charts compute this automatically from tick data.</text>
</svg>
