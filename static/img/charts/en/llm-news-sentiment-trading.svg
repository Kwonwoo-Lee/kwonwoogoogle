<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="640" height="420" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="24" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">LLM News Sentiment Trading: From Text to Trade Signal in 4 Stages</text>

<defs>
  <marker id="llmArrowEn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#767568"/>
  </marker>
  <marker id="llmArrowGreenEn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#1f9d55"/>
  </marker>
  <marker id="llmArrowRedEn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#d0453b"/>
  </marker>
</defs>

<!-- stage 1: ingestion -->
<rect x="20" y="48" width="155" height="64" rx="8" fill="#20201a" opacity="0.06" stroke="#767568" stroke-width="1.2"/>
<text x="97" y="68" font-size="11" fill="#20201a" text-anchor="middle" font-weight="700">1. Ingestion</text>
<text x="97" y="86" font-size="9" fill="#5a5950" text-anchor="middle">News, filings, earnings</text>
<text x="97" y="99" font-size="9" fill="#5a5950" text-anchor="middle">calls, pulled in real time</text>

<path d="M 175,80 L 201,80" fill="none" stroke="#767568" stroke-width="1.4" marker-end="url(#llmArrowEn)"/>

<!-- stage 2: scoring -->
<rect x="203" y="48" width="155" height="64" rx="8" fill="#1a5fb4" opacity="0.1" stroke="#1a5fb4" stroke-width="1.3"/>
<text x="280" y="68" font-size="11" fill="#1a5fb4" text-anchor="middle" font-weight="700">2. Scoring</text>
<text x="280" y="86" font-size="9" fill="#5a5950" text-anchor="middle">LLM / FinBERT assigns a</text>
<text x="280" y="99" font-size="9" fill="#5a5950" text-anchor="middle">sentiment score -1 to +1</text>

<path d="M 358,80 L 384,80" fill="none" stroke="#767568" stroke-width="1.4" marker-end="url(#llmArrowEn)"/>

<!-- stage 3: signal generation -->
<rect x="386" y="48" width="155" height="64" rx="8" fill="#8a4fd1" opacity="0.1" stroke="#8a4fd1" stroke-width="1.3"/>
<text x="463" y="68" font-size="11" fill="#6a3aa8" text-anchor="middle" font-weight="700">3. Signal generation</text>
<text x="463" y="86" font-size="9" fill="#5a5950" text-anchor="middle">Score clears threshold +</text>
<text x="463" y="99" font-size="9" fill="#5a5950" text-anchor="middle">multiple sentences agree</text>

<path d="M 463,112 L 463,138" fill="none" stroke="#767568" stroke-width="1.4" marker-end="url(#llmArrowEn)"/>

<!-- decision box -->
<rect x="373" y="140" width="180" height="56" rx="8" fill="#c98a1f" opacity="0.1" stroke="#c98a1f" stroke-width="1.3"/>
<text x="463" y="162" font-size="10.5" fill="#a9710f" text-anchor="middle" font-weight="700">Price-side filter</text>
<text x="463" y="178" font-size="10.5" fill="#a9710f" text-anchor="middle" font-weight="700">(e.g. volume confirmation)</text>

<path d="M 400,196 L 330,228" fill="none" stroke="#1f9d55" stroke-width="1.6" marker-end="url(#llmArrowGreenEn)"/>
<text x="340" y="218" font-size="10.5" fill="#1f9d55" text-anchor="middle" font-weight="700">Pass</text>

<path d="M 524,196 L 594,228" fill="none" stroke="#d0453b" stroke-width="1.6" marker-end="url(#llmArrowRedEn)"/>
<text x="585" y="218" font-size="10.5" fill="#d0453b" text-anchor="middle" font-weight="700">Fail</text>

<!-- stage 4: execution -->
<rect x="150" y="230" width="230" height="62" rx="8" fill="#1f9d55" opacity="0.09" stroke="#1f9d55" stroke-width="1.4"/>
<text x="265" y="253" font-size="11.5" fill="#188a48" text-anchor="middle" font-weight="700">4. Execution &amp; risk filters</text>
<text x="265" y="270" font-size="9.5" fill="#5a5950" text-anchor="middle">Pre-set rules size the position</text>
<text x="265" y="283" font-size="9.5" fill="#5a5950" text-anchor="middle">and stop-loss, then it fires</text>

<rect x="470" y="230" width="150" height="62" rx="8" fill="#d0453b" opacity="0.08" stroke="#d0453b" stroke-width="1.4"/>
<text x="545" y="253" font-size="11.5" fill="#b03a30" text-anchor="middle" font-weight="700">Signal discarded</text>
<text x="545" y="270" font-size="9" fill="#5a5950" text-anchor="middle">No trade — avoids overreacting</text>
<text x="545" y="283" font-size="9" fill="#5a5950" text-anchor="middle">to a single headline</text>

<rect x="60" y="310" width="520" height="80" rx="8" fill="#20201a" opacity="0.05" stroke="#767568" stroke-width="1.2"/>
<text x="320" y="333" font-size="11" fill="#20201a" text-anchor="middle" font-weight="700">The edge: exploiting the seconds to minutes humans need to read and react</text>
<text x="320" y="352" font-size="9.5" fill="#5a5950" text-anchor="middle">Requiring agreement across several sentences, plus a price-data check,</text>
<text x="320" y="367" font-size="9.5" fill="#5a5950" text-anchor="middle">reduces the risk of acting on one sarcastic or misclassified headline</text>
<text x="320" y="383" font-size="9" fill="#767568" text-anchor="middle">(historical backtests carry overfitting risk and need out-of-sample validation)</text>

<text x="320" y="408" font-size="9" fill="#767568" text-anchor="middle">Simplified diagram illustrating pipeline structure, not live model output</text>
</svg>
