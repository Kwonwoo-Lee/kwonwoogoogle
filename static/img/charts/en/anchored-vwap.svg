<path d="M 40,175 L 80,150 L 120,168 L 160,120 L 200,140 L 240,90 L 270,105" fill="none" stroke="#1a5fb4" stroke-width="3"/>
<circle cx="40" cy="175" r="5" fill="#1f9d55"/>
<text x="40" y="196" font-size="10" fill="#1f9d55" text-anchor="middle" font-weight="700">Anchor (low)</text>

<path d="M 40,175 L 80,168 L 120,163 L 160,150 L 200,142 L 240,128 L 270,120" fill="none" stroke="#d0453b" stroke-width="2.5" stroke-dasharray="6,3"/>
<text x="272" y="118" font-size="10" fill="#d0453b" font-weight="700">Anchored VWAP</text>

<circle cx="120" cy="168" r="5" fill="#1a5fb4"/>
<circle cx="120" cy="163" r="4" fill="#d0453b"/>
<line x1="120" y1="168" x2="120" y2="195" stroke="#1f9d55" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="120" y="207" font-size="9.5" fill="#1f9d55" text-anchor="middle" font-weight="700">Bounce 1</text>

<circle cx="200" cy="140" r="5" fill="#1a5fb4"/>
<circle cx="200" cy="142" r="4" fill="#d0453b"/>
<line x1="200" y1="142" x2="200" y2="195" stroke="#1f9d55" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="200" y="207" font-size="9.5" fill="#1f9d55" text-anchor="middle" font-weight="700">Bounce 2</text>

<line x1="40" y1="225" x2="65" y2="225" stroke="#1a5fb4" stroke-width="3"/>
<text x="72" y="229" font-size="11" fill="#20201a">Price</text>
<line x1="110" y1="225" x2="135" y2="225" stroke="#d0453b" stroke-width="2.5" stroke-dasharray="6,3"/>
<text x="142" y="229" font-size="11" fill="#20201a">Anchored VWAP (acting as support)</text>

<line x1="325" y1="30" x2="325" y2="315" stroke="#e1e0d9" stroke-width="1"/>

<text x="475" y="52" font-size="12" fill="#5a5950" text-anchor="middle" font-weight="700">VWAP fan: three-anchor confluence</text>

<path d="M 345,260 L 390,220 L 435,235 L 480,180 L 525,195 L 570,150" fill="none" stroke="#1a5fb4" stroke-width="3"/>

<path d="M 345,260 L 570,175" fill="none" stroke="#c98a1f" stroke-width="2" stroke-dasharray="5,3" opacity="0.85"/>
<text x="575" y="172" font-size="9.5" fill="#c98a1f" font-weight="700">Anchor A</text>

<path d="M 390,240 L 570,183" fill="none" stroke="#d0453b" stroke-width="2" stroke-dasharray="5,3" opacity="0.85"/>
<text x="575" y="196" font-size="9.5" fill="#d0453b" font-weight="700">Anchor B</text>

<path d="M 435,255 L 570,191" fill="none" stroke="#1f9d55" stroke-width="2" stroke-dasharray="5,3" opacity="0.85"/>
<text x="575" y="205" font-size="9.5" fill="#1f9d55" font-weight="700">Anchor C</text>

<ellipse cx="555" cy="183" rx="26" ry="18" fill="#8a4fd1" opacity="0.12" stroke="#8a4fd1" stroke-width="1.3" stroke-dasharray="4,3"/>
<text x="490" y="270" font-size="10" fill="#6a3aa8" text-anchor="middle" font-weight="700">Confluence: three anchors' cost basis converge</text>
<line x1="490" y1="262" x2="540" y2="205" stroke="#6a3aa8" stroke-width="1" stroke-dasharray="2,2"/>

<line x1="345" y1="300" x2="365" y2="300" stroke="#1a5fb4" stroke-width="3"/>
<text x="372" y="304" font-size="10.5" fill="#20201a">Price</text>
<line x1="415" y1="300" x2="435" y2="300" stroke="#767568" stroke-width="2" stroke-dasharray="5,3"/>
<text x="442" y="304" font-size="10.5" fill="#20201a">Three VWAP lines from different anchors</text>
</svg>
