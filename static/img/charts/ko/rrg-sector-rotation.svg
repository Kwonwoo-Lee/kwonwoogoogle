<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="640" height="420" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="24" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">RRG(상대순환그래프): 4개 사분면을 시계방향으로 도는 섹터 로테이션</text>

<!-- quadrant backgrounds -->
<rect x="90" y="60" width="230" height="140" fill="#1a5fb4" opacity="0.07"/>
<rect x="320" y="60" width="230" height="140" fill="#1f9d55" opacity="0.08"/>
<rect x="90" y="200" width="230" height="140" fill="#d0453b" opacity="0.07"/>
<rect x="320" y="200" width="230" height="140" fill="#c98a1f" opacity="0.09"/>

<!-- quadrant labels -->
<text x="105" y="80" font-size="13" fill="#1a5fb4" font-weight="700">개선 (Improving)</text>
<text x="105" y="96" font-size="10" fill="#5a5950">약세지만 모멘텀 회복 중</text>

<text x="470" y="80" font-size="13" fill="#1f9d55" font-weight="700" text-anchor="end">리딩 (Leading)</text>
<text x="470" y="96" font-size="10" fill="#5a5950" text-anchor="end">강세 + 모멘텀 강함</text>

<text x="105" y="330" font-size="13" fill="#d0453b" font-weight="700">래깅 (Lagging)</text>
<text x="105" y="315" font-size="10" fill="#5a5950">약세 + 모멘텀도 둔화</text>

<text x="470" y="330" font-size="13" fill="#c98a1f" font-weight="700" text-anchor="end">약화 (Weakening)</text>
<text x="470" y="315" font-size="10" fill="#5a5950" text-anchor="end">강세지만 모멘텀 꺾임</text>

<!-- axes -->
<line x1="90" y1="200" x2="550" y2="200" stroke="#20201a" stroke-width="1.3"/>
<line x1="320" y1="60" x2="320" y2="340" stroke="#20201a" stroke-width="1.3"/>
<text x="555" y="204" font-size="11" fill="#20201a">RS-Ratio(상대강도) →</text>
<text x="65" y="196" font-size="11" fill="#20201a" text-anchor="end">100</text>
<text x="320" y="355" font-size="11" fill="#20201a" text-anchor="middle">100</text>
<text x="320" y="52" font-size="11" fill="#20201a" text-anchor="middle" font-weight="700">RS-Momentum(모멘텀) ↑</text>

<!-- rotation direction arrows along the border -->
<path d="M 200,55 L 260,55" stroke="#767568" stroke-width="1.6" marker-end="url(#arrowKo)"/>
<path d="M 585,120 L 585,180" stroke="#767568" stroke-width="1.6" marker-end="url(#arrowKo)"/>
<path d="M 380,345 L 320,345" stroke="#767568" stroke-width="1.6" marker-end="url(#arrowKo)"/>
<path d="M 55,280 L 55,220" stroke="#767568" stroke-width="1.6" marker-end="url(#arrowKo)"/>
<text x="230" y="46" font-size="9.5" fill="#767568" text-anchor="middle">시계방향 회전</text>

<defs>
  <marker id="arrowKo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#767568"/>
  </marker>
  <marker id="tailArrowKo" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#8a4fd1"/>
  </marker>
</defs>

<!-- sector A: Improving -> Leading (bottoming sector turning up) -->
<path d="M 250,180 L 280,150 L 320,130 L 360,112 L 398,96" fill="none" stroke="#1a5fb4" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="250" cy="180" r="3.5" fill="#1a5fb4" opacity="0.5"/>
<circle cx="398" cy="96" r="5.5" fill="#1a5fb4"/>
<text x="400" y="88" font-size="10.5" fill="#1a5fb4" font-weight="700">반도체 섹터</text>

<!-- sector B: Leading -> Weakening (rolling over) -->
<path d="M 430,90 L 442,120 L 432,158 L 412,208 L 392,238" fill="none" stroke="#d0453b" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="430" cy="90" r="3.5" fill="#d0453b" opacity="0.5"/>
<circle cx="392" cy="238" r="5.5" fill="#d0453b"/>
<text x="397" y="255" font-size="10.5" fill="#d0453b" font-weight="700">에너지 섹터</text>

<!-- sector C: Lagging -> Improving (bottoming and curling up) -->
<path d="M 150,318 L 140,288 L 156,254 L 182,222 L 212,192" fill="none" stroke="#8a4fd1" stroke-width="2.6" stroke-linecap="round" marker-end="url(#tailArrowKo)"/>
<circle cx="150" cy="318" r="3.5" fill="#8a4fd1" opacity="0.5"/>
<text x="130" y="335" font-size="10.5" fill="#8a4fd1" font-weight="700">유틸리티 섹터</text>

<!-- legend -->
<line x1="90" y1="392" x2="115" y2="392" stroke="#5a5950" stroke-width="2.6"/>
<text x="122" y="396" font-size="10.5" fill="#20201a">꼬리(tail): 최근 수 주간의 이동 경로</text>
<circle cx="380" cy="392" r="5" fill="#5a5950"/>
<text x="392" y="396" font-size="10.5" fill="#20201a">현재 위치(가장 최근 값)</text>
</svg>
