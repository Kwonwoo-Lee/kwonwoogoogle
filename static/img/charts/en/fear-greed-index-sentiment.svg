<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="620" height="300" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="15" fill="#20201a" text-anchor="middle" font-weight="700">Fear &amp; Greed Index: The 5 Sentiment Zones</text>

<text x="125" y="60" font-size="11" fill="#3a3a30" text-anchor="middle" font-weight="700">Extreme Fear</text>
<text x="242" y="60" font-size="11" fill="#3a3a30" text-anchor="middle" font-weight="700">Fear</text>
<text x="320" y="60" font-size="10" fill="#3a3a30" text-anchor="middle" font-weight="700">Neutral</text>
<text x="398" y="60" font-size="11" fill="#3a3a30" text-anchor="middle" font-weight="700">Greed</text>
<text x="515" y="60" font-size="11" fill="#3a3a30" text-anchor="middle" font-weight="700">Extreme Greed</text>

<rect x="60" y="70" width="130" height="50" fill="#d0453b"/>
<rect x="190" y="70" width="104" height="50" fill="#e08a5c"/>
<rect x="294" y="70" width="52" height="50" fill="#c9c7ba"/>
<rect x="346" y="70" width="104" height="50" fill="#8fc08a"/>
<rect x="450" y="70" width="130" height="50" fill="#1f9d55"/>
<rect x="60" y="70" width="520" height="50" fill="none" stroke="#3a3a30" stroke-width="1.5"/>

<line x1="60" y1="120" x2="60" y2="128" stroke="#5a5850" stroke-width="1.5"/>
<line x1="190" y1="120" x2="190" y2="128" stroke="#5a5850" stroke-width="1.5"/>
<line x1="294" y1="120" x2="294" y2="128" stroke="#5a5850" stroke-width="1.5"/>
<line x1="346" y1="120" x2="346" y2="128" stroke="#5a5850" stroke-width="1.5"/>
<line x1="450" y1="120" x2="450" y2="128" stroke="#5a5850" stroke-width="1.5"/>
<line x1="580" y1="120" x2="580" y2="128" stroke="#5a5850" stroke-width="1.5"/>

<text x="60" y="142" font-size="10" fill="#5a5850" text-anchor="middle">0</text>
<text x="190" y="142" font-size="10" fill="#5a5850" text-anchor="middle">25</text>
<text x="294" y="142" font-size="10" fill="#5a5850" text-anchor="middle">45</text>
<text x="346" y="142" font-size="10" fill="#5a5850" text-anchor="middle">55</text>
<text x="450" y="142" font-size="10" fill="#5a5850" text-anchor="middle">75</text>
<text x="580" y="142" font-size="10" fill="#5a5850" text-anchor="middle">100</text>

<text x="310" y="162" font-size="12" fill="#5a5850" text-anchor="middle">Fear &amp; Greed Index (0-100)</text>

<circle cx="164" cy="120" r="5" fill="#d0453b" stroke="#20201a" stroke-width="1"/>
<line x1="164" y1="120" x2="164" y2="210" stroke="#d0453b" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="164" y="228" font-size="13" fill="#d0453b" text-anchor="middle" font-weight="700">Example: reading of 20</text>
<text x="164" y="246" font-size="12" fill="#3a3a30" text-anchor="middle">Extreme Fear -&gt; watch for a bounce</text>

<line x1="50" y1="280" x2="80" y2="280" stroke="#3a3a30" stroke-width="3"/>
<text x="88" y="285" font-size="12" fill="#20201a" text-anchor="start" font-weight="400">CNN Fear &amp; Greed Index — 7 indicators combined, scaled 0-100</text>
</svg>
