<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="640" height="460" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="24" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">달러 스마일 이론: 위기형 강세와 예외주의형 강세 사이의 U자형 곡선</text>

<defs>
  <marker id="dsArrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#767568"/>
  </marker>
</defs>

<!-- axes -->
<line x1="80" y1="80" x2="80" y2="300" stroke="#c9c7ba" stroke-width="1.5"/>
<line x1="80" y1="300" x2="580" y2="300" stroke="#c9c7ba" stroke-width="1.5"/>
<text x="68" y="90" font-size="10.5" fill="#5a5850" text-anchor="end">강세</text>
<text x="68" y="252" font-size="10.5" fill="#5a5850" text-anchor="end">약세</text>
<text x="40" y="195" font-size="11" fill="#5a5850" text-anchor="middle" font-weight="700" transform="rotate(-90 40 195)">달러 강도</text>

<!-- main smile curve (solid) -->
<path d="M 100,120 C 160,108 210,118 260,165 C 295,196 320,206 320,210 C 320,206 345,196 380,165 C 430,118 480,108 540,120"
      fill="none" stroke="#20201a" stroke-width="3"/>

<!-- alternate 2026 "smirk" path on the right (dashed, lower) -->
<path d="M 380,165 C 430,145 480,152 540,172"
      fill="none" stroke="#767568" stroke-width="2.2" stroke-dasharray="6,5"/>

<!-- key points -->
<circle cx="100" cy="120" r="7" fill="#d0453b"/>
<circle cx="320" cy="210" r="7" fill="#767568"/>
<circle cx="540" cy="120" r="7" fill="#1f9d55"/>
<circle cx="540" cy="172" r="6" fill="#767568" opacity="0.8"/>

<text x="100" y="330" font-size="9.5" fill="#767568" text-anchor="middle">2026년 스마크 논쟁</text>
<line x1="100" y1="322" x2="100" y2="316" stroke="#767568" stroke-width="0" opacity="0"/>

<!-- zone bands -->
<rect x="80" y="340" width="150" height="56" rx="8" fill="#d0453b" opacity="0.10" stroke="#d0453b" stroke-width="1.2"/>
<text x="155" y="360" font-size="12.5" fill="#d0453b" text-anchor="middle" font-weight="700">1국면: 글로벌 위기</text>
<text x="155" y="378" font-size="10" fill="#5a5950" text-anchor="middle">안전자산 수요 → 강세</text>

<rect x="245" y="340" width="150" height="56" rx="8" fill="#767568" opacity="0.10" stroke="#767568" stroke-width="1.2"/>
<text x="320" y="360" font-size="12.5" fill="#5a5950" text-anchor="middle" font-weight="700">2국면: 미국 성장 둔화</text>
<text x="320" y="378" font-size="10" fill="#5a5950" text-anchor="middle">두 동력 모두 약함 → 바닥</text>

<rect x="410" y="340" width="150" height="56" rx="8" fill="#1f9d55" opacity="0.10" stroke="#1f9d55" stroke-width="1.2"/>
<text x="485" y="360" font-size="12.5" fill="#1f9d55" text-anchor="middle" font-weight="700">3국면: 미국 예외주의</text>
<text x="485" y="378" font-size="10" fill="#5a5950" text-anchor="middle">금리·성장 매력 → 강세</text>

<!-- connector ticks from curve points to zone bands -->
<line x1="100" y1="127" x2="155" y2="338" stroke="#d0453b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
<line x1="320" y1="217" x2="320" y2="338" stroke="#767568" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
<line x1="540" y1="127" x2="485" y2="338" stroke="#1f9d55" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

<text x="320" y="420" font-size="11" fill="#5a5850" text-anchor="middle">국면 (글로벌 리스크 선호 ↔ 미국 경제의 상대적 위치)</text>

<line x1="60" y1="440" x2="90" y2="440" stroke="#767568" stroke-width="2.2" stroke-dasharray="6,5"/>
<text x="98" y="444" font-size="10.5" fill="#767568" text-anchor="start">점선: JP모건 등이 제기한 2026년 비대칭 '스마크' 가능성 (오른쪽 끝이 예전보다 낮음)</text>
</svg>
