<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="26" font-size="14.5" fill="#20201a" text-anchor="middle" font-weight="700">Two Round Trips: Index Ends Flat, 3x ETF Falls Hard</text>

<line x1="80" y1="330" x2="600" y2="330" stroke="#8a8a7c" stroke-width="1.5"/>
<line x1="80" y1="330" x2="80" y2="60" stroke="#8a8a7c" stroke-width="1.5"/>
<text x="340" y="368" font-size="12" fill="#5a5a4e" text-anchor="middle">Trading day (-10% → +10% → -10% → +10%)</text>
<text x="45" y="195" font-size="12" fill="#5a5a4e" text-anchor="middle" transform="rotate(-90 45 195)">Price level (start = 100)</text>

<!-- gridlines -->
<line x1="80" y1="90" x2="600" y2="90" stroke="#d8d7cc" stroke-width="1" stroke-dasharray="3,3"/>
<text x="605" y="94" font-size="10.5" fill="#9c9b8f">100</text>
<line x1="80" y1="270" x2="600" y2="270" stroke="#d8d7cc" stroke-width="1" stroke-dasharray="3,3"/>
<text x="605" y="274" font-size="10.5" fill="#9c9b8f">70</text>

<!-- x axis day labels -->
<text x="100" y="346" font-size="11" fill="#5a5a4e" text-anchor="middle">Day 0</text>
<text x="215" y="346" font-size="11" fill="#5a5a4e" text-anchor="middle">Day 1</text>
<text x="330" y="346" font-size="11" fill="#5a5a4e" text-anchor="middle">Day 2</text>
<text x="445" y="346" font-size="11" fill="#5a5a4e" text-anchor="middle">Day 3</text>
<text x="560" y="346" font-size="11" fill="#5a5a4e" text-anchor="middle">Day 4</text>

<!-- naive 3x expectation marker at day4 -->
<line x1="80" y1="125.82" x2="560" y2="125.82" stroke="#9c5a1e" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="110" y="121" font-size="10.5" fill="#9c5a1e" font-weight="700">Naive "3x" estimate: 94.03</text>

<!-- Index line (blue) -->
<path d="M 100,90 L 215,150 L 330,96 L 445,155.4 L 560,101.94"
      fill="none" stroke="#1a5fb4" stroke-width="3"/>
<circle cx="100" cy="90" r="4.5" fill="#1a5fb4"/>
<circle cx="215" cy="150" r="4.5" fill="#1a5fb4"/>
<circle cx="330" cy="96" r="4.5" fill="#1a5fb4"/>
<circle cx="445" cy="155.4" r="4.5" fill="#1a5fb4"/>
<circle cx="560" cy="101.94" r="5.5" fill="#1a5fb4"/>
<text x="560" y="88" font-size="11" fill="#1a5fb4" text-anchor="end" font-weight="700">Index 98.01 (-1.99%)</text>

<!-- 3x ETF line (red) -->
<path d="M 100,90 L 215,270 L 330,144 L 445,307.8 L 560,193.14"
      fill="none" stroke="#d0453b" stroke-width="3"/>
<circle cx="100" cy="90" r="4.5" fill="#d0453b"/>
<circle cx="215" cy="270" r="4.5" fill="#d0453b"/>
<circle cx="330" cy="144" r="4.5" fill="#d0453b"/>
<circle cx="445" cy="307.8" r="4.5" fill="#d0453b"/>
<circle cx="560" cy="193.14" r="5.5" fill="#d0453b"/>
<text x="560" y="210" font-size="11" fill="#b03a30" text-anchor="end" font-weight="700">3x ETF 82.81 (-17.19%)</text>

<!-- gap bracket at day4 -->
<line x1="580" y1="125.82" x2="580" y2="193.14" stroke="#5a5a4e" stroke-width="1.2"/>
<line x1="576" y1="125.82" x2="584" y2="125.82" stroke="#5a5a4e" stroke-width="1.2"/>
<line x1="576" y1="193.14" x2="584" y2="193.14" stroke="#5a5a4e" stroke-width="1.2"/>
<text x="588" y="163" font-size="9.5" fill="#5a5a4e">decay</text>

<!-- legend -->
<line x1="100" y1="385" x2="125" y2="385" stroke="#1a5fb4" stroke-width="3"/>
<text x="132" y="389" font-size="11" fill="#20201a">Underlying index (1x)</text>
<line x1="290" y1="385" x2="315" y2="385" stroke="#d0453b" stroke-width="3"/>
<text x="322" y="389" font-size="11" fill="#20201a">3x leveraged ETF</text>
<line x1="450" y1="385" x2="475" y2="385" stroke="#9c5a1e" stroke-width="2" stroke-dasharray="5,4"/>
<text x="482" y="389" font-size="11" fill="#20201a">Naive 3x estimate</text>
</svg>
