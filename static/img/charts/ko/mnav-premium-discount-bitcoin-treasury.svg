<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="620" height="520" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="24" font-size="13.5" fill="#20201a" text-anchor="middle" font-weight="700">mNAV 1배를 기준으로 갈리는 플라이휠 vs 희석 순환</text>

<text x="40" y="48" font-size="12" fill="#1a5fb4" font-weight="700">① mNAV &gt; 1 — 프리미엄 플라이휠(선순환)</text>

<rect x="40" y="60" width="170" height="54" rx="6" fill="#eef1f7" stroke="#1a5fb4" stroke-width="1.3"/>
<text x="125" y="82" font-size="9.8" fill="#1a5fb4" text-anchor="middle" font-weight="700">주가 &gt; BTC 보유가치</text>
<text x="125" y="96" font-size="9.8" fill="#1a5fb4" text-anchor="middle" font-weight="700">(mNAV &gt; 1)</text>

<rect x="410" y="60" width="170" height="54" rx="6" fill="#eef1f7" stroke="#1a5fb4" stroke-width="1.3"/>
<text x="495" y="82" font-size="9.8" fill="#1a5fb4" text-anchor="middle" font-weight="700">프리미엄가로 ATM 증자</text>
<text x="495" y="96" font-size="9.8" fill="#1a5fb4" text-anchor="middle" font-weight="700">(신주 발행)</text>

<rect x="410" y="150" width="170" height="54" rx="6" fill="#eafaf0" stroke="#1f9d55" stroke-width="1.3"/>
<text x="495" y="172" font-size="9.8" fill="#177a42" text-anchor="middle" font-weight="700">조달자금으로</text>
<text x="495" y="186" font-size="9.8" fill="#177a42" text-anchor="middle" font-weight="700">BTC 추가 매수</text>

<rect x="40" y="150" width="170" height="54" rx="6" fill="#eafaf0" stroke="#1f9d55" stroke-width="1.3"/>
<text x="125" y="172" font-size="9.8" fill="#177a42" text-anchor="middle" font-weight="700">주당 BTC 보유량 증가</text>
<text x="125" y="186" font-size="9.8" fill="#177a42" text-anchor="middle" font-weight="700">(NAV/주 상승)</text>

<path d="M 210,87 L 410,87" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow2)"/>
<path d="M 495,114 L 495,150" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow2)"/>
<path d="M 410,177 L 210,177" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow2)"/>
<path d="M 125,150 L 125,114" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow2)"/>
<text x="130" y="135" font-size="9" fill="#767568" text-anchor="start">프리미엄</text>
<text x="130" y="146" font-size="9" fill="#767568" text-anchor="start">유지·확대</text>

<line x1="20" y1="222" x2="600" y2="222" stroke="#e1e0d9" stroke-width="1"/>

<text x="40" y="246" font-size="12" fill="#a5342c" font-weight="700">② mNAV &lt; 1 — 디스카운트 희석 순환</text>

<rect x="40" y="258" width="170" height="54" rx="6" fill="#fdecea" stroke="#d0453b" stroke-width="1.3"/>
<text x="125" y="280" font-size="9.8" fill="#a5342c" text-anchor="middle" font-weight="700">주가 &lt; BTC 보유가치</text>
<text x="125" y="294" font-size="9.8" fill="#a5342c" text-anchor="middle" font-weight="700">(mNAV &lt; 1)</text>

<rect x="410" y="258" width="170" height="54" rx="6" fill="#fdecea" stroke="#d0453b" stroke-width="1.3"/>
<text x="495" y="280" font-size="9.8" fill="#a5342c" text-anchor="middle" font-weight="700">증자 시 주당 BTC 희석</text>
<text x="495" y="294" font-size="9.8" fill="#a5342c" text-anchor="middle" font-weight="700">(디스카운트 심화)</text>

<rect x="410" y="348" width="170" height="54" rx="6" fill="#f4f0e8" stroke="#9a998d" stroke-width="1.3"/>
<text x="495" y="370" font-size="9.8" fill="#5a5950" text-anchor="middle" font-weight="700">증자 중단 또는</text>
<text x="495" y="384" font-size="9.8" fill="#5a5950" text-anchor="middle" font-weight="700">바이백 시도</text>

<rect x="40" y="348" width="170" height="54" rx="6" fill="#f4f0e8" stroke="#9a998d" stroke-width="1.3"/>
<text x="125" y="370" font-size="9.8" fill="#5a5950" text-anchor="middle" font-weight="700">차익거래 메커니즘 없음</text>
<text x="125" y="384" font-size="9.8" fill="#5a5950" text-anchor="middle" font-weight="700">(AP·환매 구조 無)</text>

<path d="M 210,285 L 410,285" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow2)"/>
<path d="M 495,312 L 495,348" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow2)"/>
<path d="M 410,375 L 210,375" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow2)"/>
<path d="M 125,348 L 125,312" fill="none" stroke="#9a998d" stroke-width="1.6" marker-end="url(#arrow2)"/>
<text x="130" y="333" font-size="9" fill="#767568" text-anchor="start">디스카운트</text>
<text x="130" y="344" font-size="9" fill="#767568" text-anchor="start">장기화 가능</text>

<rect x="40" y="420" width="540" height="40" rx="6" fill="#fbeee9" stroke="#d0453b" stroke-width="1"/>
<text x="310" y="444" font-size="10.3" fill="#a5342c" text-anchor="middle" font-weight="700">⚠ ETF의 AP 창조·환매 같은 강제 수렴 장치가 없어, 프리미엄도 디스카운트도 저절로 사라지지 않습니다</text>

<text x="310" y="482" font-size="9.5" fill="#9b9a8f" text-anchor="middle" font-style="italic">* 구조를 보여주기 위한 설명용 예시이며 실제 기업의 수치가 아닙니다</text>

<defs>
  <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#9a998d"/>
  </marker>
</defs>
</svg>
