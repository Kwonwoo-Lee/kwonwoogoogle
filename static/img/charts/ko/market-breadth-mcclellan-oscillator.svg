<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="640" height="430" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="24" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">시장폭 다이버전스: 지수는 신고가, 등락주선은 정체</text>

<!-- upper panel: index vs A-D line -->
<rect x="40" y="40" width="560" height="180" fill="none" stroke="#e1e0d9"/>
<text x="50" y="55" font-size="10.5" fill="#5a5950">지수 vs 등락주선(A-D Line)</text>

<!-- index price line: rising to new high -->
<path d="M 60,180 L 140,155 L 220,165 L 300,120 L 380,130 L 460,85 L 560,60" fill="none" stroke="#1a5fb4" stroke-width="2.8" stroke-linecap="round"/>
<circle cx="220" cy="165" r="4" fill="#1a5fb4"/>
<circle cx="560" cy="60" r="5" fill="#1a5fb4"/>
<text x="565" y="55" font-size="10" fill="#1a5fb4" font-weight="700" text-anchor="end">지수 신고가</text>

<!-- A-D line: fails to confirm -->
<path d="M 60,200 L 140,175 L 220,168 L 300,150 L 380,158 L 460,148 L 560,152" fill="none" stroke="#d0453b" stroke-width="2.8" stroke-linecap="round"/>
<circle cx="220" cy="168" r="4" fill="#d0453b"/>
<circle cx="460" cy="148" r="5" fill="#d0453b"/>
<text x="465" y="140" font-size="10" fill="#d0453b" font-weight="700">등락주선 정체(신고가 미확인)</text>

<!-- divergence marker -->
<line x1="220" y1="165" x2="220" y2="168" stroke="#c98a1f" stroke-width="0" />
<path d="M 460,85 L 460,148" stroke="#c98a1f" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="466" y="115" font-size="9.5" fill="#c98a1f" font-weight="700">약세 다이버전스</text>

<line x1="440" y1="200" x2="465" y2="200" stroke="#1a5fb4" stroke-width="2.8"/>
<text x="472" y="204" font-size="10" fill="#20201a">지수</text>
<line x1="510" y1="200" x2="535" y2="200" stroke="#d0453b" stroke-width="2.8"/>
<text x="542" y="204" font-size="10" fill="#20201a">등락주선</text>

<!-- lower panel: McClellan Oscillator -->
<rect x="40" y="245" width="560" height="150" fill="none" stroke="#e1e0d9"/>
<text x="50" y="260" font-size="10.5" fill="#5a5950">맥클레란 오실레이터</text>
<line x1="40" y1="320" x2="600" y2="320" stroke="#767568" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="605" y="324" font-size="9.5" fill="#767568">0선</text>

<path d="M 60,300 L 140,270 L 220,290 L 300,265 L 380,300 L 460,335 L 560,360" fill="none" stroke="#8a4fd1" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="300" cy="265" r="4" fill="#8a4fd1"/>
<circle cx="560" cy="360" r="5" fill="#8a4fd1"/>
<path d="M 415,320 L 415,345" stroke="#c98a1f" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="420" y="340" font-size="9.5" fill="#c98a1f" font-weight="700">0선 하향 이탈 = 시장폭 모멘텀 약화</text>

<text x="320" y="415" font-size="10" fill="#5a5950" text-anchor="middle">지수가 오르는 동안 등락주선은 고점을 넘지 못하고, 맥클레란 오실레이터는 0선 아래로 가라앉는 전형적인 약세 다이버전스 패턴</text>
</svg>
