<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="640" height="420" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="24" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">60/40 포트폴리오 vs 리스크 패리티: 자본 비중과 위험 기여도 비교</text>

<!-- panel frames -->
<rect x="45" y="46" width="265" height="344" rx="8" fill="none" stroke="#e1e0d9"/>
<rect x="330" y="46" width="265" height="344" rx="8" fill="none" stroke="#e1e0d9"/>

<text x="177" y="66" font-size="12.5" fill="#20201a" text-anchor="middle" font-weight="700">60/40 포트폴리오</text>
<text x="462" y="66" font-size="12.5" fill="#20201a" text-anchor="middle" font-weight="700">리스크 패리티 (예시)</text>

<!-- baseline -->
<line x1="55" y1="380" x2="300" y2="380" stroke="#767568" stroke-width="1.2"/>
<line x1="340" y1="380" x2="585" y2="380" stroke="#767568" stroke-width="1.2"/>

<!-- LEFT PANEL: 60/40 -->
<!-- group: 자본 비중 (stock 60 / bond 40) -->
<rect x="70" y="290" width="26" height="90" fill="#1a5fb4" opacity="0.85"/>
<text x="83" y="283" font-size="10.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">60%</text>
<rect x="102" y="320" width="26" height="60" fill="#c98a1f" opacity="0.85"/>
<text x="115" y="313" font-size="10.5" fill="#c98a1f" text-anchor="middle" font-weight="700">40%</text>
<text x="99" y="396" font-size="10" fill="#5a5950" text-anchor="middle">자본 비중</text>

<!-- group: 위험 기여도 (stock ~90 / bond ~10) -->
<rect x="170" y="245" width="26" height="135" fill="#1a5fb4" opacity="0.85"/>
<text x="183" y="238" font-size="10.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">~90%</text>
<rect x="202" y="365" width="26" height="15" fill="#c98a1f" opacity="0.85"/>
<text x="215" y="358" font-size="10.5" fill="#c98a1f" text-anchor="middle" font-weight="700">~10%</text>
<text x="199" y="396" font-size="10" fill="#5a5950" text-anchor="middle">위험 기여도</text>

<text x="177" y="412" font-size="10" fill="#b03a30" text-anchor="middle" font-weight="700">위험의 대부분을 주식이 차지</text>

<!-- RIGHT PANEL: risk parity -->
<!-- group: 자본 비중 (stock 25 / bond 75) -->
<rect x="355" y="342.5" width="26" height="37.5" fill="#1a5fb4" opacity="0.85"/>
<text x="368" y="335.5" font-size="10.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">25%</text>
<rect x="387" y="267.5" width="26" height="112.5" fill="#c98a1f" opacity="0.85"/>
<text x="400" y="260.5" font-size="10.5" fill="#c98a1f" text-anchor="middle" font-weight="700">75%</text>
<text x="384" y="396" font-size="10" fill="#5a5950" text-anchor="middle">자본 비중</text>

<!-- group: 위험 기여도 (stock 50 / bond 50) -->
<rect x="455" y="305" width="26" height="75" fill="#1a5fb4" opacity="0.85"/>
<text x="468" y="298" font-size="10.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">50%</text>
<rect x="487" y="305" width="26" height="75" fill="#c98a1f" opacity="0.85"/>
<text x="500" y="298" font-size="10.5" fill="#c98a1f" text-anchor="middle" font-weight="700">50%</text>
<text x="484" y="396" font-size="10" fill="#5a5950" text-anchor="middle">위험 기여도</text>

<text x="462" y="412" font-size="10" fill="#188a48" text-anchor="middle" font-weight="700">주식·채권이 위험을 절반씩 부담</text>

<!-- legend -->
<rect x="265" y="30" width="12" height="12" fill="#1a5fb4" opacity="0.85"/>
<text x="281" y="40" font-size="10" fill="#20201a">주식</text>
<rect x="325" y="30" width="12" height="12" fill="#c98a1f" opacity="0.85"/>
<text x="341" y="40" font-size="10" fill="#20201a">채권</text>
</svg>
