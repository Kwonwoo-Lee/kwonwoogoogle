<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="640" height="380" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="22" font-size="13.5" fill="#20201a" text-anchor="middle" font-weight="700">락업 해제와 오버행: 단계마다 늘어나는 유통주식수</text>

<!-- legend box -->
<rect x="438" y="32" width="172" height="70" rx="6" fill="#f3f2ec" stroke="#e1e0d9"/>
<text x="448" y="46" font-size="9.5" fill="#5a5950" font-weight="700">구성</text>
<circle cx="452" cy="59" r="4" fill="#1a5fb4"/>
<text x="461" y="62.5" font-size="9" fill="#20201a">공모주 유통물량 (해제 전)</text>
<circle cx="452" cy="74" r="4" fill="#8a4fd1"/>
<text x="461" y="77.5" font-size="9" fill="#20201a">단계적으로 풀리는 락업 물량</text>
<circle cx="452" cy="89" r="4" fill="#d0453b"/>
<text x="461" y="92.5" font-size="9" fill="#20201a">오버행 매도압력 지점</text>

<!-- axis -->
<line x1="40" y1="300" x2="612" y2="300" stroke="#9c9b8f" stroke-width="1"/>
<text x="45" y="48" font-size="10.5" fill="#5a5950" font-weight="700">유통주식수 비율</text>
<text x="45" y="60" font-size="9" fill="#9c9b8f">(전체 발행주식 대비, %)</text>

<!-- gridlines at 20/40/60/80/100% -->
<line x1="40" y1="260" x2="612" y2="260" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="2,3"/>
<text x="34" y="263" font-size="8" fill="#9c9b8f" text-anchor="end">20%</text>
<line x1="40" y1="220" x2="612" y2="220" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="2,3"/>
<text x="34" y="223" font-size="8" fill="#9c9b8f" text-anchor="end">40%</text>
<line x1="40" y1="180" x2="612" y2="180" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="2,3"/>
<text x="34" y="183" font-size="8" fill="#9c9b8f" text-anchor="end">60%</text>
<line x1="40" y1="140" x2="612" y2="140" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="2,3"/>
<text x="34" y="143" font-size="8" fill="#9c9b8f" text-anchor="end">80%</text>
<line x1="40" y1="100" x2="612" y2="100" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="2,3"/>
<text x="34" y="103" font-size="8" fill="#9c9b8f" text-anchor="end">100%</text>

<!-- Stage 1: IPO day, float = 20% -->
<g>
<rect x="70" y="260" width="70" height="40" fill="#1a5fb4" opacity="0.85"/>
<text x="105" y="314" font-size="9.5" fill="#20201a" text-anchor="middle" font-weight="700">상장일</text>
<text x="105" y="326" font-size="8.5" fill="#5a5950" text-anchor="middle">유통 20%</text>
</g>

<!-- Stage 2: +1 month, float = 35% -->
<g>
<rect x="190" y="260" width="70" height="40" fill="#1a5fb4" opacity="0.85"/>
<rect x="190" y="230" width="70" height="30" fill="#8a4fd1" opacity="0.85"/>
<circle cx="225" cy="214" r="5" fill="#d0453b"/>
<path d="M225 214 l-5 10 h10 z" fill="#d0453b"/>
<text x="225" y="314" font-size="9.5" fill="#20201a" text-anchor="middle" font-weight="700">+1개월</text>
<text x="225" y="326" font-size="8.5" fill="#5a5950" text-anchor="middle">유통 35%</text>
</g>

<!-- Stage 3: +3 months, float = 55% -->
<g>
<rect x="310" y="260" width="70" height="40" fill="#1a5fb4" opacity="0.85"/>
<rect x="310" y="190" width="70" height="70" fill="#8a4fd1" opacity="0.85"/>
<circle cx="345" cy="174" r="5" fill="#d0453b"/>
<path d="M345 174 l-5 10 h10 z" fill="#d0453b"/>
<text x="345" y="314" font-size="9.5" fill="#20201a" text-anchor="middle" font-weight="700">+3개월</text>
<text x="345" y="326" font-size="8.5" fill="#5a5950" text-anchor="middle">유통 55%</text>
<text x="345" y="338" font-size="8" fill="#b03a30" text-anchor="middle">기관 의무보유 해제</text>
</g>

<!-- Stage 4: +6 months, float = 100% -->
<g>
<rect x="430" y="260" width="70" height="40" fill="#1a5fb4" opacity="0.85"/>
<rect x="430" y="100" width="70" height="160" fill="#8a4fd1" opacity="0.85"/>
<circle cx="465" cy="84" r="5" fill="#d0453b"/>
<path d="M465 84 l-5 10 h10 z" fill="#d0453b"/>
<text x="465" y="314" font-size="9.5" fill="#20201a" text-anchor="middle" font-weight="700">+6개월</text>
<text x="465" y="326" font-size="8.5" fill="#5a5950" text-anchor="middle">유통 100%</text>
<text x="465" y="338" font-size="8" fill="#b03a30" text-anchor="middle">VC·임직원 보호예수 해제</text>
</g>

<!-- price reaction line, schematic dip after each unlock -->
<polyline points="105,260 180,255 225,255 250,268 310,263 345,263 372,278 430,272 465,272 495,286 560,282 600,282"
  fill="none" stroke="#d0453b" stroke-width="1.6" stroke-dasharray="4,3" opacity="0.7"/>
<text x="580" y="275" font-size="8" fill="#b03a30">주가 반응(개념도)</text>

<!-- divider -->
<line x1="40" y1="352" x2="612" y2="352" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="3,3"/>
<text x="320" y="368" font-size="9.5" fill="#5a5950" text-anchor="middle">같은 수요라도 해제 단계마다 유통물량이 늘어나면 균형가격에는 하방 압력이 생길 수 있다 (매수단가 격차에 따라 강도는 달라짐)</text>
</svg>
