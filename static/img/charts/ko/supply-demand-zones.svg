<path d="M 40,120 L 70,160 L 96,199 L 124,204 L 152,200 L 185,130 L 210,75 L 235,95 L 260,195 L 285,140" fill="none" stroke="#1a5fb4" stroke-width="3"/>

<circle cx="260" cy="195" r="5.5" fill="#1f9d55"/>
