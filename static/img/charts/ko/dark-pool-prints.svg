<text x="375" y="284" font-size="9" fill="#767568" text-anchor="middle">1일차</text>
<text x="435" y="284" font-size="9" fill="#767568" text-anchor="middle">2일차</text>
<text x="495" y="284" font-size="9" fill="#767568" text-anchor="middle">3일차</text>
<text x="555" y="284" font-size="9" fill="#767568" text-anchor="middle">4일차</text>

<text x="472" y="302" font-size="8.8" fill="#767568" text-anchor="middle">막대: 다크풀 거래비중(%)  ·  점: VWAP 상단 대량 프린트(크기=규모)</text>
</svg>
