<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="640" height="380" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="22" font-size="13.5" fill="#20201a" text-anchor="middle" font-weight="700">Buyback Blackout: The Demand Floor That Goes Dark Before Earnings</text>

<!-- legend box -->
<rect x="420" y="32" width="190" height="70" rx="6" fill="#f3f2ec" stroke="#e1e0d9"/>
<text x="430" y="46" font-size="9.5" fill="#5a5950" font-weight="700">Buyback intensity</text>
<circle cx="434" cy="59" r="4" fill="#1a5fb4"/>
<text x="443" y="62.5" font-size="9" fill="#20201a">Discretionary (pauses in blackout)</text>
<circle cx="434" cy="74" r="4" fill="#8a4fd1"/>
<text x="443" y="77.5" font-size="9" fill="#20201a">10b5-1 plan buying (keeps running)</text>
<circle cx="434" cy="89" r="4" fill="#d0453b"/>
<text x="443" y="92.5" font-size="9" fill="#20201a">Earnings release</text>

<!-- baseline -->
<line x1="40" y1="270" x2="612" y2="270" stroke="#e1e0d9" stroke-width="1"/>
<text x="45" y="90" font-size="10.5" fill="#5a5950" font-weight="700">Buy intensity</text>

<!-- weekly bars across a quarter: weeks 1-5 normal, blackout zone, recovery -->
<g>
<rect x="46" y="150" width="34" height="120" fill="#1a5fb4" opacity="0.8"/>
<text x="63" y="284" font-size="8.5" fill="#5a5950" text-anchor="middle">Wk 1</text>

<rect x="84" y="146" width="34" height="124" fill="#1a5fb4" opacity="0.8"/>
<text x="101" y="284" font-size="8.5" fill="#5a5950" text-anchor="middle">Wk 2</text>

<rect x="122" y="152" width="34" height="118" fill="#1a5fb4" opacity="0.8"/>
<text x="139" y="284" font-size="8.5" fill="#5a5950" text-anchor="middle">Wk 3</text>

<rect x="160" y="148" width="34" height="122" fill="#1a5fb4" opacity="0.8"/>
<text x="177" y="284" font-size="8.5" fill="#5a5950" text-anchor="middle">Wk 4</text>

<rect x="198" y="154" width="34" height="116" fill="#1a5fb4" opacity="0.8"/>
<text x="215" y="284" font-size="8.5" fill="#5a5950" text-anchor="middle">Wk 5</text>

<!-- blackout zone -->
<rect x="236" y="30" width="188" height="240" fill="#d0453b" opacity="0.08"/>
<text x="330" y="44" font-size="9.5" fill="#b03a30" text-anchor="middle" font-weight="700">Blackout window (discretionary buying paused)</text>

<rect x="236" y="228" width="34" height="42" fill="#8a4fd1" opacity="0.85"/>
<text x="253" y="284" font-size="8.5" fill="#5a5950" text-anchor="middle">Wk 6</text>

<rect x="274" y="228" width="34" height="42" fill="#8a4fd1" opacity="0.85"/>
<text x="291" y="284" font-size="8.5" fill="#5a5950" text-anchor="middle">Wk 7</text>

<rect x="312" y="228" width="34" height="42" fill="#8a4fd1" opacity="0.85"/>
<text x="329" y="284" font-size="8.5" fill="#5a5950" text-anchor="middle">Wk 8</text>

<rect x="350" y="228" width="34" height="42" fill="#8a4fd1" opacity="0.85"/>
<text x="367" y="284" font-size="8.5" fill="#5a5950" text-anchor="middle">Wk 9</text>

<circle cx="390" cy="200" r="5" fill="#d0453b"/>
<text x="390" y="186" font-size="9" fill="#b03a30" text-anchor="middle" font-weight="700">Earnings</text>
<rect x="386" y="228" width="16" height="42" fill="#8a4fd1" opacity="0.85"/>
<text x="394" y="284" font-size="7.5" fill="#5a5950" text-anchor="middle">Wk 10</text>

<!-- recovery -->
<rect x="412" y="160" width="26" height="110" fill="#1a5fb4" opacity="0.5"/>
<text x="425" y="284" font-size="7.5" fill="#5a5950" text-anchor="middle">+48h</text>

<rect x="446" y="150" width="34" height="120" fill="#1a5fb4" opacity="0.8"/>
<text x="463" y="284" font-size="8.5" fill="#5a5950" text-anchor="middle">Wk 11</text>

<rect x="484" y="146" width="34" height="124" fill="#1a5fb4" opacity="0.8"/>
<text x="501" y="284" font-size="8.5" fill="#5a5950" text-anchor="middle">Wk 12</text>

<rect x="522" y="150" width="34" height="120" fill="#1a5fb4" opacity="0.8"/>
<text x="539" y="284" font-size="8.5" fill="#5a5950" text-anchor="middle">Wk 1</text>

<rect x="560" y="146" width="34" height="124" fill="#1a5fb4" opacity="0.8"/>
<text x="577" y="284" font-size="8.5" fill="#5a5950" text-anchor="middle">Wk 2</text>
<text x="577" y="296" font-size="8" fill="#8a4fd1" text-anchor="middle">(next quarter)</text>
</g>

<!-- divider -->
<line x1="40" y1="308" x2="612" y2="308" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="3,3"/>
<text x="320" y="324" font-size="11" fill="#20201a" text-anchor="middle" font-weight="700">Discretionary vs. 10b5-1 mechanical buying</text>

<line x1="90" y1="350" x2="560" y2="350" stroke="#9c9b8f" stroke-width="1.6"/>
<circle cx="150" cy="350" r="6" fill="#1a5fb4"/>
<text x="150" y="340" font-size="9.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">Normal: both buyer types</text>
<text x="150" y="366" font-size="8.5" fill="#20201a" text-anchor="middle">Full demand floor active</text>

<circle cx="500" cy="350" r="6" fill="#8a4fd1"/>
<text x="500" y="340" font-size="9.5" fill="#8a4fd1" text-anchor="middle" font-weight="700">Blackout: mechanical only</text>
<text x="500" y="366" font-size="8.5" fill="#20201a" text-anchor="middle">Discretionary demand gap opens</text>
</svg>
