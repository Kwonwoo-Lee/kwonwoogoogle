<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="640" height="420" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="24" font-size="14" fill="#20201a" text-anchor="middle" font-weight="700">LLM 뉴스 감성분석 매매법: 텍스트가 매매 신호로 바뀌는 4단계</text>

<defs>
  <marker id="llmArrowKo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#767568"/>
  </marker>
  <marker id="llmArrowGreenKo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#1f9d55"/>
  </marker>
  <marker id="llmArrowRedKo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#d0453b"/>
  </marker>
</defs>

<!-- stage 1: ingestion -->
<rect x="30" y="48" width="150" height="64" rx="8" fill="#20201a" opacity="0.06" stroke="#767568" stroke-width="1.2"/>
<text x="105" y="70" font-size="11.5" fill="#20201a" text-anchor="middle" font-weight="700">1. 수집</text>
<text x="105" y="88" font-size="9.5" fill="#5a5950" text-anchor="middle">뉴스·공시·실적콜</text>
<text x="105" y="101" font-size="9.5" fill="#5a5950" text-anchor="middle">텍스트 실시간 수신</text>

<path d="M 180,80 L 206,80" fill="none" stroke="#767568" stroke-width="1.4" marker-end="url(#llmArrowKo)"/>

<!-- stage 2: scoring -->
<rect x="208" y="48" width="150" height="64" rx="8" fill="#1a5fb4" opacity="0.1" stroke="#1a5fb4" stroke-width="1.3"/>
<text x="283" y="70" font-size="11.5" fill="#1a5fb4" text-anchor="middle" font-weight="700">2. 점수화</text>
<text x="283" y="88" font-size="9.5" fill="#5a5950" text-anchor="middle">LLM/FinBERT가</text>
<text x="283" y="101" font-size="9.5" fill="#5a5950" text-anchor="middle">감성 점수 -1~+1 산출</text>

<path d="M 358,80 L 384,80" fill="none" stroke="#767568" stroke-width="1.4" marker-end="url(#llmArrowKo)"/>

<!-- stage 3: signal generation -->
<rect x="386" y="48" width="150" height="64" rx="8" fill="#8a4fd1" opacity="0.1" stroke="#8a4fd1" stroke-width="1.3"/>
<text x="461" y="70" font-size="11.5" fill="#6a3aa8" text-anchor="middle" font-weight="700">3. 신호 생성</text>
<text x="461" y="88" font-size="9.5" fill="#5a5950" text-anchor="middle">임계값 통과 +</text>
<text x="461" y="101" font-size="9.5" fill="#5a5950" text-anchor="middle">여러 문장 합의 확인</text>

<path d="M 461,112 L 461,138" fill="none" stroke="#767568" stroke-width="1.4" marker-end="url(#llmArrowKo)"/>

<!-- decision diamond -->
<rect x="371" y="140" width="180" height="56" rx="8" fill="#c98a1f" opacity="0.1" stroke="#c98a1f" stroke-width="1.3"/>
<text x="461" y="162" font-size="11" fill="#a9710f" text-anchor="middle" font-weight="700">거래량 확인 등</text>
<text x="461" y="178" font-size="11" fill="#a9710f" text-anchor="middle" font-weight="700">가격 데이터 필터</text>

<path d="M 400,196 L 330,228" fill="none" stroke="#1f9d55" stroke-width="1.6" marker-end="url(#llmArrowGreenKo)"/>
<text x="340" y="218" font-size="10.5" fill="#1f9d55" text-anchor="middle" font-weight="700">통과</text>

<path d="M 522,196 L 592,228" fill="none" stroke="#d0453b" stroke-width="1.6" marker-end="url(#llmArrowRedKo)"/>
<text x="585" y="218" font-size="10.5" fill="#d0453b" text-anchor="middle" font-weight="700">탈락</text>

<!-- stage 4: execution -->
<rect x="150" y="230" width="230" height="62" rx="8" fill="#1f9d55" opacity="0.09" stroke="#1f9d55" stroke-width="1.4"/>
<text x="265" y="253" font-size="12" fill="#188a48" text-anchor="middle" font-weight="700">4. 실행 · 리스크 필터</text>
<text x="265" y="270" font-size="10" fill="#5a5950" text-anchor="middle">사전 설정된 규칙대로</text>
<text x="265" y="283" font-size="10" fill="#5a5950" text-anchor="middle">포지션 크기·손절선 적용 후 체결</text>

<rect x="470" y="230" width="150" height="62" rx="8" fill="#d0453b" opacity="0.08" stroke="#d0453b" stroke-width="1.4"/>
<text x="545" y="253" font-size="12" fill="#b03a30" text-anchor="middle" font-weight="700">신호 폐기</text>
<text x="545" y="270" font-size="9.5" fill="#5a5950" text-anchor="middle">단일 헤드라인 과민반응</text>
<text x="545" y="283" font-size="9.5" fill="#5a5950" text-anchor="middle">방지를 위해 거래 없이 종료</text>

<rect x="60" y="310" width="520" height="80" rx="8" fill="#20201a" opacity="0.05" stroke="#767568" stroke-width="1.2"/>
<text x="320" y="333" font-size="11.5" fill="#20201a" text-anchor="middle" font-weight="700">핵심: 사람이 헤드라인을 읽고 해석하는 몇 초~몇 십 초의 시간차를 활용한다</text>
<text x="320" y="352" font-size="10" fill="#5a5950" text-anchor="middle">단일 문장이 아니라 여러 신호의 합의와 가격 데이터 확인을 거쳐야</text>
<text x="320" y="367" font-size="10" fill="#5a5950" text-anchor="middle">반어법·복잡한 문맥으로 인한 오분류 위험을 줄일 수 있다</text>
<text x="320" y="383" font-size="9.5" fill="#767568" text-anchor="middle">(과거 데이터 백테스트는 과최적화 위험이 있으므로 아웃오브샘플 검증이 필요하다)</text>

<text x="320" y="408" font-size="9.5" fill="#767568" text-anchor="middle">예시는 파이프라인 구조를 보여주기 위한 단순화된 도식입니다</text>
</svg>
