<text x="70" y="118" font-size="8.5" fill="#177a42" text-anchor="middle">500주</text>
<text x="310" y="118" font-size="8.5" fill="#177a42" text-anchor="middle">500주</text>
<text x="550" y="118" font-size="8.5" fill="#177a42" text-anchor="middle">500주</text>
<text x="310" y="135" font-size="9.3" fill="#5a5950" text-anchor="middle">체결될 때마다 같은 가격에서 같은 크기로 즉시 재노출 (거래량만 쌓이고 가격은 고정)</text>

<line x1="20" y1="150" x2="600" y2="150" stroke="#e1e0d9" stroke-width="1"/>

<!-- Panel 2: TWAP -->
<text x="40" y="174" font-size="12" fill="#1a5fb4" font-weight="700">② TWAP — 시간을 균등하게 쪼갠다</text>
<line x1="40" y1="230" x2="580" y2="230" stroke="#c7c6bb" stroke-width="1"/>
