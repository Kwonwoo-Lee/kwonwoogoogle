<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="640" height="430" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="320" y="24" font-size="13.5" fill="#20201a" text-anchor="middle" font-weight="700">Credit-Equity Divergence: Spreads Widen While the S&amp;P 500 Makes New Highs</text>

<!-- upper panel: S&P 500 vs HY OAS -->
<rect x="40" y="40" width="560" height="180" fill="none" stroke="#e1e0d9"/>
<text x="50" y="55" font-size="10.5" fill="#5a5950">S&amp;P 500 vs. High-Yield OAS (illustrative)</text>

<!-- S&P 500 line: rising to new high -->
<path d="M 60,180 L 140,160 L 220,165 L 300,130 L 380,135 L 460,100 L 560,70" fill="none" stroke="#1a5fb4" stroke-width="2.8" stroke-linecap="round"/>
<circle cx="220" cy="165" r="4" fill="#1a5fb4"/>
<circle cx="560" cy="70" r="5" fill="#1a5fb4"/>
<text x="565" y="62" font-size="10" fill="#1a5fb4" font-weight="700" text-anchor="end">S&amp;P 500: new high</text>

<!-- HY OAS line: grinding wider -->
<path d="M 60,195 L 140,192 L 220,186 L 300,175 L 380,163 L 460,150 L 560,135" fill="none" stroke="#c9532a" stroke-width="2.8" stroke-linecap="round"/>
<circle cx="220" cy="186" r="4" fill="#c9532a"/>
<circle cx="560" cy="135" r="5" fill="#c9532a"/>
<text x="565" y="128" font-size="10" fill="#c9532a" font-weight="700" text-anchor="end">HY OAS: grinding wider</text>

<path d="M 460,100 L 460,150" stroke="#c98a1f" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="340" y="112" font-size="10" fill="#c98a1f" font-weight="700" text-anchor="middle">Warning divergence: credit stress rises while equities ignore it</text>

<line x1="60" y1="204" x2="85" y2="204" stroke="#1a5fb4" stroke-width="2.8"/>
<text x="92" y="208" font-size="10" fill="#20201a">S&amp;P 500 (left axis, higher = up)</text>

<line x1="410" y1="204" x2="435" y2="204" stroke="#c9532a" stroke-width="2.8"/>
<text x="442" y="208" font-size="10" fill="#20201a">HY OAS (right axis, higher = wider)</text>

<!-- lower panel: HYG/LQD ratio -->
<rect x="40" y="245" width="560" height="150" fill="none" stroke="#e1e0d9"/>
<text x="50" y="260" font-size="10.5" fill="#5a5950">HYG / LQD Ratio (real-time proxy)</text>

<path d="M 60,290 L 140,295 L 220,300 L 300,315 L 380,325 L 460,340 L 560,355" fill="none" stroke="#8a4fd1" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="220" cy="300" r="4" fill="#8a4fd1"/>
<circle cx="560" cy="355" r="5" fill="#8a4fd1"/>

<path d="M 415,320 L 415,345" stroke="#c98a1f" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="420" y="340" font-size="9.5" fill="#c98a1f" font-weight="700">Ratio falls as high-yield underperforms investment-grade</text>

<text x="320" y="415" font-size="10" fill="#5a5950" text-anchor="middle">The S&amp;P 500 keeps climbing while HY OAS grinds wider and the HYG/LQD ratio slides — a classic credit-equity divergence, not a timing signal</text>
</svg>
