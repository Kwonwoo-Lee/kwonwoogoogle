<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="620" height="400" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="14.5" fill="#20201a" text-anchor="middle" font-weight="700">Supertrend: Resistance in a Downtrend Flips to Support in an Uptrend</text>

<line x1="300" y1="45" x2="300" y2="345" stroke="#c7c6bd" stroke-width="1" stroke-dasharray="3,3"/>
<text x="165" y="60" font-size="11.5" fill="#9a998d" text-anchor="middle">Downtrend</text>
<text x="440" y="60" font-size="11.5" fill="#9a998d" text-anchor="middle">Uptrend</text>

<!-- price line -->
<path d="M 40,150 L 90,172 L 140,160 L 190,188 L 240,205 L 270,218 L 300,215 L 330,175 L 360,150 L 400,128 L 440,108 L 480,88 L 520,68 L 560,50 L 590,38" fill="none" stroke="#1a5fb4" stroke-width="3"/>

<!-- red supertrend (downtrend, resistance, above price, ratchets down only) -->
<path d="M 40,88 L 90,100 L 140,112 L 190,126 L 240,140 L 270,150 L 300,158" fill="none" stroke="#d0453b" stroke-width="3"/>

<!-- green supertrend (uptrend, support, below price, ratchets up only) -->
<path d="M 300,240 L 330,205 L 360,178 L 400,152 L 440,128 L 480,105 L 520,85 L 560,65 L 590,55" fill="none" stroke="#1f9d55" stroke-width="3"/>

<!-- flip marker -->
<circle cx="300" cy="215" r="6" fill="#20201a"/>
<line x1="300" y1="215" x2="230" y2="270" stroke="#20201a" stroke-width="1" stroke-dasharray="4,3"/>
<text x="230" y="286" font-size="11.5" fill="#20201a" text-anchor="middle" font-weight="700">Close breaks above</text>
<text x="230" y="301" font-size="11" fill="#20201a" text-anchor="middle">= flip (stop-and-reverse)</text>

<text x="60" y="105" font-size="11" fill="#d0453b" text-anchor="start" font-weight="700">Resistance (ratchets down only)</text>
<text x="400" y="150" font-size="11" fill="#1f9d55" text-anchor="start" font-weight="700">Support (ratchets up only)</text>

<line x1="30" y1="345" x2="595" y2="345" stroke="#e1e0d9" stroke-width="1"/>

<rect x="44" y="368" width="12" height="12" fill="#1a5fb4"/>
<text x="60" y="378" font-size="11" fill="#20201a" text-anchor="start">Price</text>
<rect x="150" y="368" width="12" height="12" fill="#d0453b"/>
<text x="166" y="378" font-size="11" fill="#d0453b" text-anchor="start">Supertrend (downtrend, resistance)</text>
<rect x="420" y="368" width="12" height="12" fill="#1f9d55"/>
<text x="436" y="378" font-size="11" fill="#1f9d55" text-anchor="start">Supertrend (uptrend, support)</text>
</svg>
