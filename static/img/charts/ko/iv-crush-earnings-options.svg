<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect x="0" y="0" width="620" height="340" rx="12" fill="#fdfdfb" stroke="#e1e0d9"/>
<text x="310" y="26" font-size="14.5" fill="#20201a" text-anchor="middle" font-weight="700">IV 크러시 곡선 &amp; 예상 변동폭 범위</text>

<text x="30" y="50" font-size="12" fill="#5a5950" font-weight="700">실적 발표 전후 내재변동성(IV)</text>

<line x1="45" y1="270" x2="300" y2="270" stroke="#c7c6bb" stroke-width="1"/>
<line x1="45" y1="70" x2="45" y2="270" stroke="#c7c6bb" stroke-width="1"/>

<path d="M 45,232 C 100,220 150,190 195,120 C 205,105 212,95 220,90 C 228,96 238,120 250,175 C 262,215 275,232 300,236" fill="none" stroke="#d0453b" stroke-width="3"/>

<line x1="220" y1="70" x2="220" y2="270" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="220" y="284" font-size="10" fill="#a06a10" text-anchor="middle" font-weight="700">실적 발표</text>

<text x="70" y="112" font-size="10.5" fill="#5a5950">IV 상승(불확실성 반영)</text>
<text x="240" y="204" font-size="10.5" fill="#d0453b" font-weight="700">IV 크러시</text>

<text x="45" y="298" font-size="10" fill="#767568" text-anchor="start">D-5</text>
<text x="300" y="298" font-size="10" fill="#767568" text-anchor="end">D+1</text>
<text x="172" y="312" font-size="9.5" fill="#5a5950" text-anchor="middle">발표를 앞두고 부풀었던 IV가 발표 직후 급격히 꺼진다</text>

<line x1="325" y1="30" x2="325" y2="315" stroke="#e1e0d9" stroke-width="1"/>

<text x="475" y="50" font-size="12" fill="#5a5950" text-anchor="middle" font-weight="700">예상 변동폭(Expected Move) 범위</text>

<line x1="345" y1="240" x2="600" y2="240" stroke="#c7c6bb" stroke-width="1"/>
<text x="472" y="256" font-size="9" fill="#767568" text-anchor="middle">주가</text>

<rect x="405" y="90" width="135" height="120" fill="#1a5fb4" opacity="0.10"/>
<line x1="405" y1="90" x2="405" y2="240" stroke="#1a5fb4" stroke-width="1.5" stroke-dasharray="3,3"/>
<line x1="540" y1="90" x2="540" y2="240" stroke="#1a5fb4" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="405" y="83" font-size="9" fill="#1a5fb4" text-anchor="middle" font-weight="700">-예상변동폭</text>
<text x="540" y="83" font-size="9" fill="#1a5fb4" text-anchor="middle" font-weight="700">+예상변동폭</text>

<line x1="472" y1="90" x2="472" y2="240" stroke="#9a9990" stroke-width="1" stroke-dasharray="2,3"/>
<text x="472" y="228" font-size="9" fill="#767568" text-anchor="middle">현재가</text>

<circle cx="500" cy="150" r="6" fill="#1f9d55"/>
<text x="500" y="130" font-size="9.5" fill="#177a42" text-anchor="middle" font-weight="700">종가 A</text>
<text x="500" y="118" font-size="8.5" fill="#177a42" text-anchor="middle">범위 안 → 매도 유리</text>

<circle cx="565" cy="150" r="6" fill="#d0453b"/>
<text x="565" y="130" font-size="9.5" fill="#a5342c" text-anchor="middle" font-weight="700">종가 B</text>
<text x="565" y="118" font-size="8.5" fill="#a5342c" text-anchor="middle">범위 밖 → 매도 손실</text>

<text x="472" y="268" font-size="9.5" fill="#767568" text-anchor="middle">종가가 범위 안이면 변동성 매도자 이익, 범위를 벗어나면 손실</text>
</svg>
